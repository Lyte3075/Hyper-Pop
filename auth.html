<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Account ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"></head><body><script>location.replace("accounts.html")</script><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span></nav><main class="auth-card"><div style="text-align:center;font-size:50px">👤</div><h1 style="text-align:center">Your Hyper-Pop Account</h1><p style="color:var(--muted);text-align:center">Create a username and password to save leaderboard scores.</p><input id="u" maxlength="20" placeholder="Username"><input id="p" type="password" maxlength="100" placeholder="Password (6+ characters)"><button id="go">CREATE ACCOUNT</button><button id="switch" style="background:#ffffff08;color:#fff;border:1px solid var(--line)">I ALREADY HAVE AN ACCOUNT</button><div class="msg" id="m"></div></main></div><script src="app.js"></script><script>
let login=false;const u=document.getElementById('u'),p=document.getElementById('p'),go=document.getElementById('go'),sw=document.getElementById('switch'),m=document.getElementById('m');sw.onclick=()=>{login=!login;go.textContent=login?'LOG IN':'CREATE ACCOUNT';sw.textContent=login?'I NEED AN ACCOUNT':'I ALREADY HAVE AN ACCOUNT'};go.onclick=async()=>{m.textContent='Working…';const x=await hpRpc(login?'hyperpop_login':'hyperpop_signup',{p_username:u.value.trim(),p_password:p.value});if(x.ok){localStorage.setItem('hyperpop_token',x.token);location.href='index.html'}else m.textContent=x.error||'Something went wrong.'};
</script></body></html>
