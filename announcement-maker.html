<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b16">
<title>Announcement Maker · Hyper-Pop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#0b0b16;--ink:#f7f4ff;--muted:#aaa7c1;--pink:#ff5db1;--cyan:#4be0e3;--purple:#9b7bff;--line:#ffffff18}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#382052 0,transparent 34%),radial-gradient(circle at 95% 20%,#064450 0,transparent 30%),var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;padding:24px 16px}
main{max-width:760px;margin:0 auto}.back{display:inline-block;color:var(--cyan);text-decoration:none;margin-bottom:26px;font-size:14px}.eyebrow{font:11px "DM Mono";letter-spacing:.14em;color:var(--cyan)}h1{font-size:clamp(34px,7vw,54px);letter-spacing:-.06em;margin:10px 0} .intro{color:var(--muted);line-height:1.6;margin-bottom:26px}
.panel{border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);background:#111120d9;box-shadow:0 24px 70px #0005}
label{display:block;font-size:13px;font-weight:700;margin:18px 0 8px}input,textarea{width:100%;border:1px solid #ffffff20;border-radius:13px;background:#ffffff08;color:var(--ink);padding:13px 14px;font:15px "Space Grotesk",sans-serif;outline:none}input:focus,textarea:focus{border-color:#9b7bff}textarea{min-height:160px;resize:vertical;line-height:1.55}.hint{font-size:12px;color:var(--muted);margin-top:7px}.primary{margin-top:22px;border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(100deg,var(--pink),#c48aff,var(--cyan));color:#100e1b;font-weight:800;font-size:14px;cursor:pointer}.primary:disabled{opacity:.5;cursor:wait}.status{margin-top:16px;font-size:13px;color:var(--muted);min-height:20px}.status.error{color:#ff8295}.status.success{color:#70e6ad}.list{margin-top:28px;display:grid;gap:12px}.item{border:1px solid var(--line);background:#ffffff06;border-radius:15px;padding:15px}.item h3{margin:0 0 7px}.item p{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);margin:0 0 10px;line-height:1.5}.meta{font:11px "DM Mono";color:#8f8ba5}.denied{padding:22px;border:1px solid #ff718455;background:#ff52600d;border-radius:16px;color:#ffc0c7}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">← Back to Hyper-Pop</a>
<div class="eyebrow">HYPER-POP / ADMIN TOOLS</div>
<h1>Announcement Maker 📣</h1>
<p class="intro">Write an announcement and choose the exact date and time it should appear on the homepage. Scheduled announcements stay hidden until their display time.</p>
<section class="panel" id="gate"><p>Checking administrator access…</p></section>
</main>
<script src="app.js?v=announcement-admin-1"></script>
<script>
(function(){
const API='https://iapnejlttsqqefkpmelp.supabase.co/functions/v1/hyperpop-announcements';
const KEY='sb_publishable_TB7oC4nDlUJq-Gcb2yoTjQ_Dvbh6NlM';
const gate=document.getElementById('gate');
const token=()=>{try{return localStorage.getItem('hyperpop_token')||''}catch(_){return ''}};
const fmt=v=>{const d=new Date(v);return Number.isFinite(d.getTime())?d.toLocaleString():'Date unavailable'};
async function call(payload){const r=await fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Request failed.');return d}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
async function init(){
 try{
  if(!token())throw new Error('Sign in to an administrator account to use the announcement maker.');
  const data=await call({action:'admin-list',token:token()});
  gate.replaceChildren();
  const form=document.createElement('form');
  const titleLabel=el('label','', 'Announcement title');
  const title=document.createElement('input');title.required=true;title.maxLength=120;title.placeholder='A new update is here…';
  const textLabel=el('label','','Announcement text');
  const text=document.createElement('textarea');text.required=true;text.maxLength=5000;text.placeholder='Write the announcement for everyone to read…';
  const dateLabel=el('label','','Date and time shown');
  const date=document.createElement('input');date.type='datetime-local';date.required=true;
  const hint=el('div','hint','The announcement becomes visible on the homepage at this date and time. Your device’s local timezone is used.');
  const submit=el('button','primary','Schedule announcement');submit.type='submit';
  const status=el('div','status','');status.setAttribute('role','status');
  form.append(titleLabel,title,textLabel,text,dateLabel,date,hint,submit,status);
  gate.append(form);
  const list=el('div','list');gate.append(list);
  function render(items){list.replaceChildren();if(!items.length){list.append(el('p','hint','No announcements have been created yet.'));return}
   const heading=el('h2','','Existing announcements');list.append(heading);
   items.forEach(item=>{const card=el('article','item');card.append(el('h3','',item.title),el('p','',item.body),el('div','meta','Shown: '+fmt(item.show_at)+' · Created: '+fmt(item.created_at)));list.append(card)})
  }
  render(data.announcements||[]);
  const d=new Date(Date.now()+5*60000);d.setSeconds(0,0);date.value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  form.addEventListener('submit',async event=>{
   event.preventDefault();submit.disabled=true;status.className='status';status.textContent='Saving announcement…';
   try{const result=await call({action:'create',token:token(),title:title.value,text:text.value,show_at:new Date(date.value).toISOString()});status.className='status success';status.textContent='Announcement scheduled successfully.';form.reset();const refreshed=await call({action:'admin-list',token:token()});render(refreshed.announcements||[])}
   catch(error){status.className='status error';status.textContent=error.message||'Could not schedule announcement.'}
   finally{submit.disabled=false}
  });
 }catch(error){gate.replaceChildren(el('div','denied',error.message||'Administrator access required.'))}
}
init();
})();
</script>
</body>
</html>
