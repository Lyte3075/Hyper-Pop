<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b16">
<title>Announcement Maker · Hyper-Pop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--bg:#0b0b16;--ink:#f7f4ff;--muted:#aaa7c1;--pink:#ff5db1;--cyan:#4be0e3;--purple:#9b7bff;--line:#ffffff20}
*{box-sizing:border-box;min-width:0}
html{width:100%;min-height:100%;-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;width:100%;overflow-x:hidden;background:radial-gradient(circle at 10% 0,#382052 0,transparent 34%),radial-gradient(circle at 95% 20%,#064450 0,transparent 30%),var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;padding:clamp(14px,3.5vw,30px);padding-top:max(clamp(14px,3.5vw,30px),env(safe-area-inset-top))}
main{width:min(100%,760px);margin:0 auto}
.back{display:inline-flex;align-items:center;min-height:40px;color:var(--cyan);text-decoration:none;margin:0 0 20px;font-size:14px}
.eyebrow{font:11px "DM Mono",monospace;letter-spacing:.14em;color:var(--cyan);overflow-wrap:anywhere}
h1{font-size:clamp(30px,7vw,54px);line-height:1.05;letter-spacing:-.06em;margin:10px 0}
.intro{color:var(--muted);line-height:1.6;margin:0 0 24px;font-size:clamp(14px,2.5vw,16px)}
.panel{width:100%;min-width:0;border:1px solid var(--line);border-radius:clamp(16px,3vw,22px);padding:clamp(16px,4vw,30px);background:#111120eF;box-shadow:0 24px 70px #0005}
form{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 8px}
input,textarea{display:block;width:100%;max-width:100%;min-width:0;min-height:48px;border:1px solid #ffffff25;border-radius:13px;background:#ffffff0b;color:var(--ink);padding:12px 13px;font:16px "Space Grotesk",sans-serif;outline:none;appearance:none;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #9b7bff20}
input[type=datetime-local]{color-scheme:dark;min-height:50px}
textarea{min-height:150px;resize:vertical;line-height:1.55}
.date-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.date-field{min-width:0}
.date-field label{margin-top:18px}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
.primary{display:block;width:100%;min-height:48px;margin-top:22px;border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(100deg,var(--pink),#c48aff,var(--cyan));color:#100e1b;font-weight:800;font-size:14px;cursor:pointer}
.primary:disabled{opacity:.5;cursor:wait}
.status{margin-top:14px;font-size:13px;color:var(--muted);min-height:20px;overflow-wrap:anywhere}
.status.error{color:#ff8295}.status.success{color:#70e6ad}
.list{margin-top:28px;display:grid;gap:12px}
.list h2{font-size:clamp(19px,4vw,24px);margin:0 0 4px}
.item{width:100%;min-width:0;border:1px solid var(--line);background:#ffffff06;border-radius:15px;padding:clamp(13px,3vw,17px);overflow:hidden}
.item h3{font-size:17px;line-height:1.3;margin:0 0 7px;overflow-wrap:anywhere}
.item p{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);margin:0 0 10px;line-height:1.5}
.meta{font:11px/1.6 "DM Mono",monospace;color:#aaa7c1;overflow-wrap:anywhere}
.item-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.action-btn{min-height:38px;padding:8px 13px;border:1px solid #ffffff25;border-radius:10px;background:#ffffff0b;color:var(--ink);font:600 12px "Space Grotesk",sans-serif;cursor:pointer}
.action-btn.edit{border-color:#9b7bff66;color:#d5c6ff}
.action-btn.delete{border-color:#ff718455;color:#ff9cab}
.form-heading{font-size:16px;font-weight:700;margin:0 0 4px}
.cancel-edit{margin-top:10px;background:transparent;border:0;color:var(--muted);font:13px "Space Grotesk",sans-serif;cursor:pointer;padding:8px 0}

.denied{padding:clamp(16px,4vw,22px);border:1px solid #ff718455;background:#ff52600d;border-radius:16px;color:#ffc0c7;line-height:1.5;overflow-wrap:anywhere}
@media(max-width:560px){body{padding-left:14px;padding-right:14px}.date-grid{grid-template-columns:minmax(0,1fr);gap:0}.date-field label{margin-top:14px}.panel{padding:16px}.intro{margin-bottom:18px}}
@media(min-width:561px){.date-field input{font-size:14px}}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">← Back to Hyper-Pop</a>
<div class="eyebrow">HYPER-POP / ADMIN TOOLS</div>
<h1>Announcement Maker 📣</h1>
<p class="intro">Write an announcement and choose when it should appear and when it should disappear from the homepage. Only Sentinel administrators can publish announcements.</p>
<section class="panel" id="gate"><p>Checking administrator access…</p></section>
</main>
<script src="app.js?v=announcement-admin-3"></script>
<script>
(function(){
const API='https://iapnejlttsqqefkpmelp.supabase.co/functions/v1/hyperpop-announcements';
const KEY='sb_publishable_TB7oC4nDlUJq-Gcb2yoTjQ_Dvbh6NlM';
const gate=document.getElementById('gate');
const token=()=>{try{return localStorage.getItem('hyperpop_token')||''}catch(_){return ''}};
const fmt=v=>{const d=new Date(v);return Number.isFinite(d.getTime())?d.toLocaleString():'Date unavailable'};
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function localValue(value){const d=new Date(value);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
async function call(payload){const r=await fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Request failed.');return d}
async function init(){
 try{
  if(!token())throw new Error('Sign in to an administrator account to use the announcement maker.');
  let data=await call({action:'admin-list',token:token()});
  gate.replaceChildren();
  const form=document.createElement('form');
  const heading=el('div','form-heading','Create an announcement');
  const titleLabel=el('label','','Announcement title');
  const title=document.createElement('input');title.required=true;title.maxLength=120;title.placeholder='A new update is here…';title.autocomplete='off';
  const textLabel=el('label','','Announcement text');
  const text=document.createElement('textarea');text.required=true;text.maxLength=5000;text.placeholder='Write the announcement for everyone to read…';
  const dates=el('div','date-grid');
  const showWrap=el('div','date-field'),showLabel=el('label','','Date and time shown');
  const show=document.createElement('input');show.type='datetime-local';show.required=true;showLabel.append(show);showWrap.append(showLabel);
  const endWrap=el('div','date-field'),endLabel=el('label','','Date and time removed');
  const end=document.createElement('input');end.type='datetime-local';end.required=true;endLabel.append(end);endWrap.append(endLabel);
  dates.append(showWrap,endWrap);
  const hint=el('div','hint','The announcement appears at the start date and is automatically hidden at the end date. Times use your device’s local timezone. The end must be after the start.');
  const submit=el('button','primary','Schedule announcement');submit.type='submit';
  const cancel=el('button','cancel-edit','Cancel editing');cancel.type='button';cancel.hidden=true;
  const status=el('div','status','');status.setAttribute('role','status');
  form.append(heading,titleLabel,title,textLabel,text,dates,hint,submit,cancel,status);
  const list=el('div','list');gate.append(list);
  gate.append(form);
  let editingId=null;
  function resetEditor(){editingId=null;form.reset();heading.textContent='Create an announcement';submit.textContent='Schedule announcement';cancel.hidden=true}
  function render(items){
   list.replaceChildren();list.append(el('h2','','Your announcements'));
   if(!items.length){list.append(el('p','hint','You have not made any announcements yet.'));return}
   items.forEach(item=>{
    const card=el('article','item');
    card.append(el('h3','',item.title),el('p','',item.body),el('div','meta','Shown: '+fmt(item.show_at)+' · Ends: '+(item.end_at?fmt(item.end_at):'No end date')+' · Created: '+fmt(item.created_at)));
    const actions=el('div','item-actions');
    const edit=el('button','action-btn edit','Edit');edit.type='button';edit.addEventListener('click',()=>{editingId=item.id;heading.textContent='Edit announcement';title.value=item.title;text.value=item.body;show.value=localValue(item.show_at);end.value=localValue(item.end_at||new Date(new Date(item.show_at).getTime()+7*24*60*60*1000));submit.textContent='Save changes';cancel.hidden=false;status.className='status';status.textContent='Editing this announcement.';form.scrollIntoView({behavior:'smooth',block:'start'});title.focus()});
    const del=el('button','action-btn delete','Delete');del.type='button';del.addEventListener('click',async()=>{if(!confirm('Delete “'+item.title+'”? This cannot be undone.'))return;del.disabled=true;try{await call({action:'delete',token:token(),id:item.id});if(editingId===item.id)resetEditor();const refreshed=await call({action:'admin-list',token:token()});render(refreshed.announcements||[]);status.className='status success';status.textContent='Announcement deleted.'}catch(error){status.className='status error';status.textContent=error.message||'Could not delete announcement.';del.disabled=false}});
    actions.append(edit,del);card.append(actions);list.append(card);
   });
  }
  render(data.announcements||[]);
  const now=Date.now(),start=new Date(now+5*60000),finish=new Date(now+7*24*60*60000);
  start.setSeconds(0,0);finish.setSeconds(0,0);show.value=localValue(start);end.value=localValue(finish);
  cancel.addEventListener('click',()=>{resetEditor();status.className='status';status.textContent='Editing cancelled.'});
  form.addEventListener('submit',async event=>{
   event.preventDefault();
   const startDate=new Date(show.value),endDate=new Date(end.value);
   if(!show.value||!end.value||!Number.isFinite(startDate.getTime())||!Number.isFinite(endDate.getTime())||endDate<=startDate){status.className='status error';status.textContent='Choose an end date and time later than the display date.';return}
   submit.disabled=true;status.className='status';status.textContent=editingId?'Updating announcement…':'Saving announcement…';
   try{
    const payload={action:editingId?'edit':'create',token:token(),title:title.value,text:text.value,show_at:startDate.toISOString(),end_at:endDate.toISOString()};
    if(editingId)payload.id=editingId;
    await call(payload);const wasEditing=!!editingId;resetEditor();status.className='status success';status.textContent=wasEditing?'Announcement updated successfully.':'Announcement scheduled successfully.';
    const refreshed=await call({action:'admin-list',token:token()});render(refreshed.announcements||[]);
   }catch(error){status.className='status error';status.textContent=error.message||'Could not save announcement.'}
   finally{submit.disabled=false}
  });
 }catch(error){gate.replaceChildren(el('div','denied',error.message||'Administrator access required.'))}
}
init();
})();
</script>
</body>
</html>
