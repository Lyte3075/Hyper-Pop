<script>
const AudioEngine = {
    ctx: null, nextNoteTime: 0, isPlaying: false, scale: [50, 53, 55, 58, 60, 62, 65],
    beatCount: 0, bossLowHealthActive: false, masterFilter: null,
    init() { 
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterFilter = this.ctx.createBiquadFilter();
            this.masterFilter.type = 'lowpass';
            this.masterFilter.frequency.value = 20000;
            this.masterFilter.connect(this.ctx.destination);
        } 
    },
    playDrum(type, time, vol) {
        const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.connect(g); g.connect(this.masterFilter);
        if(type === 'kick') {
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.1);
            g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
        } else if(type === 'snare') {
            const filter = this.ctx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = 1000;
            const noise = this.ctx.createBufferSource();
            const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.05, this.ctx.sampleRate);
            const data = buffer.getChannelData(0); for(let i=0; i<data.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer; noise.connect(filter); filter.connect(g);
            g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
            noise.start(time); return;
        } else if(type === 'hat') {
            const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000;
            const osc2 = this.ctx.createOscillator(); osc2.type = 'square'; osc2.frequency.value = 10000;
            osc2.connect(f); f.connect(g); g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.01, time + 0.02);
            osc2.start(time); osc2.stop(time + 0.02); return;
        }
        osc.start(time); osc.stop(time + 0.1);
    },
    playSynthPad(freq, time, duration, vol) {
        const osc = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
        osc.type = (currentRankIdx >= 15) ? 'square' : 'sawtooth';
        osc.frequency.value = freq;
        f.type = 'lowpass'; f.frequency.setValueAtTime(100, time);
        f.frequency.exponentialRampToValueAtTime(1500 + (currentRankIdx * 100), time + duration/2);
        g.gain.setValueAtTime(0, time); g.gain.linearRampToValueAtTime(vol, time + 0.1);
        g.gain.linearRampToValueAtTime(0, time + duration);
        osc.connect(f); f.connect(g); g.connect(this.masterFilter);
        osc.start(time); osc.stop(time + duration);
    },
    playArp(freq, time, vol) {
        const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'triangle'; osc.frequency.value = freq * 2;
        g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
        osc.connect(g); g.connect(this.masterFilter);
        osc.start(time); osc.stop(time + 0.1);
    },
    playShockwave() {
        this.init(); const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.3);
        g.gain.setValueAtTime(0.2, this.ctx.currentTime); g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        osc.connect(g); g.connect(this.masterFilter); osc.start(); osc.stop(this.ctx.currentTime + 0.3);
    },
    playShoot(type) {
        this.init(); const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
        osc.connect(g); g.connect(this.masterFilter);
        osc.frequency.setValueAtTime(type==='SNIPER'?400:800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime+0.1);
        g.gain.setValueAtTime(0.1, this.ctx.currentTime); g.gain.linearRampToValueAtTime(0, this.ctx.currentTime+0.1);
        osc.start(); osc.stop(this.ctx.currentTime+0.1);
    },
    playExplode() {
        this.init(); const g = this.ctx.createGain(), osc = this.ctx.createOscillator();
        osc.connect(g); g.connect(this.masterFilter); osc.type = 'sawtooth'; 
        osc.frequency.setValueAtTime(60, this.ctx.currentTime); osc.frequency.linearRampToValueAtTime(20, this.ctx.currentTime+0.5);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime); g.gain.linearRampToValueAtTime(0, this.ctx.currentTime+0.5);
        osc.start(); osc.stop(this.ctx.currentTime+0.5);
    },
    playRank() {
        this.init(); [440, 660, 880].forEach((f, i) => {
            const o = this.ctx.createOscillator(), g = this.ctx.createGain();
            o.connect(g); g.connect(this.masterFilter); o.frequency.value = f;
            g.gain.setValueAtTime(0, this.ctx.currentTime + i*0.1); g.gain.linearRampToValueAtTime(0.1, this.ctx.currentTime + i*0.1 + 0.05);
            g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + i*0.1 + 0.3);
            o.start(this.ctx.currentTime + i*0.1); o.stop(this.ctx.currentTime + i*0.1 + 0.3);
        });
    },
    scheduler() {
        if (!this.isPlaying) return;
        while (this.nextNoteTime < this.ctx.currentTime + 0.2) {
            let isSlow = player && player.slowMoUltTimer > 0;
            let beatDur = hardModeToggled ? 0.2 : 0.25;
            if(isSlow) beatDur *= 2.5; 

            const r = currentRankIdx;
            if(this.beatCount % 8 === 0) {
                const freq = (440 * Math.pow(2, (this.scale[Math.floor(Math.random()*this.scale.length)]-69)/12)) / (isSlow?2:1);
                this.playSynthPad(freq, this.nextNoteTime, 3.5 * (isSlow?2:1), 0.08 + (r*0.005));
            }
            if(r >= 5 && this.beatCount % 4 === 0) this.playDrum('kick', this.nextNoteTime, 0.3 + (r*0.01));
            if(r >= 10 && this.beatCount % 4 === 2) this.playDrum('snare', this.nextNoteTime, 0.2 + (r*0.01));
            if(r >= 15) this.playDrum('hat', this.nextNoteTime, 0.1);
            if(r >= 22 && this.beatCount % 2 === 0) {
                const arpFreq = (880 * Math.pow(2, (this.scale[this.beatCount % 7]-69)/12));
                this.playArp(arpFreq, this.nextNoteTime, 0.05);
            }
            if(r >= 30 && this.beatCount % 4 === 0) {
                this.playSynthPad(55, this.nextNoteTime, 0.2, 0.2);
            }
            
            this.beatCount++;
            this.nextNoteTime += beatDur;
        }
        
        if(this.masterFilter) {
            let targetFreq = (player && player.slowMoUltTimer > 0) ? 450 : 20000;
            this.masterFilter.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.1);        }
        setTimeout(() => this.scheduler(), 50);
    },
    startMusic() { this.init(); if(this.isPlaying) return; this.isPlaying=true; this.nextNoteTime=this.ctx.currentTime; this.scheduler(); }
};

const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let gameState = 'MENU', score = 0, lastBossScore = 0, lastSuperBossScore = 0, frameCount = 0, lastTime = 0, shakeAmount = 0, hardModeToggled = false;
let player, bots = [], projectiles = [], map = { platforms: [], bgPillars: [], bgBuildings: [] }, effects = [], particles = [];
let stylePoints = 0, currentRankIdx = 0, airCombo = 0, maxAirCombo = 0, slowMoTimer = 0;

const ranks = [
    { threshold: 0, n: "U suck", c: "#95a5a6" }, { threshold: 5000, n: "Poor", c: "#7f8c8d" },
    { threshold: 10000, n: "Fine", c: "#bdc3c7" }, { threshold: 15000, n: "Decent", c: "#ecf0f1" },
    { threshold: 20000, n: "Warming Up", c: "#1abc9c" }, { threshold: 27000, n: "Moving", c: "#16a085" },
    { threshold: 35000, n: "Stylish", c: "#2ecc71" }, { threshold: 42000, n: "Smooth", c: "#27ae60" },
    { threshold: 50000, n: "Ur on smth", c: "#3498db" }, { threshold: 57000, n: "Focusing", c: "#2980b9" },
    { threshold: 65000, n: "Brutal", c: "#34495e" }, { threshold: 72000, n: "Cold", c: "#2c3e50" },
    { threshold: 80000, n: "Locked In", c: "#9b59b6" }, { threshold: 90000, n: "Vicious", c: "#8e44ad" },
    { threshold: 100000, n: "Relentless", c: "#6c5ce7" }, { threshold: 110000, n: "Furious", c: "#a29bfe" },
    { threshold: 120000, n: "Ur cooking", c: "#e67e22" }, { threshold: 135000, n: "Heated", c: "#d35400" },
    { threshold: 150000, n: "Menacing", c: "#ff7675" }, { threshold: 165000, n: "Aura", c: "#fab1a0" },
    { threshold: 180000, n: "Main Character", c: "#e84393" }, { threshold: 195000, n: "Protagonist", c: "#fd79a8" },
    { threshold: 210000, n: "Savage", c: "#c0392b" }, { threshold: 230000, n: "Ruthless", c: "#d63031" },
    { threshold: 250000, n: "Absolute Cinema", c: "#e74c3c" }, { threshold: 320000, n: "Peak", c: "#ff4d4d" },
    { threshold: 400000, n: "Overkill", c: "#eb4d4b" }, { threshold: 500000, n: "Slayer", c: "#ff9f43" },
    { threshold: 600000, n: "Godlike", c: "#00cec9" }, { threshold: 700000, n: "Immortal", c: "#81ecec" },
    { threshold: 800000, n: "Supreme", c: "#fdcb6e" }, { threshold: 900000, n: "Universal", c: "#ffeaa7" },
    { threshold: 1000000, n: "Ultrakill", c: "#6c5ce7" }, { threshold: 1300000, n: "Annihilator", c: "#a29bfe" },
    { threshold: 1600000, n: "Dimension Bender", c: "#00b894" }, { threshold: 2000000, n: "Reality Hack", c: "#55efc4" },
    { threshold: 2500000, n: "FRAMESHOT!", c: "#f1c40f" }, { threshold: 5000000, n: "ASCENDED🗣️🔥", c: "#ffffff" }
];

const keys = {};
const joyZone = document.getElementById('joystick-zone');
let joyStart = null;
joyZone.ontouchstart = e => { joyStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
joyZone.ontouchmove = e => {
    if(!joyStart) return;
    const dx = e.touches[0].clientX - joyStart.x, dy = e.touches[0].clientY - joyStart.y;
    keys['arrowleft'] = dx < -20; keys['arrowright'] = dx > 20; keys['arrowup'] = dy < -30;
};
joyZone.ontouchend = () => { joyStart = null; keys['arrowleft'] = keys['arrowright'] = keys['arrowup'] = false; };

function handleAction(key, isPressed) { keys[key] = isPressed; }
function handleUlt() { if(player) player.triggerUlt(); }
function handleShield() { if(player) player.triggerShield(); }
function handleDash() { if(player) player.triggerDash(); }
function handleSlowMo() { if(player) player.triggerSlowMo(); }
function handleSwap() { if(player) player.idx = (player.idx + 1) % player.weapons.length; }
function handleSlam() { if(player) player.triggerSlam(); }

window.onkeydown=e=>{ 
    const k = e.key.toLowerCase(); keys[k]=true; 
    if(k==='r') handleSwap(); if(k==='q') handleUlt(); if(k==='t') handleShield();
    if(k==='g') handleSlowMo(); if(e.key === 'Shift') handleDash(); if(k==='v') handleSlam();
    if(k==='p' || e.key === 'Escape') togglePause(); 
};
window.onkeyup=e=>{ keys[e.key.toLowerCase()]=false; };

function togglePause() {
    if (gameState === 'PLAYING') { gameState = 'PAUSED'; document.getElementById('pause-screen').style.display = 'flex'; }
    else if (gameState === 'PAUSED') { gameState = 'PLAYING'; document.getElementById('pause-screen').style.display = 'none'; lastTime = performance.now(); requestAnimationFrame(loop); }
}
function quitToMenu() { location.reload(); }
function toggleHardMode() { hardModeToggled = !hardModeToggled; document.getElementById('hard-mode-btn').innerText = `HARD MODE: ${hardModeToggled ? 'ON' : 'OFF'}`; }

class Player {
    constructor(){
        this.x=1500; this.y=300; this.w=30; this.h=60; this.vx=0; this.vy=0; this.hp=250; this.grounded=false;
        this.weapons=[{n:'PISTOL', d:35, r:0.2}, {n:'SHOTGUN', d:45, r:0.7, spr:true}, {n:'RPG', d:450, r:1.2, aoe:180}, {n:'SNIPER', d:600, r:1.4}];
        this.idx=0; this.timer=0; this.facingRight=true; this.grapple = { active: false, x: 0, y: 0 };
        this.ultCooldown = 0; this.shieldTimer = 0; this.shieldCooldown = 0;
        this.dashTimer = 0; this.dashCooldown = 0;
        this.slowMoUltTimer = 0; this.slowMoUltCooldown = 0;
        this.slamming = false;
        this.slamCooldown = 0;
    }
    update(dt){
        if(this.slamming) {
            this.vy = 2500;
            this.vx = 0;
        } else if(this.dashTimer > 0) {
            this.vx = this.facingRight ? 2000 : -2000;
            this.vy = 0;
            this.dashTimer -= dt;
        } else {
            if (keys['arrowleft']) { this.vx -= 70; this.facingRight = false; }
            if (keys['arrowright']) { this.vx += 70; this.facingRight = true; }
            this.vx *= 0.9;
            if(keys['arrowup'] && this.grounded){this.vy=-1100; this.grounded=false;}
        }

        if (keys['f']) {
            if (!this.grapple.active) { this.grapple.x = this.x + (this.facingRight ? 600 : -600); this.grapple.y = this.y - 650; this.grapple.active = true; }
            let dx = this.grapple.x - this.x, dy = this.grapple.y - this.y, dist = Math.hypot(dx, dy);
            this.vx += (dx / dist) * 85; this.vy += (dy / dist) * 85; this.grounded = false;
        } else { if(this.grapple.active) this.shockwave(); this.grapple.active = false; }

        this.timer = Math.max(0, this.timer - dt);
        this.ultCooldown = Math.max(0, this.ultCooldown - dt);
        this.shieldTimer = Math.max(0, this.shieldTimer - dt);
        this.shieldCooldown = Math.max(0, this.shieldCooldown - dt);
        this.dashCooldown = Math.max(0, this.dashCooldown - dt);
        this.slowMoUltTimer = Math.max(0, this.slowMoUltTimer - dt);
        this.slowMoUltCooldown = Math.max(0, this.slowMoUltCooldown - dt);
        this.slamCooldown = Math.max(0, this.slamCooldown - dt);

        if(keys['e'] && this.timer <= 0) this.fire();
        this.vy += 2300 * dt; this.x += this.vx * dt; this.y += this.vy * dt;
        let wasGrounded = this.grounded; this.grounded = false;
        if(this.y+this.h > 670){this.y=670-this.h;this.vy=0;this.grounded=true;}
        map.platforms.forEach(p=>{if(this.x<p.x+p.w && this.x+this.w>p.x && this.y+this.h>p.y && this.y+this.h<p.y+20 && this.vy>=0){this.y=p.y-this.h;this.vy=0;this.grounded=true;}});
        
        if(this.grounded && !wasGrounded) {
            if(this.slamming) {
                this.slamming = false;
                this.shockwave(5000);
                stylePoints += 500;
                this.slamCooldown = 10;
            }
            if(airCombo > 0) { stylePoints += airCombo * 600; airCombo = 0; }
        }
        this.x = Math.max(0, Math.min(this.x, 3000-this.w));
    }
    triggerSlam() { if(!this.grounded && this.slamCooldown <= 0) this.slamming = true; }
    triggerDash(){
        if(this.dashCooldown > 0) return;
        this.dashTimer = 0.2; this.dashCooldown = 10;
        for(let i=0; i<10; i++) particles.push({x: this.x, y: this.y + 30, vx: (Math.random()-0.5)*500, vy: (Math.random()-0.5)*500, life: 0.5, c: '#2ecc71'});
    }
    triggerSlowMo(){
        if(this.slowMoUltCooldown > 0) return;
        this.slowMoUltTimer = 15; this.slowMoUltCooldown = 75;
    }
    shockwave(customDamage = 0){
        AudioEngine.playShockwave(); spawnExplosion(this.x+this.w/2, this.y+this.h/2, 350);
        shakeAmount = 25; let parrySuccess = false;
        if(customDamage > 0) {
            bots.forEach(b => {
                if(Math.hypot(b.x - (this.x+this.w/2), b.y - (this.y+this.h/2)) < 350) {
                    b.hp -= customDamage;
                    if(b.hp <= 0) { score += b.type==='boss'||b.type==='superboss'?5000:250; addToKillFeed("GROUND", "SLAM"); }
                }
            });
        }
        projectiles.forEach(p => { if(!p.p && Math.hypot(p.x-(this.x+this.w/2), p.y-(this.y+this.h/2)) < 350) { p.p = true; p.vx *= -2; p.vy *= -2; stylePoints += 250; parrySuccess = true; } });
        if(parrySuccess) this.hp = 250;
    }
    triggerShield(){ if(this.shieldCooldown > 0) return; this.shieldTimer = 10; this.shieldCooldown = 60; }
    triggerUlt(){
        if(this.ultCooldown > 0) return;
        this.ultCooldown = 30;
        for(let i=0; i<3; i++) setTimeout(() => this.fireUltWave(), i * 500);
    }
    fireUltWave(){
        AudioEngine.playShockwave(); spawnExplosion(this.x+this.w/2, this.y+this.h/2, 800);
        shakeAmount = 50;
        bots.forEach(b => {
            if(Math.hypot(b.x - (this.x+this.w/2), b.y - (this.y+this.h/2)) < 800) {
                b.hp -= 3000;
                if(b.hp <= 0) { score += b.type==='boss'||b.type==='superboss'?5000:250; addToKillFeed("ULTIMATE", "WAVE"); stylePoints += 1000; }
            }
        });
    }
    fire(){
        const w=this.weapons[this.idx]; this.timer=w.r; AudioEngine.playShoot(w.n);
        let a = this.facingRight ? 0 : Math.PI;
        let finalName = (w.n==='RPG' && stylePoints >= 50000) ? 'TRIPLE RPG' : w.n;
        const spawn = (ang) => projectiles.push(new Projectile(this.x+15,this.y+20,ang,1800,w.d,true,w.aoe,finalName));
        if(w.spr){for(let i=-2;i<=2;i++) spawn(a+i*0.15);} 
        else if(w.n === 'RPG' && stylePoints >= 50000){for(let i=-1;i<=1;i++) spawn(a+i*0.25);}
        else {spawn(a);}
        shakeAmount = w.aoe ? 18 : 5;
    }
}

function spawnExplosion(x, y, radius) {
    AudioEngine.playExplode(); effects.push({x, y, r:0, maxR:radius, life:1});
    for(let i=0; i<20; i++) particles.push({x, y, vx:(Math.random()-0.5)*1500, vy:(Math.random()-0.5)*1500, life:1, c: '#e67e22'});
}

class Bot {
    constructor(x,y,type='ground'){ 
        Object.assign(this,{x,y,type,w:30,h:60,hp:200,timer:1.5}); 
        if(type==='boss'){this.w=80; this.h=120; this.hp=3000; this.timer=0.5;} 
        if(type==='superboss'){this.w=120; this.h=180; this.hp=20000; this.timer=1.0;}
        if(type==='fly'){this.hp=80; this.timer=2;} 
    }
    update(dt, isHard){
        let speed = (isHard ? 220 : 160);
        if(this.type === 'fly') { this.x += (player.x > this.x ? 1 : -1) * speed * dt; this.y += Math.sin(Date.now()/500)*3; } 
        else { 
            let moveSpeed = speed; if(this.type==='boss') moveSpeed = 100; if(this.type==='superboss') moveSpeed = 60; if(this.type==='explosive') moveSpeed *= 1.5;
            this.x += (player.x > this.x ? 1 : -1) * moveSpeed * dt; 
            if(this.y+this.h < 670) this.y += 500 * dt; else this.y = 670-this.h; 
        }
        if(this.type==='explosive' && Math.hypot(this.x-player.x, this.y-player.y) < 50) this.hp = 0;
        this.timer -= dt;
        if(this.timer <= 0 && this.type !== 'explosive') {             this.timer = (this.type==='boss'||this.type==='superboss') ? 0.5 : 1.8; 
            let dmg = (this.type==='superboss') ? 50 : 10;
            projectiles.push(new Projectile(this.x+this.w/2, this.y+20, Math.atan2(player.y-this.y, player.x-this.x), 800, dmg, false)); 
        }
    }
}

class Projectile {
    constructor(x,y,a,s,d,p,aoe=0,wn=''){Object.assign(this,{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,d,p,aoe,wn,active:true});}
    update(dt){
        this.x+=this.vx*dt; this.y+=this.vy*dt;
        let targets = this.p ? bots : [player];
        targets.forEach(t=>{
            if(this.x>t.x && this.x<t.x+t.w && this.y>t.y && this.y<t.y+t.h){
                if(!this.p && t === player && (player.shieldTimer > 0 || player.dashTimer > 0)) {
                    if(player.shieldTimer > 0) {
                        this.p = true; this.vx *= -1.2; this.vy *= -1.2; this.active = true;
                        stylePoints += 150; shakeAmount = 10;
                        for(let i=0; i<8; i++) particles.push({x: this.x, y: this.y, vx: (Math.random()-0.5)*800, vy: (Math.random()-0.5)*800, life: 0.6, c: '#3498db'});
                    } else { this.active = false; } 
                } else {
                    if(this.aoe) this.explode(); else { if(this.p || (player.shieldTimer <= 0 && player.dashTimer <= 0)) t.hp -= this.d; this.active = false; }
                    if(this.p) { 
                        if(!player.grounded) { airCombo++; maxAirCombo = Math.max(maxAirCombo, airCombo); } 
                        if(t.hp <= 0) { let pts = t.type==='superboss'?10000:(t.type==='boss'?2000:250); score += pts; addToKillFeed(t.type.toUpperCase(), this.wn || "REFLECTED"); stylePoints += 500; } 
                    } else { if(player.shieldTimer <= 0 && player.dashTimer <= 0) airCombo = 0; }
                }
            }
        });
        if(this.y>750 || this.x<0 || this.x>3000) this.active = false;
    }
    explode(){ spawnExplosion(this.x, this.y, this.aoe); bots.forEach(b => { if(Math.hypot(b.x-this.x, b.y-this.y) < this.aoe) { b.hp -= this.d; if(b.hp <=0) score += 250; }}); this.active = false; }
}

function addToKillFeed(type, weapon) {
    const feed = document.getElementById('kill-feed'), item = document.createElement('div');
    item.className = 'feed-item'; item.style.borderColor = ranks[currentRankIdx].c;
    item.innerHTML = `${type} <span style="color:#f1c40f">[${weapon}]</span>`;
    feed.appendChild(item); setTimeout(() => item.remove(), 2500);
}

function initGame(){
    AudioEngine.startMusic(); gameState='PLAYING'; score = hardModeToggled ? 15000 : 0; stylePoints = score;
    airCombo=0; maxAirCombo=0; lastBossScore = Math.floor(score/5000)*5000; lastSuperBossScore = Math.floor(score/20000)*20000;
    bots=[]; projectiles=[]; effects=[]; particles=[];
    map.platforms = []; for(let i=0; i<15; i++) map.platforms.push({x: Math.random()*2700, y: 550 - i*120, w: 250});
    map.bgBuildings = []; for(let i=0; i<20; i++) map.bgBuildings.push({x: i*200, w: 150, h: 300+Math.random()*400});
    map.bgPillars = []; for(let i=0; i<10; i++) map.bgPillars.push({x: Math.random()*3000, w: 10, c: Math.random()>0.5?'#3498db':'#f1c40f'});
    player=new Player();
    ['start-screen','game-over-screen','pause-screen'].forEach(s=>document.getElementById(s).style.display='none');
    lastTime=performance.now(); requestAnimationFrame(loop);
}

function loop(t){
    if(gameState!=='PLAYING') return;
    let dt = Math.min((t-lastTime)/1000, 0.1); lastTime=t;
    let worldDt = (player.slowMoUltTimer > 0) ? dt * 0.1 : dt;
    let playerDt = dt; 
    if(slowMoTimer > 0) { slowMoTimer -= dt; worldDt *= 0.3; playerDt *= 0.3; }
    frameCount++; 
    player.update(playerDt);
    let isHard = score >= 15000; document.getElementById('hard-indicator').style.display = isHard ? 'block' : 'none';
    if(frameCount % (isHard?60:100) === 0) {
        let type = 'ground'; if(score >= 10000 && Math.random() > 0.7) type = 'explosive'; else if(score >= 6000 && Math.random() > 0.6) type = 'fly';
        bots.push(new Bot(player.x + (Math.random()>0.5?900:-900), 0, type));
    }
    if(score >= 5000 && score >= lastBossScore + 5000) { bots.push(new Bot(player.x+900, 0, 'boss')); lastBossScore = score; }
    if(score >= 20000 && score >= lastSuperBossScore + 20000) { bots.push(new Bot(player.x+900, 0, 'superboss')); lastSuperBossScore = score; }
    projectiles = projectiles.filter(p => { p.update(p.p ? playerDt : worldDt); return p.active; });
    bots = bots.filter(b => { b.update(worldDt, isHard); if(b.hp <= 0 && b.type === 'explosive') spawnExplosion(b.x, b.y, 200); return b.hp > 0; });
    effects.forEach(e => { e.r += 1000 * worldDt; e.life -= worldDt * 3; }); effects = effects.filter(e => e.life > 0);
    particles.forEach(p => { p.x += p.vx*worldDt; p.y += p.vy*worldDt; p.life -= worldDt*2; }); particles = particles.filter(p => p.life > 0);
    stylePoints = Math.max(0, stylePoints - dt * 150);
    if(player.hp<=0) {
        gameState='OVER'; const dr = ((currentRankIdx + 1 + score/3000 + maxAirCombo/5)).toFixed(1);
        document.getElementById('final-grade').innerText = dr; document.getElementById('game-over-screen').style.display='flex'; 
    }
    updateUI(); draw(); requestAnimationFrame(loop);
}

function updateUI() {
    document.getElementById('score-val').innerText = Math.floor(score);
    document.getElementById('hp-val').innerText = Math.max(0, Math.floor(player.hp));
    const w = player.weapons[player.idx];
    document.getElementById('weapon-name').innerText = (w.n === 'RPG' && stylePoints >= 50000) ? 'TRIPLE RPG' : w.n;
    document.getElementById('ammo-fill').style.width = (100 - (player.timer / w.r) * 100) + "%";
    
    const uiConfig = {
        'btn-ult': { cd: player.ultCooldown, label: 'Q' },
        'btn-shield': { cd: player.shieldCooldown, label: 'T' },
        'btn-dash': { cd: player.dashCooldown, label: 'SHIFT' },
        'btn-slow': { cd: player.slowMoUltCooldown, label: 'G' },
        'btn-slam': { cd: player.slamCooldown, label: 'V' }
    };

    for(let id in uiConfig) {
        const el = document.getElementById(id);
        const config = uiConfig[id];
        if(config.cd > 0) {
            el.style.opacity = 0.3;
            el.innerText = Math.ceil(config.cd);
        } else {
            el.style.opacity = 1.0;
            el.innerText = config.label;
        }
    }

    let newIdx = 0; for(let i=ranks.length-1; i>=0; i--) { if(stylePoints >= ranks[i].threshold) { newIdx = i; break; } }
    if(newIdx > currentRankIdx) { slowMoTimer = 0.5; AudioEngine.playRank(); }
    currentRankIdx = newIdx; document.getElementById('style-rank').innerText = ranks[currentRankIdx].n;
    document.getElementById('style-rank').style.color = ranks[currentRankIdx].c;
    document.getElementById('style-fill').style.width = Math.min(100, (stylePoints/2500000)*100) + "%";
    document.getElementById('style-fill').style.backgroundColor = ranks[currentRankIdx].c;
    const ci = document.getElementById('combo-info'); ci.style.opacity = airCombo > 0 ? 1 : 0; ci.innerText = "AIR COMBO x" + airCombo;
}

function draw(){
    let cx = Math.min(Math.max(0,player.x-640),1720);
    ctx.clearRect(0,0,1280,720); ctx.save();
    if(player.slowMoUltTimer > 0) ctx.filter = 'grayscale(100%) brightness(1.2) contrast(1.2)';
    if(shakeAmount>0){ctx.translate((Math.random()-0.5)*shakeAmount,(Math.random()-0.5)*shakeAmount);shakeAmount*=0.9;}
    ctx.fillStyle = '#050505'; ctx.fillRect(0,0,1280,720);
    if(player.slowMoUltTimer > 0) {
        ctx.fillStyle = 'rgba(52, 152, 219, 0.08)'; ctx.fillRect(0,0,1280,720);
        let rippleR = (Date.now() % 2000) / 2000 * 1500; ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 50;
        ctx.beginPath(); ctx.arc(player.x + player.w/2 - cx, player.y + player.h/2, rippleR, 0, Math.PI*2); ctx.stroke();
    }
    ctx.fillStyle = '#0a0a10'; map.bgBuildings.forEach(b => { ctx.fillRect((b.x - cx*0.2) % 3000, 720-b.h, b.w, b.h); });
    map.bgPillars.forEach(p => { ctx.shadowBlur = 15; ctx.shadowColor = p.c; ctx.fillStyle = p.c; ctx.fillRect((p.x - cx*0.5) % 3000, 0, p.w, 720); ctx.shadowBlur = 0; });
    ctx.fillStyle = '#151515'; ctx.fillRect(-cx,670,3000,100);
    map.platforms.forEach(p=>{ ctx.fillStyle='#252525'; ctx.fillRect(p.x-cx,p.y,p.w,20); });
    if(player.grapple.active){ ctx.beginPath(); ctx.strokeStyle="#3498db"; ctx.lineWidth = 3; ctx.moveTo(player.x+15-cx, player.y+20); ctx.lineTo(player.grapple.x-cx, player.grapple.y); ctx.stroke(); }
    particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x-cx, p.y, 4, 4); });
    ctx.globalAlpha = 1.0; effects.forEach(e => { ctx.beginPath(); ctx.strokeStyle = `rgba(255,150,0,${e.life})`; ctx.arc(e.x-cx, e.y, e.r, 0, Math.PI*2); ctx.stroke(); });
    if(player.shieldTimer > 0) { ctx.shadowBlur = 20; ctx.shadowColor = "#3498db"; ctx.strokeStyle = "#3498db"; ctx.lineWidth = 4; ctx.strokeRect(player.x-cx-5, player.y-5, player.w+10, player.h+10); }
    if(player.dashTimer > 0) { ctx.globalAlpha = 0.5; for(let i=1; i<4; i++) ctx.fillRect(player.x-cx - (player.facingRight?i*20:-i*20), player.y, player.w, player.h); }
    ctx.fillStyle = ranks[currentRankIdx].c; ctx.fillRect(player.x-cx, player.y, player.w, player.h);
    ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
    bots.forEach(b=>{ 
        if(b.type==='superboss') ctx.fillStyle='#f1c40f'; 
        else ctx.fillStyle = b.type==='boss'?'#9b59b6':(b.type==='fly'?'#f1c40f':(b.type==='explosive'?'#e67e22':'#e74c3c')); 
        ctx.fillRect(b.x-cx,b.y,b.w,b.h); 
        if(b.type==='boss'){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(b.x-cx, b.y-15, b.w, 8); ctx.fillStyle='#e74c3c'; ctx.fillRect(b.x-cx, b.y-15, b.w * (b.hp/3000), 8); }
        if(b.type==='superboss'){ ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(b.x-cx, b.y-25, b.w, 10); ctx.fillStyle='#f1c40f'; ctx.fillRect(b.x-cx, b.y-25, b.w * (b.hp/20000), 10); }
    });	
    projectiles.forEach(p=>{ ctx.fillStyle=p.p?ranks[currentRankIdx].c:'#e74c3c'; ctx.fillRect(p.x-cx,p.y,10,10); });
    ctx.restore();
}
canvas.width=1280; canvas.height=720;
</script>
