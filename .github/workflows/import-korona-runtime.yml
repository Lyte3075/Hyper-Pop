name: Import Korona runtime
on:
  push:
    branches: [korona-fix]
    paths:
      - ".github/workflows/import-korona-runtime.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hyper-Pop branch
        uses: actions/checkout@v4
        with:
          ref: korona-fix
          fetch-depth: 0
      - name: Download pinned Korona runtime
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "https://github.com/korona-lat/korona-static/archive/6709e3f7e036eca025f8b37db2e9e46cfabdece1.zip" -o /tmp/korona.zip
          mkdir -p /tmp/korona-src
          unzip -q /tmp/korona.zip -d /tmp/korona-src
          SRC="$(find /tmp/korona-src -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC"
          mkdir -p korona/runtime
          # Keep the browser runtime and its supporting assets; omit emulator payloads for now.
          for f in LICENSE README.md THIRD_PARTY_NOTICES.md embed.css embed.html embed.js embed.svg runtime-manifest.json seal-wisp.txt sw.js; do
            test ! -f "$SRC/$f" || cp "$SRC/$f" korona/runtime/
          done
          for d in assets sealjet source; do
            test ! -d "$SRC/$d" || cp -R "$SRC/$d" korona/runtime/
          done
          # Preserve executable/source files as-is; make one commit per imported file.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find korona/runtime -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            git add -- "$file"
            if ! git diff --cached --quiet; then
              git commit -m "Import Korona runtime: ${file#korona/runtime/}"
              git push origin HEAD:korona-fix
            fi
          done
      - name: Remove temporary importer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/import-korona-runtime.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary Korona importer workflow"
            git push origin HEAD:korona-fix
          fi
