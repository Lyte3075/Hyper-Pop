name: Connect Korona build to local runtime

on:
  push:
    paths:
      - ".github/workflows/connect-korona-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out korona-fix
        uses: actions/checkout@v4
        with:
          ref: korona-fix
          fetch-depth: 0
      - name: Point the existing build at the local runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("korona/korona.html")
          s = p.read_text()
          old = 'VITE_KORONA_RUNTIME_ORIGINS:"https://cdn.jsdelivr.net/gh/korona-lat/korona-static@6709e3f7e036eca025f8b37db2e9e46cfabdece1,'
          new = 'VITE_KORONA_RUNTIME_ORIGINS:"https://hyper-pop.pntr.dev/korona/runtime,https://cdn.jsdelivr.net/gh/korona-lat/korona-static@6709e3f7e036eca025f8b37db2e9e46cfabdece1,'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one original runtime-origin list, found {count}; no changes made.")
          p.write_text(s.replace(old, new, 1))
          check = p.read_text()
          if new not in check:
              raise SystemExit("Verification failed: local runtime URL was not written.")
          print(f"Updated only the runtime-origin list in {p}; size remains {p.stat().st_size} bytes.")
          PY
      - name: Commit local runtime connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add korona/korona.html
          git commit -m "Use local Korona runtime in working build"
          git push origin HEAD:korona-fix
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git rm -f .github/workflows/connect-korona-runtime.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary Korona runtime workflow"
            git push origin HEAD:korona-fix
          fi
