name: Build Hyper-Pop React

on:
  push:
    branches: [react]
  pull_request:
    branches: [react]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout react branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static React site
        run: npm run build
      - name: Preserve existing static experiences and assets
        run: |
          rsync -a ./ dist/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/dist/' \
            --exclude='/src/' \
            --exclude='/react-app/' \
            --exclude='/index.html' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/vite.config.js'
          touch dist/.nojekyll
      - name: Verify React entry and preserved legacy routes
        run: |
          test -f dist/index.html
          test -f dist/terminal.html
          test -f dist/gl/games/2048.html
