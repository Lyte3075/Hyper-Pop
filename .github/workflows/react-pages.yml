name: Build Hyper-Pop React

on:
  push:
    branches: [react]
  pull_request:
    branches: [react]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout react branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static React site
        run: npm run build
      - name: Preserve existing static experiences and assets
        run: |
          rsync -a ./ dist/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/dist/' \
            --exclude='/src/' \
            --exclude='/index.html' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/vite.config.js'
          touch dist/.nojekyll
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyper-pop-react-static
          path: dist/
          retention-days: 7
