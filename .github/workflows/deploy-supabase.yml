name: Deploy Hyper-Pop Supabase Function

on:
  push:
    branches:
      - main
      - terminal
    paths:
      - "supabase/functions/hyperpop-proxy/**"
      - "supabase/functions/hyperpop-cors/**"
      - "supabase/functions/hyperpop-reverse-proxy/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check reverse proxy
        run: deno check supabase/functions/hyperpop-reverse-proxy/index.ts
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy legacy proxy retirement
        run: supabase functions deploy hyperpop-proxy --project-ref iapnejlttsqqefkpmelp --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy authenticated CORS proxy
        run: supabase functions deploy hyperpop-cors --project-ref iapnejlttsqqefkpmelp --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy authenticated reverse proxy
        run: supabase functions deploy hyperpop-reverse-proxy --project-ref iapnejlttsqqefkpmelp --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
