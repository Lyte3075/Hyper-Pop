name: Deploy Hyper-Pop Supabase Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/hyperpop-proxy/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy hyperpop-proxy
        run: supabase functions deploy hyperpop-proxy --project-ref iapnejlttsqqefkpmelp --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
