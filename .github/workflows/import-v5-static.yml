name: Import V5 Static into scramjet

on:
  push:
    branches: [scramjet]
    paths:
      - '.github/workflows/import-v5-static.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-v5-static-scramjet
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scramjet
        uses: actions/checkout@v4
        with:
          ref: scramjet

      - name: Download and unpack upstream V5 Static
        run: |
          curl -fsSL https://github.com/builtlikearatt/v5-static/archive/refs/heads/main.zip -o /tmp/v5-static.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          archive = zipfile.ZipFile('/tmp/v5-static.zip')
          root = Path('v5-static')
          prefix = 'v5-static-main/'
          for name in archive.namelist():
              if not name.startswith(prefix) or name.endswith('/'):
                  continue
              target = root / name[len(prefix):]
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(archive.read(name))
          print('Imported upstream V5 Static files.')
          PY

      - name: Preserve the original V5 UI and fix subdirectory paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('v5-static')
          bootstrap = """<script>
          (function () {
            var path = location.pathname;
            var marker = '/v5-static/';
            var index = path.indexOf(marker);
            var base = index >= 0 ? path.slice(0, index + marker.length) : './';
            document.write('<base href="' + base + '">');
          })();
          </script>"""

          # GitHub Pages serves this project below /Hyper-Pop/, unlike the
          # original upstream domain. Make every local HTML URL base-relative.
          for page in root.rglob('*.html'):
            text = page.read_text(encoding='utf-8')
            text = text.replace('<head>\\n', '<head>\\n', 1)
            text = re.sub(r'((?:href|src|action)\\s*=\\s*["\'])/(?!/)([^"\']*)', r'\\1\\2', text, flags=re.I)
            text = re.sub(r"window\\.open\\(\\s*['\"]/['\"]\\s*,", "window.open('index.html',", text)
            text = re.sub(r'(<a\\b[^>]*\\bhref=["\'])/["\']', r'\\1./\\2', text, flags=re.I)
            if '<base href=' not in text:
              match = re.search(r'<head(?:\\s[^>]*)?>', text, flags=re.I)
              if match:
                text = text[:match.end()] + '\\n' + bootstrap + text[match.end():]
            page.write_text(text, encoding='utf-8')

          # Fix the catalog fetch and the in-site game-player route.
          games = root / 'games' / 'games.js'
          if games.exists():
            text = games.read_text(encoding='utf-8')
            text = text.replace("fetch('/games/games.json')", "fetch('games/games.json')")
            text = text.replace('link.href = "/games/play/index.html";', 'link.href = "games/play/index.html";')
            games.write_text(text, encoding='utf-8')

          # Make the proxy search configuration work under /Hyper-Pop/v5-static/.
          uv = root / 'ultraviolet' / 'uv.config.js'
          if uv.exists():
            uv.write_text("""const siteBase = location.pathname.includes('/v5-static/')
              ? location.pathname.substring(0, location.pathname.indexOf('/v5-static/')) + '/v5-static'
              : '';
          self.__uv$config = {
              prefix: siteBase + '/uv/',
              bare: 'https://v5.3kh0.net/bare/',
              encodeUrl: Ultraviolet.codec.xor.encode,
              decodeUrl: Ultraviolet.codec.xor.decode,
              handler: siteBase + '/ultraviolet/uv.handler.js',
              bundle: siteBase + '/ultraviolet/uv.bundle.js',
              config: siteBase + '/ultraviolet/uv.config.js',
              sw: siteBase + '/ultraviolet/uv.sw.js',
          };
          """, encoding='utf-8')

          # Responsive adjustments only: retain the upstream V5 visual design.
          css = root / 'style.css'
          if css.exists():
            with css.open('a', encoding='utf-8') as out:
              out.write("""
          
          /* Hyper-Pop hosting: responsive safeguards, original V5 styling retained */
          *, *::before, *::after { box-sizing: border-box; }
          html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
          img, canvas, iframe { max-width: 100%; }
          .main { width: min(800px, calc(100vw - 32px)); }
          .nav { gap: 12px; flex-wrap: wrap; }
          .nav-items { position: static; flex-wrap: wrap; gap: 8px 14px; }
          .nav-items li { margin-right: 0; }
          @media (max-width: 720px) {
            .nav { justify-content: center; padding: 10px 12px; }
            .nav-items { order: 3; width: 100%; justify-content: center; }
            .nav-items li a { font-size: 14px; }
            .time { margin: 0; font-size: 12px; }
            .main { margin-top: 5vh; padding: 34px 18px; }
            .main h1 { font-size: clamp(38px, 10vw, 66px); }
            .main h4 { font-size: clamp(16px, 4vw, 25px); }
            .main p { font-size: 16px; }
          }
          @media (max-width: 420px) {
            .nav-items { gap: 8px 10px; }
            .nav-items li a { font-size: 12px; }
            .main { width: calc(100vw - 20px); padding: 28px 12px; }
            .search-container { width: calc(100vw - 28px); }
            .g { width: min(200px, calc(100vw - 48px)); }
          }
          """)
          print('Patched paths and responsive layout while preserving upstream styling.')
          PY

      - name: Add Hyper-Pop terminal command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('terminal.js')
          text = path.read_text(encoding='utf-8')
          home = "if(cmd==='/home'){location.href='index.html';return}"
          command = "if(cmd==='/v5-static'){location.href='v5-static/index.html';return}"
          if command not in text:
            if home not in text:
              raise SystemExit('Could not find the expected /home command in terminal.js; refusing to patch an unknown terminal.')
            text = text.replace(home, command + home, 1)
          old_help = '/home                  Go to the Hyper-Pop homepage'
          new_help = '/v5-static             Open the integrated 3kh0 V5 Static arcade\n/home                  Go to the Hyper-Pop homepage'
          # Normalize an earlier literal backslash-n to a real line break.
          text = text.replace('/v5-static             Open the integrated 3kh0 V5 Static arcade\\n/home                  Go to the Hyper-Pop homepage', new_help, 1)
          if new_help not in text and old_help in text:
            text = text.replace(old_help, new_help, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit imported files to scramjet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5-static terminal.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Integrate V5 Static arcade on scramjet"
          git push origin scramjet
