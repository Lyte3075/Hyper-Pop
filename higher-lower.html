<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Higher or Lower ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.game{max-width:720px;margin:auto;text-align:center}.panel{padding:22px;background:#ffffff08;border:1px solid #ffffff18;border-radius:24px}.big{font-size:clamp(55px,15vw,100px);margin:18px 0}.score{font:700 28px "DM Mono";color:#ffe66d}.msg{min-height:28px;color:#aaa7c1;margin:12px}.btn{border:0;border-radius:13px;padding:13px 18px;background:#f7f4ff;color:#11111f;font-weight:800;cursor:pointer;margin:5px}.btn.alt{background:#ffffff0d;color:#fff;border:1px solid #ffffff18}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choice{min-width:110px}.bar{height:12px;background:#ffffff10;border-radius:99px;overflow:hidden;margin:15px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5db1,#9b7bff,#4be0e3);transition:width .2s}.kbd{font:12px "DM Mono";color:#77758b;margin-top:16px}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.pop{animation:pop .18s}@keyframes pop{50%{transform:scale(1.08)}}@media(max-width:600px){.panel{padding:16px}}</style></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><div id="account-slot"></div></nav><header class="hero"><div class="e">📈</div><h1>Higher or Lower</h1><p>Guess whether the next number is higher or lower. Build the longest streak you can.</p></header><main class="box game"><div class="panel"><div class="big" id="num">50</div><div class="score" id="score">Streak 0 • Best 0</div><div class="choices"><button class="btn choice" id="low">⬇ LOWER</button><button class="btn choice" id="high">⬆ HIGHER</button></div><div class="msg" id="msg">Your next number is waiting...</div><button class="btn alt" id="reset">RESET</button></div></main></div><script src="app.js"></script><script>let n=50,streak=0,best=0,audio;const $=id=>document.getElementById(id);function s(f,d=.07){try{audio=audio||new AudioContext();if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type="triangle";o.frequency.value=f;g.gain.value=.06;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function resetRound(){n=Math.floor(Math.random()*100)+1;$("num").textContent=n;$("score").textContent="Streak 0 • Best "+best;$("msg").textContent="New round! Guess higher or lower."}function guess(dir){let next=Math.floor(Math.random()*100)+1,ok=dir==="high"?next>n:next<n;if(ok){streak++;best=Math.max(best,streak);s(700+streak*25);$("msg").textContent="🔥 Correct!"}else{s(120,.18);$("msg").textContent="💥 Wrong!";streak=0}n=next;$("num").textContent=n;$("score").textContent="Streak "+streak+" • Best "+best;setTimeout(resetRound,500)}$("high").onclick=()=>guess("high");$("low").onclick=()=>guess("low");$("reset").onclick=()=>{streak=0;resetRound();s(300,.08)};resetRound();</script></body></html>
