<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:rgba(3,7,5,.01)!important;color-scheme:dark;color:#f4f2ff;pointer-events:none;font-family:Inter,system-ui,-apple-system,sans-serif}
#edge{position:fixed;inset:0 auto 0 0;width:28px;background:linear-gradient(to right,#0b0b16 0%,transparent 100%);touch-action:none;cursor:ew-resize;pointer-events:auto}
#scrim{position:fixed;inset:0;background:linear-gradient(90deg,#000b 0%,#0009 45%,#0007 100%);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}
#panel{touch-action:pan-y;pointer-events:auto;position:fixed;inset:0 auto 0 0;width:min(320px,90vw);height:100%;overflow:auto;padding:calc(22px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));background:#0d0d19f7;border-right:1px solid #ffffff1c;backdrop-filter:blur(22px);transform:translateX(-102%);transition:transform .22s ease;box-shadow:5px 0 14px #0005}
body.open #panel{transform:translateX(0)}body.open #scrim{opacity:1;visibility:visible;pointer-events:auto}
.brand{font-size:18px;font-weight:800;margin:0 0 4px}.note{font:10px monospace;color:#aaa7c1;letter-spacing:.12em;text-transform:uppercase;margin:0 0 18px}.label{font:10px monospace;color:#4be0e3;letter-spacing:.13em;text-transform:uppercase;margin:18px 8px 7px}
a{display:flex;align-items:center;gap:11px;min-height:42px;padding:9px 11px;border:1px solid transparent;border-radius:11px;color:#dedbed;text-decoration:none;font-size:13px}a:hover,a:focus-visible{background:#ffffff0b;border-color:#ffffff20;color:#fff;outline:none}.ico{width:22px;flex:0 0 22px;text-align:center;font-size:16px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff08;color:#dedbed;font-size:13px}
.setting input{width:18px;height:18px;accent-color:#9b7bff;flex:0 0 auto}
.presence-wrap{padding:10px;border:1px solid #ffffff18;border-radius:13px;background:linear-gradient(135deg,#ffffff0b,#ffffff04)}
.push-card{margin-top:12px;padding:10px;border:1px solid #ffffff18;border-radius:13px;background:linear-gradient(135deg,#ffffff0b,#ffffff04)}
#hp-push-button{width:100%;padding:10px 11px;border:1px solid #7df9ff55;border-radius:10px;background:#123039;color:#a9fbff;font:750 12px system-ui;cursor:pointer}
#hp-push-note{min-height:15px;margin:7px 2px 0;color:#aaa7c1;font-size:10px;line-height:1.4}
.presence-select-row{display:flex;align-items:center;gap:9px}
.presence-dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:#4ade80;box-shadow:0 0 10px currentColor}
.presence-dot.idle{background:#fbbf24}.presence-dot.dnd{background:#fb7185}.presence-dot.invisible{background:#85859a}
#hp-presence-select{min-width:0;flex:1;padding:9px 10px;border:1px solid #ffffff20;border-radius:10px;background:#1b1b2c;color:#f4f2ff;font:12px system-ui;outline:none}
#hp-presence-select:focus-visible{outline:2px solid #7df9ff;outline-offset:2px}
#hp-presence-note{min-height:15px;margin:7px 2px 0;color:#aaa7c1;font-size:10px}

.setting small{display:block;color:#aaa7c1;font-size:10px;margin-top:3px}
@media(prefers-reduced-motion:reduce){#panel,#scrim{transition:none}}
</style></head><body>
<div id="edge" aria-hidden="true"></div><div id="scrim"></div><aside id="panel" aria-label="Hyper-Pop navigation">
<div class="brand">Hyper-Pop</div><div class="note">tiny internet, big vibes</div>
<div class="label">Explore</div><a href="index.html" target="_top"><span class="ico">⌂</span>Home</a><a href="index.html#games" target="_top"><span class="ico">✦</span>Games</a><a href="index.html#misc" target="_top"><span class="ico">▦</span>Categories & experiments</a><a href="index.html#search" target="_top"><span class="ico">⌕</span>Search</a><a href="leaderboard.html" target="_top"><span class="ico">🏆</span>Leaderboard</a>
<div class="label">Social</div><a href="social.html" target="_top"><span class="ico">♟</span>Social hub</a><a href="social.html#friends" target="_top"><span class="ico">♡</span>Friends</a><a href="social.html#parties" target="_top"><span class="ico">◉</span>Parties</a><a href="social.html#chats" target="_top"><span class="ico">✉</span>Chats</a>
<div class="label">Your status</div><div class="presence-wrap"><div class="presence-select-row"><span id="hp-presence-dot" class="presence-dot online"></span><select id="hp-presence-select" aria-label="Set your status"><option value="online">● Online</option><option value="idle">◷ Idle</option><option value="dnd">⛔ Do not disturb</option><option value="invisible">◌ Invisible</option></select></div><div id="hp-presence-note" role="status">Loading your status…</div></div>
<div class="push-card"><div style="font-weight:750;font-size:12px;margin:0 0 8px">Push notifications</div><button id="hp-push-button" type="button">Enable push notifications</button><div id="hp-push-note" role="status">Get alerts for messages and incoming calls.</div></div>
<div class="label">Settings</div><label class="setting"><span>Show floating chat button<small>Display the chat shortcut on pages</small></span><input id="chat-button-toggle" type="checkbox"></label>
<div class="label">More</div><a href="stats.html" target="_top"><span class="ico">📊</span>Live site stats</a><a href="accounts.html" target="_top"><span class="ico">👤</span>Account / Profile</a></aside>
<script>
(function(){const send=s=>parent.postMessage(s,location.origin);function open(){document.body.classList.add('open');send('hp-sidebar-open');send({type:'hp-status-request'})}function close(){document.body.classList.remove('open');send('hp-sidebar-close')}
let startX=null,startY=0;
function swipeStart(e){if(!e.touches||e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY}
function swipeEnd(e){if(startX===null||!e.changedTouches||!e.changedTouches.length)return;const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(dx< -55&&Math.abs(dx)>Math.abs(dy)*1.25)close();startX=null}
function swipeCancel(){startX=null}
const edge=document.getElementById('edge'),panel=document.getElementById('panel');
const presenceSelect=document.getElementById('hp-presence-select'),presenceDot=document.getElementById('hp-presence-dot'),presenceNote=document.getElementById('hp-presence-note');
function applyPresence(status){if(!['online','idle','dnd','invisible'].includes(status))return;presenceSelect.value=status;presenceDot.className='presence-dot '+status;presenceNote.textContent=status==='dnd'?'Notifications are quiet.':status==='invisible'?'You appear offline to friends.':status==='idle'?'You appear away.':'You appear online.'}
presenceSelect.addEventListener('change',()=>{presenceNote.textContent='Updating status…';send({type:'hp-set-status',status:presenceSelect.value})});
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||typeof e.data!=='object')return;if(e.data.type==='hp-status-update')applyPresence(e.data.status);if(e.data.type==='hp-status-result'){if(e.data.ok){applyPresence(e.data.status)}else presenceNote.textContent=e.data.error||'Could not update status.'}});
send({type:'hp-status-request'});

const pushButton=document.getElementById('hp-push-button'),pushNote=document.getElementById('hp-push-note');
const PUSH_PUBLIC_KEY='BExl8aX0B1kUfTrW9a7X2XlAXLaajHcsvrEKQce5FpIobTfpy4hFc_r8i80XsCcn_gH2g2kBD2zf7vLtgF5by8k',PUSH_API='https://iapnejlttsqqefkpmelp.supabase.co/functions/v1/hyperpop-push',PUSH_ANON_KEY='sb_publishable_TB7oC4nDlUJq-Gcb2yoTjQ_Dvbh6NlM';
function b64ToBytes(value){const pad='='.repeat((4-value.length%4)%4),raw=atob((value+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function pushRequest(action,data={}){const token=localStorage.getItem('hyperpop_token');if(!token)throw new Error('Sign in first to enable notifications.');const r=await fetch(PUSH_API,{method:'POST',headers:{apikey:PUSH_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({token,action,...data})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Push notification setup failed.');return d}
async function refreshPushButton(){if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){pushButton.disabled=true;pushNote.textContent='Push notifications are not supported in this browser.';return}try{const reg=await navigator.serviceWorker.getRegistration('/');const sub=reg&&await reg.pushManager.getSubscription();pushButton.textContent=sub?'Disable push notifications':'Enable push notifications';if(Notification.permission==='denied')pushNote.textContent='Notifications are blocked in browser settings.';else if(sub)pushNote.textContent='Push notifications are enabled on this device.'}catch(_){pushNote.textContent='Could not check notification settings.'}}
pushButton.addEventListener('click',async()=>{
 pushButton.disabled=true;pushNote.textContent='Setting up notifications…';
 try{
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw new Error('This browser does not support web push.');
  const registration=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
  await navigator.serviceWorker.ready;
  const existing=await registration.pushManager.getSubscription();
  if(existing){
   await pushRequest('unsubscribe',{endpoint:existing.endpoint});
   await existing.unsubscribe();
   pushButton.textContent='Enable push notifications';pushNote.textContent='Push notifications disabled on this device.';
  }else{
   if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.matchMedia('(display-mode: standalone)').matches&&!navigator.standalone)throw new Error('On iPhone/iPad, add Hyper-Pop to your Home Screen and open it there first.');
   const permission=await Notification.requestPermission();if(permission!=='granted')throw new Error('Notification permission was not granted.');
   const subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(PUSH_PUBLIC_KEY)});
   await pushRequest('subscribe',{subscription:subscription.toJSON()});
   pushButton.textContent='Disable push notifications';pushNote.textContent='Push notifications are enabled on this device!';
  }
 }catch(e){pushNote.textContent=e.message||'Could not configure push notifications.'}
 finally{pushButton.disabled=false}
});
refreshPushButton();

const chatToggle=document.getElementById('chat-button-toggle');
try{chatToggle.checked=localStorage.getItem('hp_chat_button_visible')==='true'}catch(_){}
chatToggle.addEventListener('change',()=>{const visible=chatToggle.checked;try{localStorage.setItem('hp_chat_button_visible',String(visible))}catch(_){}send('hp-chat-visibility:'+String(visible))});
panel.addEventListener('touchstart',swipeStart,{passive:true});panel.addEventListener('touchend',swipeEnd,{passive:true});panel.addEventListener('touchcancel',swipeCancel,{passive:true});const scrim=document.getElementById('scrim');
scrim.addEventListener('click',close);
let lastEdgeTap=0;
edge.addEventListener('touchend',e=>{const now=Date.now();if(now-lastEdgeTap<360){open();lastEdgeTap=0}else lastEdgeTap=now},{passive:true});
edge.addEventListener('dblclick',open);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});addEventListener('message',e=>{if(e.origin===location.origin){if(e.data==='hp-sidebar-command-toggle'){document.body.classList.contains('open')?close():open()}else if(e.data==='hp-sidebar-command-open')open();else if(e.data==='hp-sidebar-command-close')close()}})})();
</script></body></html>
