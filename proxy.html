<style>

.home-content{width:min(760px,100%);margin:auto;position:relative;padding:30px 0 24px}.home-sparkles{height:35px;display:flex;justify-content:center;align-items:center;gap:13px;color:var(--cyan);font-size:18px}.home-sparkles span:nth-child(2){font-size:28px;color:var(--pink);transform:translateY(-5px)}.home-sparkles span:first-child{transform:translateY(5px);color:var(--purple)}

.bookmark-panel{position:relative;z-index:5;max-height:38vh;overflow:auto;padding:12px 16px;background:#141421;border-bottom:1px solid #ffffff20;color:var(--ink)}.bookmark-panel[hidden]{display:none}.bookmark-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-weight:700}.bookmark-panel-head small{font-size:11px;color:var(--muted);font-weight:400}.bookmark-list{display:flex;flex-wrap:wrap;gap:8px}.bookmark-item{display:flex;align-items:center;gap:8px;max-width:100%;padding:8px 10px;border:1px solid #ffffff1b;border-radius:11px;background:#ffffff07}.bookmark-open{max-width:min(260px,60vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;color:#dcd8ff;text-align:left;cursor:pointer}.bookmark-remove,.bookmark-close{border:0;background:transparent;color:#ff8fbc;cursor:pointer}.bookmark-empty{color:var(--muted);font-size:13px;padding:8px 0}
@media(max-width:520px){.home-shortcuts button{min-width:90px;padding:12px 13px}.shortcut-heading{max-width:100%}.bookmark-panel{padding:10px}.bookmark-item{padding:7px}.bookmark-open{max-width:55vw}}
@media(max-width:520px){.empty{padding:18px 15px}.home-content{padding:16px 0}.home-mark{width:48px;height:48px;border-radius:16px;font-size:27px}.home-search{gap:5px;padding:6px;border-radius:15px}.home-search input{font-size:13px}.home-search button{padding:0 12px}.home-hints{font-size:9px}.home-shortcuts{gap:7px}.home-shortcuts button{font-size:11px;padding:9px 11px}}
.loading{position:absolute;inset:0;display:none;place-items:center;background:#0b0b16cc;color:#fff;font:13px "DM Mono";z-index:2}.loading.show{display:grid}
@media(max-width:700px){.brand{display:none}.top{padding:8px}.controls{padding:7px}.ctrl{width:38px;height:38px}.address{height:40px;font-size:13px}.go{height:40px;padding:0 12px}.tab{min-width:120px}}
</style>

<script>
const ENDPOINT="https://iapnejlttsqqefkpmelp.supabase.co/functions/v1/hyperpop-proxy";
const tabsEl=document.getElementById("tabs"),newtab=document.getElementById("newtab"),address=document.getElementById("address"),go=document.getElementById("go"),back=document.getElementById("back"),forward=document.getElementById("forward"),reload=document.getElementById("reload"),home=document.getElementById("home"),status=document.getElementById("status"),viewport=document.getElementById("viewport"),empty=document.getElementById("empty"),loading=document.getElementById("loading");
const bookmarkCurrent=document.getElementById("bookmark-current"),showBookmarks=document.getElementById("show-bookmarks"),bookmarkPanel=document.getElementById("bookmark-panel"),shortcutContainer=document.getElementById("home-shortcuts"),addShortcut=document.getElementById("add-shortcut");
const BOOKMARKS_KEY="hyperpop.proxy.bookmarks.v1",SHORTCUTS_KEY="hyperpop.proxy.shortcuts.v1";
function readList(key){try{const v=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(v)?v:[]}catch{return []}}
function saveList(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{status.textContent="Could not save. Browser storage may be full."}}
function cleanUrl(value){let v=String(value||"").trim();if(!v)return"";if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v))v="https://"+v;try{const u=new URL(v);return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return""}}
function currentTitle(t){if(!t)return"Saved page";if(t.title&&t.title!=="New Tab"&&!t.title.startsWith("Search: "))return t.title;try{return new URL(t.url).hostname}catch{return t.url||"Saved page"}}
function renderBookmarks(){
 const list=readList(BOOKMARKS_KEY);bookmarkPanel.replaceChildren();
 const head=document.createElement("div");head.className="bookmark-panel-head";head.innerHTML='<span>☆ Bookmarks <small>'+list.length+' saved</small></span><button class="bookmark-close" type="button">Close ×</button>';head.querySelector("button").onclick=()=>bookmarkPanel.hidden=true;bookmarkPanel.append(head);
 if(!list.length){const e=document.createElement("div");e.className="bookmark-empty";e.textContent="No bookmarks yet. Open a website and tap ☆ to keep it here.";bookmarkPanel.append(e);return}
 const wrap=document.createElement("div");wrap.className="bookmark-list";
 list.forEach((item,index)=>{const row=document.createElement("div");row.className="bookmark-item";const open=document.createElement("button");open.className="bookmark-open";open.type="button";open.textContent="✦ "+item.title;open.title=item.url;open.onclick=()=>{bookmarkPanel.hidden=true;load(item.url,true)};const remove=document.createElement("button");remove.className="bookmark-remove";remove.type="button";remove.textContent="×";remove.title="Remove bookmark";remove.onclick=()=>{const next=readList(BOOKMARKS_KEY);next.splice(index,1);saveList(BOOKMARKS_KEY,next);renderBookmarks()};row.append(open,remove);wrap.append(row)});
 bookmarkPanel.append(wrap);
}
function saveCurrentBookmark(){
 const t=activeTab(),url=cleanUrl(t&&t.url);
 if(!url){status.textContent="Open a website first, then bookmark it.";return}
 const list=readList(BOOKMARKS_KEY);if(list.some(x=>x.url===url)){status.textContent="Already bookmarked ✦";bookmarkPanel.hidden=false;renderBookmarks();return}
 list.unshift({title:currentTitle(t),url});saveList(BOOKMARKS_KEY,list);renderBookmarks();bookmarkPanel.hidden=false;status.textContent="Bookmark saved ✦";
}
function renderShortcuts(){
 const custom=readList(SHORTCUTS_KEY);shortcutContainer.querySelectorAll("[data-custom-shortcut]").forEach(n=>n.remove());
 custom.forEach((item,index)=>{const b=document.createElement("button");b.type="button";b.setAttribute("data-custom-shortcut","true");b.title=item.url;b.innerHTML='<span class="shortcut-remove" aria-label="Remove shortcut">×</span><span aria-hidden="true">✦</span><span></span>';b.querySelector("span:last-child").textContent=item.title;b.addEventListener("click",e=>{if(e.target.closest(".shortcut-remove")){e.stopPropagation();const next=readList(SHORTCUTS_KEY);next.splice(index,1);saveList(SHORTCUTS_KEY,next);renderShortcuts();return}load(item.url,true)});shortcutContainer.append(b)});
}
function createShortcut(){
 const title=prompt("Name this shortcut (for example, YouTube):");if(!title||!title.trim())return;
 const raw=prompt("Website address (for example, youtube.com):");const url=cleanUrl(raw);if(!url){status.textContent="That address doesn't look valid. Try again.";return}
 const list=readList(SHORTCUTS_KEY);if(list.length>=12){status.textContent="You can save up to 12 custom shortcuts.";return}
 list.push({title:title.trim().slice(0,36),url});saveList(SHORTCUTS_KEY,list);renderShortcuts();status.textContent="Shortcut added ✦";
}
let tabs=[],active=0,serial=0;
function isSearchQuery(v){v=v.trim();return !!v&&!/^(https?|about):\/\//i.test(v)&&!(/^[^\s.]+\.[^\s.]+/.test(v)||v.includes("/"))}
function normalize(v){v=v.trim();if(!v)return"";if(!/^(https?|about):\/\//i.test(v)){if(/^[^\s.]+\.[^\s.]+/.test(v)||v.includes("/"))v="https://"+v;else return "search:"+v}return v}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function searchWikipedia(query){
 const t=activeTab();showBusy(true);status.textContent="Searching Wikipedia…";
 try{
  const api="https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(query)+"&format=json&origin=*&srlimit=10";
  const response=await fetch(api,{headers:{"Accept":"application/json"}});
  if(!response.ok)throw new Error("Search service returned HTTP "+response.status);
  const data=await response.json(),results=data&&data.query&&data.query.search||[];
  const panel=document.createElement("section");
  panel.style.cssText="height:100%;overflow:auto;background:#fff;color:#242235;padding:clamp(18px,4vw,38px);font-family:system-ui,sans-serif";
  panel.innerHTML='<div style="max-width:850px;margin:0 auto"><div style="font:11px monospace;letter-spacing:.12em;text-transform:uppercase;color:#7866bf;margin-bottom:8px">HYPER-POP SEARCH</div><h1 style="font-size:clamp(25px,5vw,36px);margin:0 0 6px">Results for '+escapeHtml(query)+'</h1><p style="color:#6b687d;margin:0 0 24px">Wikipedia articles · Search results stay inside Hyper-Pop</p><div id="hp-results"></div><p style="font-size:12px;color:#77738a;margin-top:26px">These are encyclopedia results, not a full-web search index.</p></div>';
  const list=panel.querySelector("#hp-results");
  if(!results.length){list.innerHTML='<p>No matching articles found. Try different keywords or enter a website address above.</p>'}
  results.forEach(item=>{
   const card=document.createElement("article");card.style.cssText="padding:16px 0;border-top:1px solid #e8e6f0";
   const link=document.createElement("a");link.href="https://en.wikipedia.org/wiki/"+encodeURIComponent(item.title.replace(/ /g,"_"));link.textContent=item.title;link.style.cssText="font-size:19px;font-weight:700;color:#4b42b8;text-decoration:none";
   link.addEventListener("click",e=>{e.preventDefault();load(link.href,true)});
   const snippet=document.createElement("div");snippet.style.cssText="margin-top:7px;line-height:1.55;color:#484657";snippet.innerHTML=item.snippet||"Open this article on Wikipedia.";
   card.append(link,snippet);list.append(card);
  });
  t.url="search:"+query;t.title="Search: "+query;
  if(t.frame){t.frame.remove();t.frame=null}
  if(t.searchPanel)t.searchPanel.remove();
  t.searchPanel=panel;viewport.appendChild(panel);empty.style.display="none";
  if(t.history[t.pos]!==t.url){t.history=t.history.slice(0,t.pos+1);t.history.push(t.url);t.pos=t.history.length-1}
  renderTabs();address.value=query;back.disabled=t.pos<=0;forward.disabled=t.pos>=t.history.length-1;status.textContent=results.length+" Wikipedia results · "+query;
 }catch(e){status.textContent=e.message||"Search failed."}
 finally{showBusy(false)}
}
function makeTab(url=""){return{id:++serial,url,title:"New Tab",history:[],pos:-1,frame:null,searchQuery:""}}
function activeTab(){return tabs[active]}

function siteHost(url){try{return new URL(url).hostname}catch{return ""}}
function readSiteStore(url,kind){try{return JSON.parse(localStorage.getItem("hyperpop:"+kind+":"+ (kind==="cookies"?siteHost(url):siteOrigin(url)))||"{}")}catch{return {}}}

 if(/(^|\.)wikipedia\.org$/i.test(host)){
  const wikiStyle=`<style id="hyperpop-wikipedia-reader">
