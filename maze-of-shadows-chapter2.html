<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Maze of Shadows: Chapter 2</title><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030503;color:#fff;font:13px monospace;touch-action:none}#game{position:absolute;inset:0}#hud{position:absolute;top:14px;left:14px;z-index:3;background:#050905bb;border:1px solid #ffffff2b;padding:12px;min-width:170px;pointer-events:none}#hud b{color:#9cff8b} .bar{height:7px;background:#222;margin:5px 0 9px;width:145px}.fill{height:100%;background:#e54a54;width:100%}#battery{background:#f3e35c}#inventory{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;max-width:96vw} .item{width:62px;height:60px;background:#050805d9;border:1px solid #aaa8;border-radius:7px;color:white;position:relative;font:12px monospace;touch-action:manipulation}.item strong{display:block;font-size:10px;color:#b8ffae}.item .key{position:absolute;top:3px;left:5px;color:#ffe88b;font-size:10px}.item.selected{border:2px solid #a4ff8e;background:#163018dd}#controls{position:absolute;bottom:95px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:5}#controls button,#action{background:#080b08cc;color:white;border:1px solid #d4e6d0;border-radius:50%;width:64px;height:55px;font:bold 11px monospace;touch-action:manipulation}#stick{position:absolute;bottom:25px;left:25px;width:100px;height:100px;border:2px solid #ffffff60;border-radius:50%;z-index:4;display:none;pointer-events:none}#knob{position:absolute;left:28px;top:28px;width:40px;height:40px;background:#ffffff66;border-radius:50%}#overlay{position:absolute;inset:0;background:#020502eF;display:flex;align-items:center;justify-content:center;text-align:center;z-index:10;padding:24px}#overlay .card{max-width:540px}#overlay h1{font-size:clamp(30px,8vw,64px);line-height:.95;color:#a8ff9d;text-shadow:0 0 28px #38a53a66}#overlay p{color:#c5c9c4;line-height:1.7}#overlay button{padding:13px 22px;margin:7px;background:#19351c;border:1px solid #9cff8b;color:white;font:bold 13px monospace;cursor:pointer}#topBtns{position:absolute;top:12px;right:12px;z-index:6;display:flex;gap:6px}#topBtns button{background:#070907bb;color:#eee;border:1px solid #ffffff55;padding:9px;font:11px monospace}#msg{color:#ffe98a;margin-top:8px}@media(min-width:800px){#stick{display:none!important}}
</style></head><body><div id="game"></div><div id="hud"><div><b>CHAPTER 2</b> · THE GRASS MAZE</div><div id="fuelText">FUEL CANISTERS: 0 / 9</div><div>Health</div><div class="bar"><div id="health" class="fill"></div></div><div>Flashlight</div><div class="bar"><div id="battery" class="fill"></div></div><div id="status">Find the fuel.</div><div id="msg"></div></div><div id="topBtns"><button id="save">SAVE</button><button onclick="location.href='maze-of-shadows-menu.html'">MENU</button></div><div id="inventory"></div><div id="controls"><button id="run">SPRINT</button><button id="light">LIGHT</button><button id="use">USE</button></div><div id="stick"><div id="knob"></div></div><div id="overlay"><div class="card"><h1>CHAPTER 2<br>THE GRASS MAZE</h1><p>Escape the building. Somewhere beyond the overgrown maze is a parking lot and a car waiting on the road. Find all <b>9 fuel canisters</b>, fuel the car, and get out before the thing catches you.</p><button id="begin">ENTER THE MAZE</button><button onclick="location.href='maze-of-shadows-menu.html'">BACK TO CHAPTERS</button></div></div>
<script>
const SAVEKEY='mosSaveSlotsV1',CAMPAIGN='mosCampaignV1';let scene,camera,renderer,flashlight;let health=100,battery=100,canisters=0,stamina=100,inventory=[{name:'Medkit',count:1},{name:'Battery',count:1},{name:'Flare',count:1}];let selected=0,lightOn=true,running=false,started=false,ended=false;let walls=[],fuel=[],maze=[],monster,car,exitPos,clock=new THREE.Clock(),keys={},yaw=0,pitch=0;const size=41,cell=3.4;const $=id=>document.getElementById(id);
function generateMaze(){maze=Array.from({length:size},()=>Array(size).fill(1));let stack=[[1,1]];maze[1][1]=0;while(stack.length){let [x,z]=stack[stack.length-1],opts=[];for(const [dx,dz] of [[2,0],[-2,0],[0,2],[0,-2]]){let nx=x+dx,nz=z+dz;if(nx>0&&nz>0&&nx<size-1&&nz<size-1&&maze[nz][nx]===1)opts.push([nx,nz,dx,dz])}if(!opts.length){stack.pop();continue}let [nx,nz,dx,dz]=opts[Math.floor(Math.random()*opts.length)];maze[z+dz/2][x+dx/2]=0;maze[nz][nx]=0;stack.push([nx,nz])}maze[size-1][Math.floor(size/2)]=0;maze[size-2][Math.floor(size/2)]=0;for(let z=1;z<size-1;z+=4)for(let x=1;x<size-1;x+=4){if(Math.random()<.3)maze[z][x]=0}exitPos={x:(size+3)*cell,z:(size-3)*cell};}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x101c12);scene.fog=new THREE.FogExp2(0x172719,.018);camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,900);camera.position.set(cell,1.65,cell);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x9dbd8e,0x182014,1.05));const sun=new THREE.DirectionalLight(0xc5d8ad,.55);sun.position.set(-40,70,-20);scene.add(sun);flashlight=new THREE.SpotLight(0xfff2cf,4,35,Math.PI/3,.45,1);camera.add(flashlight);flashlight.position.set(0,0,0);flashlight.target.position.set(0,0,-1);camera.add(flashlight.target);scene.add(camera);generateMaze();buildWorld();spawnMonster();makeInventory();window.addEventListener('resize',resize);setupControls();const slot=new URLSearchParams(location.search).get('loadSlot');if(slot)loadSlot(Number(slot)-1);animate();}
function buildWorld(){const floor=new THREE.Mesh(new THREE.PlaneGeometry(size*cell,size*cell),new THREE.MeshStandardMaterial({color:0x263b22,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.set(size*cell/2,0,size*cell/2);scene.add(floor);const wallGeo=new THREE.BoxGeometry(cell,2.4,cell),wallMat=new THREE.MeshStandardMaterial({color:0x20472a,roughness:1});const grassGeo=new THREE.BoxGeometry(cell*.92,2.7,cell*.92),grassMat=new THREE.MeshStandardMaterial({color:0x234f2b,roughness:1});for(let z=0;z<size;z++)for(let x=0;x<size;x++)if(maze[z][x]===1){let m=new THREE.Mesh(wallGeo,wallMat);m.position.set(x*cell,1.2,z*cell);scene.add(m);walls.push(new THREE.Box3().setFromObject(m));let top=new THREE.Mesh(grassGeo,new THREE.MeshStandardMaterial({color:[0x1d4325,0x28572c,0x1b3a20][Math.floor(Math.random()*3)],roughness:1}));top.position.set(x*cell,1.35,z*cell);scene.add(top)}else if(Math.random()<.12){let tuft=new THREE.Mesh(new THREE.ConeGeometry(.14,.6,4),new THREE.MeshStandardMaterial({color:0x50753a}));tuft.position.set(x*cell,.25,z*cell);scene.add(tuft)}
// Building behind the start
const building=new THREE.Mesh(new THREE.BoxGeometry(12,7,8),new THREE.MeshStandardMaterial({color:0x555652,roughness:.95}));building.position.set(cell,3.5,-cell*2);scene.add(building);const door=new THREE.Mesh(new THREE.BoxGeometry(2,3,.2),new THREE.MeshStandardMaterial({color:0x171918}));door.position.set(cell,1.5,-cell*6);scene.add(door);
// Open road and parking lot beyond far side
const lotZ=(size+2)*cell,roadMat=new THREE.MeshStandardMaterial({color:0x292d2d,roughness:1});const road=new THREE.Mesh(new THREE.PlaneGeometry(size*cell+20,30),roadMat);road.rotation.x=-Math.PI/2;road.position.set(size*cell/2,0,lotZ+20);scene.add(road);const lot=new THREE.Mesh(new THREE.PlaneGeometry(size*cell+18,24),new THREE.MeshStandardMaterial({color:0x414343,roughness:1}));lot.rotation.x=-Math.PI/2;lot.position.set(size*cell/2,.015,lotZ);scene.add(lot);for(let x=4;x<size-2;x+=4){const line=new THREE.Mesh(new THREE.PlaneGeometry(.09,5),new THREE.MeshBasicMaterial({color:0xd7d5b9}));line.rotation.x=-Math.PI/2;line.position.set(x*cell,.03,lotZ);scene.add(line)}car=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(2.5,1,4.6),new THREE.MeshStandardMaterial({color:0x9c1f28,metalness:.4,roughness:.35}));body.position.y=.8;car.add(body);const cabin=new THREE.Mesh(new THREE.BoxGeometry(2, .8,2.1),new THREE.MeshStandardMaterial({color:0x202d30,metalness:.2,roughness:.25}));cabin.position.set(0,1.55,-.2);car.add(cabin);for(const x of [-1.25,1.25])for(const z of [-1.5,1.5]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,12),new THREE.MeshStandardMaterial({color:0x111}));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.42,z);car.add(wheel)}car.position.set(size*cell/2,0,lotZ+8);scene.add(car);exitPos={x:car.position.x,z:car.position.z+3.5};
// Spawn 9 cans on distinct walkable cells
const valid=[];for(let z=2;z<size-2;z++)for(let x=2;x<size-2;x++)if(maze[z][x]===0&&Math.hypot(x-1,z-1)>5)valid.push([x,z]);valid.sort(()=>Math.random()-.5);for(let i=0;i<9;i++){let [x,z]=valid[i* Math.max(1,Math.floor(valid.length/9))];const g=new THREE.Group();let can=new THREE.Mesh(new THREE.BoxGeometry(.55,.8,.35),new THREE.MeshStandardMaterial({color:0xffb52f,metalness:.45,roughness:.35,emissive:0x553000}));can.position.y=.55;g.add(can);const cap=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.1,8),new THREE.MeshStandardMaterial({color:0x292929}));cap.position.set(0,1,0);g.add(cap);g.position.set(x*cell,0,z*cell);scene.add(g);fuel.push({mesh:g,collected:false})}}
function spawnMonster(){monster=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:0x080909,roughness:.9});let torso=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.5,4,7),mat);torso.position.y=1.5;monster.add(torso);for(const x of [-.24,.24]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.1,8,8),new THREE.MeshBasicMaterial({color:0xff1d1d}));eye.position.set(x,2.25,-.48);monster.add(eye)}monster.position.set((size-2)*cell,0,(size-2)*cell);scene.add(monster)}
function makeInventory(){const el=$('inventory');el.innerHTML='';inventory.forEach((it,i)=>{const b=document.createElement('button');b.className='item'+(i===selected?' selected':'');b.innerHTML='<span class="key">'+(i+1)+'</span><div style="padding-top:12px">'+it.name+'</div><strong>x'+it.count+'</strong>';b.onclick=()=>useItem(i);el.appendChild(b)})}
function useItem(i=selected){selected=i;const it=inventory[i];if(!it||it.count<=0)return;if(it.name==='Medkit'){if(health>=100)return;health=Math.min(100,health+40)}else if(it.name==='Battery'){if(battery>=100)return;battery=Math.min(100,battery+55)}else if(it.name==='Flare'){if(monster&&camera.position.distanceTo(monster.position)<18){monster.userData.stunned=4;$('msg').textContent='The flare distracts it!'}else $('msg').textContent='The flare burns brightly, but nothing is close.'}it.count--;makeInventory();updateHud()}
function saveSlot(index){let slots;try{slots=JSON.parse(localStorage.getItem(SAVEKEY))||[null,null,null]}catch{slots=[null,null,null]}slots[index]={chapter:2,savedAt:Date.now(),health:Math.round(health),battery:Math.round(battery),inventory:inventory.map(x=>x.name+' ×'+x.count).join(', '),state:{health,battery,canisters,inventory,player:{x:camera.position.x,z:camera.position.z,yaw,pitch},fuel:fuel.map(x=>x.collected),monster:{x:monster.position.x,z:monster.position.z}}};localStorage.setItem(SAVEKEY,JSON.stringify(slots));$('msg').textContent='Saved to slot '+(index+1)}
function loadSlot(index){try{let slots=JSON.parse(localStorage.getItem(SAVEKEY))||[];let s=slots[index];if(!s||s.chapter!==2||!s.state)return;let d=s.state;health=d.health;battery=d.battery;canisters=d.canisters;inventory=d.inventory;camera.position.set(d.player.x,1.65,d.player.z);yaw=d.player.yaw;pitch=d.player.pitch;d.fuel.forEach((v,i)=>{fuel[i].collected=v;if(v)scene.remove(fuel[i].mesh)});monster.position.set(d.monster.x,0,d.monster.z);makeInventory();updateHud();$('msg').textContent='Save loaded'}catch{}}
function updateHud(){$('fuelText').textContent='FUEL CANISTERS: '+canisters+' / 9';$('health').style.width=health+'%';$('battery').style.width=battery+'%'}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function setupControls(){renderer.domElement.addEventListener('click',()=>{if(innerWidth>=800&&started&&!ended)renderer.domElement.requestPointerLock?.()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-1.1,Math.min(1.1,pitch-e.movementY*.002))}});window.addEventListener('keydown',e=>{keys[e.code]=true;if(/^Digit[1-9]$/.test(e.code)){selected=Number(e.code.slice(5))-1;useItem(selected)}if(e.code==='KeyE')interact();if(e.code==='KeyF')toggleLight();if(e.code==='ShiftLeft'||e.code==='ShiftRight')running=true});window.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code.startsWith('Shift'))running=false});$('run').onpointerdown=()=>running=true;$('run').onpointerup=$('run').onpointercancel=()=>running=false;$('light').onclick=toggleLight;$('use').onclick=interact;$('save').onclick=()=>showSaveChooser();let start=null,stick=$('stick'),knob=$('knob');renderer.domElement.addEventListener('touchstart',e=>{if(e.touches[0].clientX<innerWidth*.55&&innerWidth<800){start={x:e.touches[0].clientX,y:e.touches[0].clientY};stick.style.display='block';stick.style.left=Math.max(10,start.x-50)+'px';stick.style.bottom=Math.max(10,innerHeight-start.y-50)+'px'}else if(e.touches[0].clientX>=innerWidth*.45){lookTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}}},{passive:false});let lookTouch=null;renderer.domElement.addEventListener('touchmove',e=>{e.preventDefault();if(start){let t=e.touches[0],dx=t.clientX-start.x,dy=t.clientY-start.y;keys.TouchForward=dy<-12;keys.TouchBack=dy>12;keys.TouchLeft=dx<-12;keys.TouchRight=dx>12;knob.style.transform='translate('+Math.max(-25,Math.min(25,dx/2))+'px,'+Math.max(-25,Math.min(25,dy/2))+'px)'}if(lookTouch){let t=e.touches[e.touches.length-1];yaw-=(t.clientX-lookTouch.x)*.006;pitch=Math.max(-1.1,Math.min(1.1,pitch-(t.clientY-lookTouch.y)*.004));lookTouch={x:t.clientX,y:t.clientY}}},{passive:false});renderer.domElement.addEventListener('touchend',()=>{start=null;lookTouch=null;stick.style.display='none';['TouchForward','TouchBack','TouchLeft','TouchRight'].forEach(k=>keys[k]=false)})}
function toggleLight(){if(battery>0){lightOn=!lightOn;flashlight.intensity=lightOn?4:0}}
function interact(){if(ended)return;if(camera.position.distanceTo(car.position)<6){if(canisters>=9){win()}else $('msg').textContent='The car needs '+(9-canisters)+' more canisters.';return}let nearest=null,dist=2.4;fuel.forEach(f=>{if(!f.collected){let d=camera.position.distanceTo(f.mesh.position);if(d<dist){dist=d;nearest=f}}});if(nearest){nearest.collected=true;canisters++;scene.remove(nearest.mesh);$('msg').textContent='Fuel canister found!';updateHud()}else $('msg').textContent='Nothing to use here.'}
function showSaveChooser(){let n=prompt('Save to slot 1, 2, or 3?');if(['1','2','3'].includes(n))saveSlot(Number(n)-1)}
function win(){ended=true;let c;try{c=JSON.parse(localStorage.getItem(CAMPAIGN))||{unlocked:1,beaten:[]}}catch{c={unlocked:1,beaten:[]}}if(!c.beaten.includes(2))c.beaten.push(2);c.unlocked=Math.max(c.unlocked||1,3);localStorage.setItem(CAMPAIGN,JSON.stringify(c));$('overlay').innerHTML='<div class="card"><h1>YOU ESCAPED</h1><p>You found all nine canisters and made it to the car. The road is open. For now.</p><button onclick="location.href=\'maze-of-shadows-menu.html\'">CONTINUE</button><button onclick="location.reload()">PLAY AGAIN</button></div>';$('overlay').style.display='flex'}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);if(started&&!ended){if(lightOn){battery=Math.max(0,battery-dt*.32);if(!battery)toggleLight()}let forward=(keys.KeyW||keys.ArrowUp||keys.TouchForward?1:0)-(keys.KeyS||keys.ArrowDown||keys.TouchBack?1:0),side=(keys.KeyD||keys.TouchRight?1:0)-(keys.KeyA||keys.TouchLeft?1:0);let moving=forward||side;let speed=running&&stamina>0?.13:.075;if(running&&moving)stamina=Math.max(0,stamina-dt*20);else stamina=Math.min(100,stamina+dt*12);if(moving){let dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed,dz=(-Math.cos(yaw)*forward+Math.sin(yaw)*side)*speed;let nx=camera.position.x+dx,nz=camera.position.z+dz;if(!collides(nx,camera.position.z))camera.position.x=nx;if(!collides(camera.position.x,nz))camera.position.z=nz}camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;fuel.forEach(f=>{if(!f.collected){f.mesh.rotation.y+=dt*.7;if(camera.position.distanceTo(f.mesh.position)<1.5) $('status').textContent='Canister nearby! Press E / USE'}});if(monster.userData.stunned>0)monster.userData.stunned-=dt;else{let dir=camera.position.clone().sub(monster.position);dir.y=0;let d=dir.length();if(d<45){dir.normalize();let nx=monster.position.x+dir.x*.085,nz=monster.position.z+dir.z*.085;if(!collides(nx,monster.position.z))monster.position.x=nx;if(!collides(monster.position.x,nz))monster.position.z=nz;monster.lookAt(camera.position.x,monster.position.y,camera.position.z)}if(d<1.5){health-=dt*20;if(health<=0){health=0;ended=true;$('overlay').innerHTML='<div class="card"><h1>YOU WERE FOUND</h1><p>The maze kept you. Your collected fuel is lost unless you saved.</p><button onclick="location.reload()">RETRY</button><button onclick="location.href=\'maze-of-shadows-menu.html\'">MENU</button></div>';$('overlay').style.display='flex'}}}updateHud()}renderer.render(scene,camera)}
function collides(x,z){for(const b of walls){if(x>b.min.x-.45&&x<b.max.x+.45&&z>b.min.z-.45&&z<b.max.z+.45)return true}return false}
$('begin').onclick=()=>{$('overlay').style.display='none';started=true};init();
</script></body></html>
