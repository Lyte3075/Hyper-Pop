<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Maze of Shadows: The Overgrowth</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: monospace; user-select: none; -webkit-user-select: none;
            touch-action: none;
        }
        #game-container { width: 100%; height: 100%; position: absolute; }
        
        #fx-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        #touch-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 10; display: flex;
            touch-action: none;
        }
        #touch-move-zone { width: 50%; height: 100%; touch-action: none; }
        #touch-look-zone { width: 50%; height: 100%; touch-action: none; }
        
        #joystick-base {
            position: fixed;
            width: 100px; height: 100px;
            margin-left: -50px; margin-top: -50px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: none; pointer-events: none;
            z-index: 50; box-sizing: border-box;
        }

        #joystick-stick {
            position: absolute; top: 50%; left: 50%;
            width: 40px; height: 40px;
            margin-left: -20px; margin-top: -20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%; pointer-events: none;
            transform: translate(0px, 0px);
        }

        #ui {
            position: absolute; top: 15px; left: 15px;
            color: #ff3333; font-size: 13px; z-index: 20;
            pointer-events: none; text-shadow: 0 0 5px #000;
        }
        .bar-bg { width: 140px; height: 8px; background: #222; border: 1px solid #555; margin: 3px 0 6px 0; }
        #health-bar { width: 100%; height: 100%; background: #ff0000; }
        #stamina-bar { width: 100%; height: 100%; background: #00ff88; }
        #battery-bar { width: 100%; height: 100%; background: #ffff00; }

        #key-tracker {
            color: #ffd700; font-weight: bold; font-size: 15px; margin-bottom: 4px;
            text-shadow: 0 0 8px #ffaa00;
        }
        #danger-level {
            color: #ff3300; font-weight: bold; font-size: 12px; margin-bottom: 8px;
            text-shadow: 0 0 5px #ff0000;
        }

        .game-btn {
            position: absolute; width: 65px; height: 65px; border-radius: 50%;
            background: rgba(0, 0, 0, 0.6); border: 2px solid #fff; color: #fff;
            font-size: 11px; font-weight: bold; z-index: 25;
            display: flex; align-items: center; justify-content: center;
            touch-action: manipulation;
        }
        #flashlight-btn { bottom: 25px; right: 15px; }
        #sprint-btn { bottom: 100px; right: 15px; }
        #crouch-btn { bottom: 25px; right: 90px; background: rgba(30,55,35,0.85); }
        #hide-btn { bottom: 25px; right: 90px; background: rgba(0, 150, 255, 0.6); display: none; }
        #use-item-btn { bottom: 100px; right: 90px; background: rgba(0, 255, 100, 0.6); display: none; }

        #banisher-jumpscare.monster-scare .scare-face { background: radial-gradient(circle at 40% 32%,#fff 0%,#f1f1f1 48%,#888 100%); box-shadow:0 0 70px #fff,0 0 140px #aaa; }
        #banisher-jumpscare.scare-brute .scare-face { border-radius:35% 35% 28% 28%; background:linear-gradient(90deg,#250500,#090000 25%,#35100a 50%,#090000 75%,#250500); }
        #banisher-jumpscare.scare-stalker .scare-face { border-radius:48% 48% 20% 20%; background:radial-gradient(circle,#280000,#020000 68%); transform:scale(.18) skewX(-12deg); }
        #banisher-jumpscare.scare-crawler .scare-face { border-radius:60% 35% 45% 25%; background:radial-gradient(circle,#ded8a4,#252516 65%,#000); }
        #banisher-jumpscare.scare-phantasm .scare-face, #banisher-jumpscare.scare-phantom .scare-face { background:radial-gradient(circle,#c5a5ff,#382052 55%,#050008); filter:blur(.5px) contrast(1.6); }
        #banisher-jumpscare.scare-wraith .scare-face { background:radial-gradient(circle,#d7ffff,#23717b 55%,#001014); box-shadow:0 0 80px #50f5ff; }
        #banisher-jumpscare.scare-banshee .scare-face { background:radial-gradient(circle,#fff0d6,#7a1e00 60%,#100000); transform:scale(.18) rotate(10deg); }
        #banisher-jumpscare.scare-devourer .scare-face { background:radial-gradient(circle,#6d0017,#130006 65%,#000); border-radius:30% 30% 50% 50%; }
        #banisher-jumpscare.scare-demogorgon .scare-face { background:radial-gradient(circle,#9a251b,#210503 60%,#000); clip-path:polygon(50% 0,70% 12%,100% 35%,84% 72%,50% 100%,16% 72%,0 35%,30% 12%); }
        #banisher-jumpscare.scare-ghost .scare-face { background:radial-gradient(circle,#effbff,#9cc9e2 55%,#273c59); opacity:.86; }
        #banisher-jumpscare.scare-smiler .scare-face { background:radial-gradient(circle at 40% 30%,#fff 0%,#f5f5f5 55%,#aaa 100%); box-shadow:0 0 80px #fff,0 0 180px #fff; }
        #banisher-jumpscare.monster-scare .scare-eye { background:#050000; box-shadow:0 0 18px #000; }
        #banisher-jumpscare.monster-scare .scare-mouth { background:#020000; border-color:#111; box-shadow:0 0 25px #000; }
        #banisher-jumpscare.monster-scare .scare-mouth:before, #banisher-jumpscare.monster-scare .scare-mouth:after { background:repeating-linear-gradient(90deg,#fff 0 7%,#555 7% 9%); }

        /* Individual creature-specific jumpscare silhouettes and motion. */
        #banisher-jumpscare.monster-scare .scare-face { will-change: transform, filter, border-radius, clip-path; }
        #banisher-jumpscare.scare-brute .scare-face { animation: scareBrute 0.82s cubic-bezier(.15,.8,.2,1) forwards; }
        #banisher-jumpscare.scare-stalker .scare-face { animation: scareStalker .95s steps(5,end) forwards; }
        #banisher-jumpscare.scare-crawler .scare-face { animation: scareCrawler .8s cubic-bezier(.2,.9,.3,1) forwards; transform-origin: 50% 80%; }
        #banisher-jumpscare.scare-phantasm .scare-face, #banisher-jumpscare.scare-phantom .scare-face { animation: scarePhantasm 1s ease-out forwards; }
        #banisher-jumpscare.scare-wraith .scare-face { animation: scareWraith .9s steps(7,end) forwards; }
        #banisher-jumpscare.scare-banshee .scare-face { animation: scareBanshee 1s cubic-bezier(.1,.7,.1,1) forwards; }
        #banisher-jumpscare.scare-devourer .scare-face { animation: scareDevourer .78s cubic-bezier(.05,.9,.15,1) forwards; }
        #banisher-jumpscare.scare-demogorgon .scare-face { animation: scareDemogorgon .86s steps(4,end) forwards; }
        #banisher-jumpscare.scare-ghost .scare-face { animation: scareGhost 1.1s ease-in-out forwards; }
        #banisher-jumpscare.scare-smiler .scare-face { animation: scareSmiler .9s cubic-bezier(.03,.85,.2,1) forwards; border-radius: 46% 54% 48% 52%; }
        #banisher-jumpscare.scare-smiler .scare-eye { top: 23%; width: 9%; height: 23%; border-radius: 8% 8% 50% 50%; background: #000; box-shadow: 0 0 0 7px #fff, 0 0 25px 12px #000; }
        #banisher-jumpscare.scare-smiler .scare-eye.left { left: 27%; transform: rotate(9deg) scaleY(1.2); }
        #banisher-jumpscare.scare-smiler .scare-eye.right { right: 27%; transform: rotate(-9deg) scaleY(1.2); }
        #banisher-jumpscare.scare-smiler .scare-mouth { top: 52%; left: 8%; width: 84%; height: 34%; border-radius: 8% 8% 50% 50%; clip-path: polygon(0 0,12% 10%,24% 14%,38% 12%,50% 19%,62% 12%,76% 14%,88% 10%,100% 0,92% 70%,75% 95%,50% 100%,25% 95%,8% 70%); box-shadow: 0 0 28px #000, inset 0 0 15px #550000; }
        #banisher-jumpscare.scare-smiler .scare-mouth:before { top: 1%; height: 35%; background: repeating-linear-gradient(90deg,#fff 0 5%,#111 5% 6.5%); }
        #banisher-jumpscare.scare-smiler .scare-mouth:after { bottom: 1%; height: 29%; background: repeating-linear-gradient(90deg,#fff 0 5%,#111 5% 6.5%); }
        #banisher-jumpscare.scare-brute .scare-mouth { height: 42%; top: 47%; border-radius: 2%; clip-path: polygon(0 0,100% 0,86% 100%,14% 100%); }
        #banisher-jumpscare.scare-stalker .scare-eye { height: 26%; width: 8%; top: 25%; border-radius: 0; }
        #banisher-jumpscare.scare-crawler .scare-eye { top: 34%; height: 10%; width: 19%; border-radius: 50%; }
        #banisher-jumpscare.scare-crawler .scare-mouth { top: 53%; height: 38%; left: 28%; width: 44%; border-radius: 50%; clip-path: none; }
        #banisher-jumpscare.scare-wraith .scare-eye { height: 25%; width: 8%; background: #aaffff; box-shadow: 0 0 22px #00faff; }
        #banisher-jumpscare.scare-wraith .scare-mouth { left: 35%; width: 30%; height: 38%; border-radius: 50%; background: #001014; }
        #banisher-jumpscare.scare-banshee .scare-mouth { top: 46%; height: 43%; border-radius: 50% 50% 8% 8%; clip-path: polygon(0 0,100% 0,80% 100%,20% 100%); }
        #banisher-jumpscare.scare-devourer .scare-mouth { top: 43%; height: 48%; left: 12%; width: 76%; border-radius: 50%; clip-path: ellipse(48% 50% at 50% 50%); }
        #banisher-jumpscare.scare-demogorgon .scare-eye { top: 18%; height: 13%; width: 13%; border-radius: 50%; background: #ff210c; box-shadow: 0 0 22px #ff1600; }
        #banisher-jumpscare.scare-demogorgon .scare-mouth { top: 35%; left: 15%; width: 70%; height: 57%; border-radius: 50%; clip-path: polygon(50% 0,100% 50%,50% 100%,0 50%); }
        #banisher-jumpscare.scare-ghost .scare-eye { background: #172b44; opacity: .7; box-shadow: 0 0 20px #bcecff; }
        #banisher-jumpscare.scare-ghost .scare-mouth { background: #1b2c40; height: 40%; border-radius: 50%; filter: blur(2px); }
        @keyframes scareBrute { 0%{transform:scale(.1) translateY(35vh);filter:brightness(.2)} 55%{transform:scale(1.25) translateY(-2vh);filter:brightness(1.7)} 72%{transform:scale(.94) translateX(-2vw)} 100%{transform:scale(1.08);filter:brightness(1.1)} }
        @keyframes scareStalker { 0%{transform:translateX(-55vw) scale(.2) skewX(20deg)} 35%{transform:translateX(12vw) scale(.6) skewX(-18deg)} 55%{transform:translateX(-8vw) scale(.8) skewX(12deg)} 100%{transform:translateX(0) scale(1.1);filter:contrast(2)} }
        @keyframes scareCrawler { 0%{transform:translateY(50vh) rotate(25deg) scale(.15)} 60%{transform:translateY(-3vh) rotate(-8deg) scale(1.25)} 80%{transform:translateY(2vh) rotate(4deg) scale(1)} 100%{transform:translateY(0) rotate(0) scale(1.08)} }
        @keyframes scarePhantasm { 0%{transform:scale(1.8);opacity:0;filter:blur(30px)} 40%{opacity:.9;filter:blur(4px)} 65%{transform:scale(.82);opacity:.4;filter:blur(12px)} 100%{transform:scale(1.15);opacity:1;filter:blur(0) contrast(1.8)} }
        @keyframes scareWraith { 0%,100%{transform:scale(.3) translateX(0);opacity:.2} 20%{transform:scale(1.4) translateX(-5vw);opacity:1} 40%{transform:scale(.7) translateX(5vw);opacity:.35} 60%{transform:scale(1.35) translateX(-2vw);opacity:1} 80%{transform:scale(.9) translateX(2vw);opacity:.65} }
        @keyframes scareBanshee { 0%{transform:scale(.05) rotate(-35deg);filter:brightness(4)} 35%{transform:scale(1.4) rotate(12deg);filter:brightness(2)} 52%{transform:scale(1.1) rotate(-8deg)} 100%{transform:scale(1.15) rotate(0);filter:brightness(1.3)} }
        @keyframes scareDevourer { 0%{transform:scale(.05);filter:brightness(.1)} 45%{transform:scale(1.45);filter:brightness(2.4)} 62%{transform:scale(.9)} 100%{transform:scale(1.2);filter:brightness(1.2)} }
        @keyframes scareDemogorgon { 0%{transform:scale(.1) rotate(-15deg)} 25%{transform:scale(1.5) rotate(10deg)} 50%{transform:scale(1.05) rotate(-8deg)} 75%{transform:scale(1.3) rotate(4deg)} 100%{transform:scale(1.12) rotate(0)} }
        @keyframes scareGhost { 0%{transform:scale(.2);opacity:0;filter:blur(15px)} 35%{transform:scale(1.3);opacity:.9;filter:blur(0)} 65%{transform:scale(.85);opacity:.3;filter:blur(8px)} 100%{transform:scale(1.08);opacity:1;filter:blur(1px)} }
        @keyframes scareSmiler { 0%{transform:scale(.015) rotate(-12deg);filter:brightness(8) contrast(2)} 38%{transform:scale(1.55) rotate(5deg);filter:brightness(1.8) contrast(1.5)} 56%{transform:scale(1.15) rotate(-3deg)} 72%{transform:scale(1.3) rotate(1deg)} 100%{transform:scale(1.12);filter:brightness(1.1) contrast(1.3)} }

        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 0, 0, 0.95); color: #ff0000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 30; font-size: 24px; display: none; text-align: center; padding: 20px;
            box-sizing: border-box;
        }
        #death-hint {
            color: #ffaaaa; font-size: 15px; max-width: 450px; margin-top: 15px;
            line-height: 1.4; border-top: 1px solid #550000; padding-top: 15px;
        }
        #death-hint .banisher-wrath {
            display: inline-block; color: #ff1515; font-weight: 900; letter-spacing: 2px;
            text-shadow: 0 0 4px #ff0000, 0 0 12px #b00000, 0 0 24px #650000;
            animation: wrathPulse .55s steps(2,end) infinite, wrathShake .16s infinite;
        }
        @keyframes wrathPulse {
            0%,100% { opacity: 1; text-shadow: 0 0 4px #ff0000, 0 0 12px #b00000, 0 0 24px #650000; }
            50% { opacity: .45; text-shadow: 0 0 10px #ff0000, 0 0 28px #ff0000; }
        }
        @keyframes wrathShake {
            0%,100% { transform: translateX(0) skewX(0); }
            25% { transform: translateX(-1px) skewX(-3deg); }
            75% { transform: translateX(1px) skewX(3deg); }
        }
        #banisher-jumpscare {
            position: fixed; inset: 0; z-index: 10000; display: none; overflow: hidden;
            align-items: center; justify-content: center; background: #000;
            perspective: 500px;
        }
        #banisher-jumpscare.active { display: flex; animation: scareFlash 1.15s steps(2,end) forwards; }
        #banisher-jumpscare .scare-face {
            position: relative; width: min(88vw, 520px); aspect-ratio: 1 / 1;
            border-radius: 50%; background: radial-gradient(ellipse at 42% 32%, #fff 0%, #f4f4f4 48%, #bdbdbd 78%, #555 100%);
            box-shadow: 0 0 55px #fff, 0 0 120px #d7d7d7, inset -18px -22px 42px #777;
            transform: scale(.18) rotate(-8deg); animation: scareLunge .72s cubic-bezier(.1,.85,.2,1) forwards;
        }
        #banisher-jumpscare .scare-eye {
            position: absolute; top: 29%; width: 13%; height: 19%; background: #050505;
            border-radius: 50%; box-shadow: 0 0 9px #000, inset 0 0 5px #333;
        }
        #banisher-jumpscare .scare-eye.left { left: 25%; transform: rotate(12deg); }
        #banisher-jumpscare .scare-eye.right { right: 25%; transform: rotate(-12deg); }
        #banisher-jumpscare .scare-mouth {
            position: absolute; left: 17%; top: 52%; width: 66%; height: 30%;
            border-radius: 10% 10% 48% 48% / 10% 10% 75% 75%; background: #050505;
            border: 3px solid #111; box-shadow: 0 4px 0 #777; overflow: hidden;
            clip-path: polygon(0 0, 15% 8%, 30% 12%, 50% 16%, 70% 12%, 85% 8%, 100% 0, 94% 65%, 78% 90%, 50% 100%, 22% 90%, 6% 65%);
        }
        #banisher-jumpscare .scare-mouth:before {
            content: ''; position: absolute; top: 2%; left: 2%; width: 96%; height: 27%;
            background: repeating-linear-gradient(90deg,#fff 0 10%,#aaa 10% 11.5%);
        }
        #banisher-jumpscare .scare-mouth:after {
            content: ''; position: absolute; bottom: 2%; left: 5%; width: 90%; height: 21%;
            background: repeating-linear-gradient(90deg,#eee 0 10%,#777 10% 11.5%);
        }
        #banisher-jumpscare .scare-label {
            position: absolute; bottom: 9%; left: 0; width: 100%; color: #ff1616;
            font: 900 clamp(20px,5vw,42px) monospace; text-align: center;
            letter-spacing: .15em; text-shadow: 0 0 12px #f00;
        }
        @keyframes scareLunge {
            0% { transform: scale(.18) rotate(-8deg); filter: brightness(.25); }
            65% { transform: scale(1.18) rotate(3deg); filter: brightness(1.7); }
            100% { transform: scale(1) rotate(0); filter: brightness(1); }
        }
        @keyframes scareFlash {
            0%,20%,45%,70% { background: #000; }
            10%,35%,60%,85% { background: #260000; }
            100% { background: #000; }
        }
        @keyframes eyeFlicker { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
        #terminal-panel { position:fixed; inset:8% 7%; z-index:80; display:none; flex-direction:column; justify-content:center; padding:clamp(18px,4vw,42px); box-sizing:border-box; background:rgba(0,8,5,.97); border:2px solid #19ff83; box-shadow:0 0 35px #00ff6655,inset 0 0 28px #00ff6615; color:#7dffae; font:clamp(13px,2vw,18px) monospace; text-shadow:0 0 8px #00ff66; }
        #terminal-panel.visible { display:flex; }
        #terminal-panel h2 { margin:0 0 16px; font-size:clamp(18px,3vw,28px); letter-spacing:.12em; }
        #terminal-output { white-space:pre-wrap; line-height:1.7; margin:0 0 20px; }
        .terminal-action { align-self:flex-start; background:#03190c; border:1px solid #32ff8d; color:#a4ffc6; padding:12px 16px; font:bold 14px monospace; margin:5px 8px 0 0; cursor:pointer; }
        #interact-computer-btn { position:fixed; left:50%; bottom:22%; transform:translateX(-50%); z-index:28; display:none; background:#03190cdd; border:1px solid #32ff8d; color:#a4ffc6; padding:12px 18px; font:bold 13px monospace; border-radius:8px; touch-action:none; pointer-events:auto; -webkit-user-select:none; user-select:none; }
        /* The Static's warning is rendered through the 3D scene fog, not a screen overlay. */
        #banisher-jumpscare.scare-static { background:#f8f8f8; animation:staticFlash .08s steps(2,end) infinite!important; }
        #banisher-jumpscare.scare-static .scare-face { width:min(96vw,700px); border-radius:0; background:#050505; box-shadow:0 0 0 12px #fff,0 0 70px #fff; animation:staticLunge .46s steps(3,end) forwards; clip-path:polygon(0 15%,10% 20%,14% 5%,25% 18%,37% 0,45% 17%,57% 3%,68% 20%,82% 7%,89% 23%,100% 12%,94% 48%,100% 83%,84% 78%,76% 100%,61% 83%,49% 100%,37% 82%,22% 98%,16% 80%,0 88%,7% 53%); }
        #banisher-jumpscare.scare-static .scare-eye { background:#fff; box-shadow:0 0 25px #fff; width:16%; height:20%; top:25%; }
        #banisher-jumpscare.scare-static .scare-mouth { background:#fff; border:0; top:48%; left:9%; width:82%; height:40%; clip-path:polygon(0 0,13% 15%,27% 10%,39% 22%,51% 5%,64% 18%,79% 7%,100% 0,91% 68%,75% 90%,62% 66%,50% 100%,37% 70%,22% 92%,8% 70%); }
        #banisher-jumpscare.scare-static .scare-mouth:before,#banisher-jumpscare.scare-static .scare-mouth:after { background:repeating-linear-gradient(90deg,#000 0 5%,#fff 5% 7%); height:45%; }
        @keyframes staticFlash { 0%,100%{background:#fff} 50%{background:#000} }
        @keyframes staticLunge { 0%{transform:scale(.08) rotate(-15deg);filter:invert(1)} 50%{transform:scale(1.4) rotate(8deg);filter:contrast(3)} 100%{transform:scale(1.08);filter:contrast(2)} }
        #start-btn {
            padding: 12px 28px; font-size: 16px; background: #330000;
            color: #fff; border: 1px solid #ff0000; margin-top: 25px; cursor: pointer;
        }

 #jumpscare .scare-text,#jumpscare .jumpscare-text,#jumpscare .message,#scare .scare-text,#scare .jumpscare-text,#banisher-jumpscare .scare-label{display:none!important}
</style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <canvas id="fx-canvas"></canvas>

    <div id="ui">
        <div id="key-tracker">FUEL CANISTERS: 0 / 9</div>
        <div id="danger-level">THREAT LEVEL: LOW</div>
        <div>Health:</div>
        <div class="bar-bg"><div id="health-bar"></div></div>
        <div>Stamina:</div>
        <div class="bar-bg"><div id="stamina-bar"></div></div>
        <div>Flashlight:</div>
        <div class="bar-bg"><div id="battery-bar"></div></div>
        <div id="status-msg" style="color: #00ffff; font-weight: bold; margin-top: 5px;"></div>
        <div id="inventory-msg" style="color: #00ff88; font-weight: bold; margin-top: 2px;"></div>
    </div>

    <button id="flashlight-btn" class="game-btn">LIGHT</button>
    <button id="sprint-btn" class="game-btn">RUN</button>
    <button id="crouch-btn" class="game-btn">CROUCH</button>
    <button id="hide-btn" class="game-btn">HIDE</button>
    <button id="use-item-btn" class="game-btn">USE ITEM</button>

    <div id="touch-overlay">
        <div id="touch-move-zone"></div>
        <div id="touch-look-zone"></div>
    </div>

    <div id="joystick-base"><div id="joystick-stick"></div></div>

     <div id="banisher-jumpscare" aria-hidden="true">
        <div class="scare-face">
            <div class="scare-eye left"></div><div class="scare-eye right"></div>
            <div class="scare-mouth"></div>
            <div class="scare-label">FOUND YOU</div>
        </div>
    </div>
    <button id="interact-computer-btn">E · INTERACT</button>
    <div id="terminal-panel" role="dialog" aria-modal="true" aria-label="Maze control terminal">
        <h2>COURTYARD CONTROL // NODE 01</h2>
        <pre id="terminal-output">SYSTEM ONLINE
GREENHOUSE SECURITY GATE: LOCKED
FUEL CANISTERS REQUIRED: 9
ACCESS NODE READY...</pre>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%;margin:4px 0 10px">
            <input id="terminal-command-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter command, e.g. /chase" aria-label="Terminal command" style="flex:1;min-width:180px;background:#001108;color:#a4ffc6;border:1px solid #32ff8d;padding:12px;font:bold 14px monospace;outline:none">
            <button id="terminal-command-run" class="terminal-action">RUN COMMAND</button>
        </div>
        <div><button id="terminal-unlock-btn" class="terminal-action">AUTHORIZE GATE RELEASE</button><button id="terminal-close-btn" class="terminal-action">CLOSE TERMINAL</button></div>
    </div>
    <div id="game-over">
        <h1 id="status-text">YOU WERE CONSUMED</h1>
        <div id="death-hint">Hint goes here...</div>
        <button id="start-btn" onclick="location.reload()">RETRY</button>

        // Pathfinding Algorithm
        function findAStarPath(startCell, targetCell) {
            let openSet = [startCell];
            let cameFrom = {};
            let gScore = {}, fScore = {};

            let key = c => `${c.r},${c.c}`;
            gScore[key(startCell)] = 0;
            fScore[key(startCell)] = Math.hypot(startCell.r - targetCell.r, startCell.c - targetCell.c);

            while (openSet.length > 0) {
                openSet.sort((a, b) => fScore[key(a)] - fScore[key(b)]);
                let current = openSet.shift();

                if (current.r === targetCell.r && current.c === targetCell.c) {
                    let path = [current];
                    while (cameFrom[key(current)]) {
                        current = cameFrom[key(current)];
                        path.unshift(current);
                    }
                    return path;
                }

                const dirs = [{r:-1,c:0}, {r:1,c:0}, {r:0,c:-1}, {r:0,c:1}];
                for (let d of dirs) {
                    let neighbor = { r: current.r + d.r, c: current.c + d.c };
                    if (neighbor.r >= 0 && neighbor.r < mazeGrid.length && neighbor.c >= 0 && neighbor.c < mazeGrid[0].length) {
                        if (mazeGrid[neighbor.r][neighbor.c] === 0) {
                            let tentativeG = gScore[key(current)] + 1;
                            if (tentativeG < (gScore[key(neighbor)] ?? Infinity)) {
                                cameFrom[key(neighbor)] = current;
                                gScore[key(neighbor)] = tentativeG;
                                fScore[key(neighbor)] = tentativeG + Math.hypot(neighbor.r - targetCell.r, neighbor.c - targetCell.c);
                                if (!openSet.some(n => n.r === neighbor.r && n.c === neighbor.c)) openSet.push(neighbor);
                            }
                        }
                    }
                }
            }
            return null;
        }

        function worldToCell(x, z) {
            return {
                c: Math.min(mazeGrid[0].length - 1, Math.max(0, Math.round(x / cellSize))),
                r: Math.min(mazeGrid.length - 1, Math.max(0, Math.round(z / cellSize)))
            };
        }

        function cellToWorld(c,r){return new THREE.Vector3(c*cellSize,0,r*cellSize);}
        function nearestWalkableCell(x,z,origin){const p=origin||worldToCell(x,z);if(mazeGrid[p.r]&&mazeGrid[p.r][p.c]===0)return p;let best=null,bd=Infinity;for(let r=Math.max(0,p.r-2);r<=Math.min(mazeGrid.length-1,p.r+2);r++)for(let c=Math.max(0,p.c-2);c<=Math.min(mazeGrid[0].length-1,p.c+2);c++){if(mazeGrid[r][c]!==0)continue;const d=Math.hypot(c*cellSize-x,r*cellSize-z);if(d<bd){bd=d;best={r,c};}}return best||{r:1,c:1};}

        // Procedural, locally generated textures add grime without external assets.
        function createHospitalTexture(kind) {

            const ctx = canvas.getContext('2d');

                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
                for (let i = 0; i < 180; i++) {
                    ctx.fillStyle = 'rgba(7,14,8,' + (0.08 + Math.random() * 0.22) + ')';

                }
            } else {

            const texture = new THREE.CanvasTexture(canvas);

        // Invisible outer-world collision bounds. They are collision-only and never rendered.
        let outerWorldBounds = null;
        function isOutsidePlayableWorld(position) {
            if (!outerWorldBounds) return false;
            if (position.x < outerWorldBounds.minX || position.x > outerWorldBounds.maxX ||
                position.z < outerWorldBounds.minZ || position.z > outerWorldBounds.maxZ) return true;
            // Invisible forcefields keep the player in the narrow hospital approach instead of
            // allowing a shortcut around either side of the building.
            const hospitalCenterX = 10 * cellSize;
            if (position.z < -2.2 && position.x > hospitalCenterX - 5.0 && position.x < hospitalCenterX + 5.0) return false;
            if (position.z < -2.2 && (position.x <= hospitalCenterX - 5.0 || position.x >= hospitalCenterX + 5.0)) return true;

        function buildMaze() {
            // Open a broad, square control courtyard at the maze's center, matching the map concept.
            for (let r = 9; r <= 11; r++) for (let col = 9; col <= 11; col++) mazeGrid[r][col] = 0;

            const mazeWidth = mazeGrid[0].length * cellSize;
            const mazeHeight = mazeGrid.length * cellSize;

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(mazeWidth, mazeHeight), floorMat);
            floor.rotation.x = -Math.PI / 2;

            outerWorldBounds = {
                minX: -mazeWidth * 0.32,
                maxX: mazeWidth + mazeWidth * 0.32,
                minZ: -22,
                maxZ: mazeHeight + 95
            };


            // Most hedge cells are solid to the ground; selected hedge cells can be crouched beneath.
            const hedgeHeight = 2.76;
            crouchableCells = new Set();
            const protectedCrouchCells = new Set(["10,10","10,9","10,11","9,10","11,10","19,13","13,19","7,17","1,15","17,7","9,11","3,9","11,3","5,3","3,1","15,1","5,17","10,1","10,19"]);
            const crouchCandidates = [];
            for(let r=1;r<mazeGrid.length-1;r++) for(let c=1;c<mazeGrid[r].length-1;c++) {
                if(mazeGrid[r][c]!==1 || protectedCrouchCells.has(`${c},${r}`)) continue;
                // Keep cells away from the central terminal, entrance, and exit route.
                if(Math.abs(c-10)<=1 && Math.abs(r-10)<=1) continue;
                if(r<=2 && c>=8 && c<=12) continue;
                if(r>=18 && c>=8 && c<=12) continue;
                let nearProp = false;
                for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
                    if (mazeGrid[r+dr]?.[c+dc] === 2) nearProp = true;
                }
                if (nearProp) continue;
                crouchCandidates.push({c,r});
            }
            for(let i=crouchCandidates.length-1;i>0;i--){const j=(i*19+7)%(i+1);[crouchCandidates[i],crouchCandidates[j]]=[crouchCandidates[j],crouchCandidates[i]];}
            for (const candidate of crouchCandidates) {
                if (crouchableCells.size >= 50) break;
                let separated = true;
                for (const key of crouchableCells) {
                    const parts = key.split(',').map(Number);
                    if (Math.max(Math.abs(candidate.c-parts[0]),Math.abs(candidate.r-parts[1])) <= 1) { separated = false; break; }
                }
                if (separated) crouchableCells.add(`${candidate.c},${candidate.r}`);
            }
            const wallGeo = new THREE.BoxGeometry(cellSize, hedgeHeight, cellSize);
            const lockerBodyMat=new THREE.MeshStandardMaterial({color:0x243b31,metalness:0.55,roughness:0.38}),lockerDoorMat=new THREE.MeshStandardMaterial({color:0x344b40,metalness:0.62,roughness:0.34}),lockerDarkMat=new THREE.MeshStandardMaterial({color:0x080d0b,roughness:0.98}),lockerTrimMat=new THREE.MeshStandardMaterial({color:0x111a16,metalness:0.65,roughness:0.32}),lockerHandleMat=new THREE.MeshStandardMaterial({color:0x9aa39b,metalness:0.82,roughness:0.24});
            function makeLocker(){
                const g=new THREE.Group();
                // Enclosed cabinet: back, top, bottom and side walls make the interior feel like a real locker.
                const back=new THREE.Mesh(new THREE.BoxGeometry(0.94,2.48,0.07),lockerBodyMat);back.position.set(0,0,-0.265);g.add(back);
                for(const side of [-1,1]){const wall=new THREE.Mesh(new THREE.BoxGeometry(0.075,2.48,0.56),lockerBodyMat);wall.position.set(side*0.47,0,0);g.add(wall);}
                const top=new THREE.Mesh(new THREE.BoxGeometry(0.98,0.075,0.58),lockerBodyMat);top.position.y=1.28;g.add(top);
                const bottom=new THREE.Mesh(new THREE.BoxGeometry(0.98,0.075,0.58),lockerBodyMat);bottom.position.y=-1.28;g.add(bottom);
                const inner=new THREE.Mesh(new THREE.BoxGeometry(0.83,2.32,0.018),lockerDarkMat);inner.position.set(0,0,-0.218);g.add(inner);
                // True viewing slots: the door is built from separated bars, leaving open gaps.
                // The player can see the room through these gaps while hidden.
                const doorZ=0.305, doorDepth=0.045, doorWidth=0.84;
                for(const side of [-1,1]){
                    const rail=new THREE.Mesh(new THREE.BoxGeometry(0.17,2.38,doorDepth),lockerDoorMat);
                    rail.position.set(side*0.335,0.01,doorZ);g.add(rail);
                }
                for(let i=0;i<7;i++){
                    const bar=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.19,doorDepth),lockerDoorMat);
                    bar.position.set(-0.02,-1.08+i*0.36,doorZ);g.add(bar);

                    const y=-0.90+i*0.36;
                    const lip=new THREE.Mesh(new THREE.BoxGeometry(0.53,0.025,0.018),lockerTrimMat);
                    lip.position.set(-0.02,y,doorZ+0.03);g.add(lip);

                for(const side of [-1,1]){const seam=new THREE.Mesh(new THREE.BoxGeometry(0.045,2.46,0.08),lockerTrimMat);seam.position.set(side*0.45,0,0.35);g.add(seam);const hinge=new THREE.Mesh(new THREE.BoxGeometry(0.055,0.22,0.09),lockerTrimMat);hinge.position.set(side*0.39,0.72,0.385);g.add(hinge);const h2=hinge.clone();h2.position.y=-0.72;g.add(h2);}

            trailPoints.forEach(t => scene.remove(t));
            guideArrows = []; trailPoints = []; keyArrowTimer = null;
            if (!foundKeyPosition) return;

            // The arrow remains at the collected key's location, not above the player.
            const remaining = keys.filter(k => !k.collected);
            if (!remaining.length) return;
            const origin = foundKeyPosition.clone();
            let target = remaining[0], bestDistance = Infinity;
            for (const candidate of remaining) {
                const d = origin.distanceTo(candidate.mesh.position);
                if (d < bestDistance) { bestDistance = d; target = candidate; }
            }
            const direction = new THREE.Vector3(target.mesh.position.x-origin.x,0,target.mesh.position.z-origin.z);
            if (direction.lengthSq() < 0.001) return;
            direction.normalize();

            // Single-color luminous triangular pyramid, pointing horizontally at the nearest remaining key.
            const arrow = new THREE.Mesh(
                new THREE.ConeGeometry(0.34,0.95,3),
                new THREE.MeshBasicMaterial({color:0x39f6ff,side:THREE.DoubleSide})
            );
            arrow.position.set(origin.x,1.8,origin.z);
            arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction);
            arrow.userData.keyArrow = true;
            scene.add(arrow); guideArrows.push(arrow);

            const halo = new THREE.Mesh(new THREE.RingGeometry(0.32,0.43,24),
                new THREE.MeshBasicMaterial({color:0x39f6ff,side:THREE.DoubleSide}));
            halo.position.set(origin.x,0.06,origin.z); halo.rotation.x=-Math.PI/2;
            scene.add(halo); trailPoints.push(halo);

            keyArrowTimer = setTimeout(() => {
                guideArrows.forEach(a=>scene.remove(a));
                trailPoints.forEach(t=>scene.remove(t));
                guideArrows=[]; trailPoints=[]; keyArrowTimer=null;
            },15000);
        }

                new THREE.Vector3(newPosition.x + radius, isCrouching ? crouchHeight : 2.0, newPosition.z + radius)
            );
            for (let i = 0; i < wallBoxes.length; i++) {
                if (playerBox.intersectsBox(wallBoxes[i])) return true;
            }
            for (const lockerBox of lockerBoxes) { if (playerBox.intersectsBox(lockerBox)) return true; }
            for (const terminalBox of terminalCollisionBoxes) { if(playerBox.intersectsBox(terminalBox)) return true; }
            for (const obstacle of chaseBreakables) { if(obstacle&&obstacle.parent&&Math.abs(newPosition.x-obstacle.position.x)<1.0+radius&&Math.abs(newPosition.z-obstacle.position.z)<1.0+radius)return true; }

                hidingLocker = currentLocker;
                preHideYaw = rotation.yaw;

                    phantasm.visible = false;
                    phantasm.position.set(-999, -999, -999);

                    new THREE.Vector3(0, 1, 0), locker ? locker.rotation.y : 0

                const base = locker ? locker.position.clone() : camera.position.clone();
                let targetExitPos = base.add(doorOut.multiplyScalar(1.35));

                    targetExitPos.copy(locker.position).add(doorOut.multiplyScalar(2.1));

        }

        function setupTouchControls() {
            moveZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                moveTouchId = touch.identifier;
                moveStart = { x: touch.clientX, y: touch.clientY };

                joystickBase.style.left = `${moveStart.x}px`;
                joystickBase.style.top = `${moveStart.y}px`;
                joystickStick.style.transform = `translate(0px, 0px)`;
                joystickBase.style.display = 'block';
            }, { passive: false });

            moveZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === moveTouchId) {
                        let dx = touch.clientX - moveStart.x;
                        let dy = touch.clientY - moveStart.y;
                        let dist = Math.hypot(dx, dy);
                        let maxDist = 40;

                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }

                        joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
                        moveVector.x = dx / maxDist;
                        moveVector.z = dy / maxDist;
                    }
                }
            }, { passive: false });

            const stopMove = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === moveTouchId) {
                        moveTouchId = null;
                        moveVector.x = 0; moveVector.z = 0;
                        joystickStick.style.transform = `translate(0px, 0px)`;
                        joystickBase.style.display = 'none';
                    }
                }
            };

            moveZone.addEventListener('touchend', stopMove);
            moveZone.addEventListener('touchcancel', stopMove);

            lookZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lookLast = { x: touch.clientX, y: touch.clientY };
            }, { passive: false });

            lookZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    let touch = e.changedTouches[i];
                    if (touch.identifier === lookTouchId) {
                        let dx = touch.clientX - lookLast.x;
                        let dy = touch.clientY - lookLast.y;

                        rotation.yaw -= dx * 0.005;
                        rotation.pitch -= dy * 0.005;
                        rotation.pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, rotation.pitch));

                        lookLast = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            const stopLook = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookTouchId) lookTouchId = null;
                }
            };

            lookZone.addEventListener('touchend', stopLook);
            lookZone.addEventListener('touchcancel', stopLook);
        }

 function renderInventory(){inv.innerHTML='';Object.entries(inventory).forEach(([name,count],i)=>{const b=document.createElement('button');b.innerHTML='<small style="display:block;color:#ffe28a">'+(i+1)+'</small>'+name+'<br><b>×'+count+'</b>';b.style.cssText='min-width:65px;min-height:52px;background:#050805dd;color:white;border:1px solid #ffffff88;border-radius:7px;font:11px monospace;touch-action:manipulation';const useSlot=()=>{if(name==='medkit'&&count>0&&health<maxHealth){health=Math.min(maxHealth,health+40);inventory.medkit--}else if(name==='battery'&&count>0&&battery<100){battery=Math.min(100,battery+50);inventory.battery--}else if(name==='adrenaline'&&count>0){adrenalineTimer=8;inventory.adrenaline--}renderInventory()};let lastInventoryTouch=0;b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();lastInventoryTouch=Date.now();useSlot()},{passive:false});b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(Date.now()-lastInventoryTouch<700)return;useSlot()});inv.appendChild(b)})}
 const _mosRenderOnPickup=collectItem;collectItem=function(item){const result=_mosRenderOnPickup(item);renderInventory();return result};
 renderInventory();
 window.addEventListener('keydown',e=>{if(/^Digit[1-9]$/.test(e.code)){const i=Number(e.code.slice(5))-1;const name=Object.keys(inventory)[i];if(!name)return;const count=inventory[name];if(count<=0)return;if(name==='medkit'&&health<maxHealth){health=Math.min(maxHealth,health+40);inventory[name]--}else if(name==='battery'&&battery<100){battery=Math.min(100,battery+50);inventory[name]--}else if(name==='adrenaline'){adrenalineTimer=8;inventory[name]--}renderInventory()}});
 const loadSlot=new URLSearchParams(location.search).get('loadSlot');if(loadSlot){window.addEventListener('load',()=>setTimeout(()=>{const s=read('mosSaveSlotsV1',[])[Number(loadSlot)-1];if(s&&s.chapter===2&&s.state){const d=s.state;health=d.health??health;battery=d.battery??battery;stamina=d.stamina??stamina;if(d.inventory&&typeof d.inventory==='object')Object.assign(inventory,d.inventory);if(d.sourceChapter===2){keysFound=d.keysFound??0;if(d.player){camera.position.set(d.player.x,1.6,d.player.z);rotation.yaw=d.player.yaw;rotation.pitch=d.player.pitch}if(d.keyStates)d.keyStates.forEach((v,i)=>{if(keys[i]){keys[i].collected=!!v;if(v)scene.remove(keys[i].mesh)}});if(d.itemStates)d.itemStates.forEach((v,i)=>{if(items[i]){items[i].collected=!!v;if(v)scene.remove(items[i].mesh)}});gateUnlocked=!!d.gateUnlocked;}else{keysFound=0;gateUnlocked=false;}document.getElementById('key-tracker').innerText='FUEL CANISTERS: '+keysFound+' / 9';if(keysFound>=totalKeys)document.getElementById('status-msg').innerText='ALL 9 CANISTERS COLLECTED. GO TO THE COMPUTER!';renderInventory()}},100))}
 window.addEventListener('message',event=>{const msg=event.data;if(!msg||msg.type!=='MOS_LOAD_SLOT')return;const s=read('mosSaveSlotsV1',[])[Number(msg.slot)-1];if(!s||s.chapter!==2||!s.state)return;const d=s.state;health=d.health??health;battery=d.battery??battery;stamina=d.stamina??stamina;if(d.inventory&&typeof d.inventory==='object')Object.assign(inventory,d.inventory);if(d.sourceChapter===2){keysFound=d.keysFound??0;if(d.player){camera.position.set(d.player.x,1.6,d.player.z);rotation.yaw=d.player.yaw;rotation.pitch=d.player.pitch}if(d.keyStates)d.keyStates.forEach((v,i)=>{if(keys[i]){keys[i].collected=!!v;if(v)scene.remove(keys[i].mesh)}});if(d.itemStates)d.itemStates.forEach((v,i)=>{if(items[i]){items[i].collected=!!v;if(v)scene.remove(items[i].mesh)}});gateUnlocked=!!d.gateUnlocked;}else{keysFound=0;gateUnlocked=false;}document.getElementById('key-tracker').innerText='FUEL CANISTERS: '+keysFound+' / 9';renderInventory()});
 const observer=setInterval(()=>{const panel=document.getElementById('game-over'),title=document.getElementById('status-text'),inv=document.getElementById('mos-roblox-inventory');if(panel&&panel.style.display==='flex'){if(inv)inv.style.display='none';if(title&&/ESCAPED/i.test(title.textContent))campaignWin()}else if(inv)inv.style.display='flex'},250);
 window.addEventListener('beforeunload',()=>clearInterval(observer));
})();
