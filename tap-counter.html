<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tap Lab ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.tool{max-width:720px;margin:auto}.panel{padding:22px;background:#ffffff08;border:1px solid #ffffff18;border-radius:24px}.out{padding:20px;border-radius:18px;background:#0b0b16;border:1px solid #ffffff12;font:700 20px "DM Mono";text-align:center;word-break:break-word;min-height:70px;display:grid;place-items:center}.btn{border:0;border-radius:13px;padding:13px 18px;background:#f7f4ff;color:#11111f;font-weight:800;cursor:pointer;margin:5px}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.input{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;font-size:16px;margin-bottom:10px}.hint{text-align:center;color:#aaa7c1;margin:12px}.pop{animation:pop .18s}@keyframes pop{50%{transform:scale(1.05)}}</style></head><body><div class="w"><nav class="hp-page-nav"><a class="logo" href="index.html">✦ Hyper-Pop</a><div id="account-slot"></div></nav><header class="hero"><div class="e">👆</div><h1>Tap Lab</h1><p>How fast can you tap? Chase a ridiculous tapping streak.</p></header><main class="box tool"><div class="panel"><div class="out" id="out">0 taps</div><div class="row"><button class="btn" id="tap" style="font-size:28px;padding:28px 50px">TAP!</button></div><div class="hint" id="rate">0 taps/sec</div><button class="btn" id="reset">RESET</button></div></main></div><script src="app.js"></script><script>let n=0,start=0,audio;const $=id=>document.getElementById(id);function s(f=500,d=.04){try{audio=audio||new AudioContext();let o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=f;g.gain.value=.035;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}$("tap").onclick=()=>{if(!start)start=performance.now();n++;let sec=(performance.now()-start)/1000;$("out").textContent=n+" taps";$("rate").textContent=(n/Math.max(sec,.01)).toFixed(1)+" taps/sec";s(350+Math.min(n,40)*12);$("tap").classList.add("pop");setTimeout(()=>$("tap").classList.remove("pop"),100)};$("reset").onclick=()=>{n=0;start=0;$("out").textContent="0 taps";$("rate").textContent="0 taps/sec";s(220,.08)}</script></body></html>
