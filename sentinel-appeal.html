<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b16"><title>Sentinel Appeal ✦ Hyper-Pop</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;background:#090b14;color:#f7f4ff;font-family:system-ui}.card{width:min(520px,100%);box-sizing:border-box;padding:26px;border:1px solid #ffffff20;border-radius:22px;background:#121827}.card h1{color:#ff7781}.muted{color:#a3aec1;font-size:14px;line-height:1.55}label{display:block;margin:16px 0 6px;color:#b6c0d1;font-size:13px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ffffff28;border-radius:10px;background:#090e19;color:white;font:inherit}button{margin-top:14px;padding:12px 18px;border:0;border-radius:10px;background:#ff6470;color:#190b0e;font-weight:800}#msg{margin-top:12px;white-space:pre-wrap;color:#9ce7c1}</style></head><body><main class="card"><a href="/" style="color:#fff">← Hyper-Pop</a><h1>Sentinel appeal</h1><p class="muted">If you believe a Hyper-Pop restriction was issued incorrectly, send a review request. An administrator will review it.</p><label for="ban">Ban reference</label><input id="ban" placeholder="Ban UUID"><label for="message">Why should this ban be reviewed?</label><textarea id="message" rows="6" maxlength="2000" placeholder="Write at least 10 characters"></textarea><button id="send">Submit appeal</button><div id="msg"></div></main><script src="/sentinel-appeal.js?v=1"></script></body></html>
