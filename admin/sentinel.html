<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b16"><title>Sentinel Admin ✦ Hyper-Pop</title><link rel="stylesheet" href="../style.css"><style>:root{color-scheme:dark}body{background:#090b14;color:#f7f4ff;font-family:system-ui}.sentinel-wrap{max-width:1100px;margin:auto;padding:24px 16px 80px}.sentinel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.sentinel-head h1{font-size:clamp(30px,7vw,52px);color:#ff6672;margin:20px 0}.sentinel-muted{color:#9ca8bd;font-size:13px}.sentinel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.sentinel-panel{background:#121827;border:1px solid #ffffff18;border-radius:18px;padding:18px;margin:14px 0}.sentinel-panel h2{font-size:18px}.sentinel-stat{font-size:30px;font-weight:800}.sentinel-row{display:flex;gap:12px;flex-wrap:wrap}.sentinel-row>*{flex:1;min-width:180px}.sentinel-field{display:grid;gap:6px;margin:12px 0}.sentinel-field label{font-size:12px;color:#aeb9cc}.sentinel-field input,.sentinel-field select,.sentinel-field textarea{width:100%;background:#090e19;color:#fff;border:1px solid #ffffff25;border-radius:10px;padding:12px;font:inherit}.sentinel-btn{border:0;border-radius:10px;padding:11px 15px;background:#ff6470;color:#180a0d;font-weight:800}.sentinel-btn.secondary{background:#263349;color:#eaf1ff}.sentinel-tabs{display:flex;gap:8px;flex-wrap:wrap}.sentinel-tabs button{background:#1a2333;color:#dce6f7;border:1px solid #ffffff1c;border-radius:9px;padding:9px 12px}.sentinel-hidden{display:none!important}.sentinel-scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td{padding:10px;border-bottom:1px solid #ffffff14;vertical-align:top}small{color:#9ca8bd}.sentinel-msg{white-space:pre-wrap;color:#9ce7c1}@media(max-width:600px){table{min-width:650px}}</style></head><body><div class="sentinel-wrap"><nav><a href="../index.html">← Hyper-Pop</a><span style="color:#ff7580;font:12px monospace">SENTINEL / ADMIN</span></nav><header class="sentinel-head"><div><h1>🛡️ Sentinel</h1><p class="sentinel-muted">Device security &amp; enforcement control center</p></div><button class="sentinel-btn secondary" id="refresh">↻ Refresh</button></header><div id="status" class="sentinel-msg">Checking administrator access…</div><section class="sentinel-grid"><div class="sentinel-panel"><div class="sentinel-muted">Registered devices</div><div class="sentinel-stat" id="device-count">—</div></div><div class="sentinel-panel"><div class="sentinel-muted">Active bans</div><div class="sentinel-stat" id="ban-count">—</div></div><div class="sentinel-panel"><div class="sentinel-muted">Pending appeals</div><div class="sentinel-stat" id="appeal-count">—</div></div></section><section class="sentinel-panel"><h2>Issue enforcement</h2><div class="sentinel-row"><div class="sentinel-field"><label>Ban scope</label><select id="scope"><option value="account">Account only</option><option value="device">Device only</option><option value="network">Network only</option><option value="account_device">Account + associated devices</option><option value="full">Full enforcement (account + associated devices + known IPs)</option></select></div><div class="sentinel-field"><label>Duration</label><select id="duration"><option value="1day">24 hours</option><option value="7days">7 days</option><option value="30days">30 days</option><option value="90days">90 days</option><option value="permanent" selected>Permanent</option></select></div></div><div class="sentinel-row"><div class="sentinel-field" id="username-wrap"><label>Target username</label><input id="username" maxlength="20" placeholder="Hyper-Pop username"></div><div class="sentinel-field sentinel-hidden" id="device-wrap"><label>Registered device key</label><input id="target-device" placeholder="Device UUID"></div><div class="sentinel-field sentinel-hidden" id="ip-wrap"><label>Network IP</label><input id="target-ip" placeholder="IPv4 or IPv6"></div></div><div class="sentinel-field"><label>Reason</label><textarea id="reason" rows="3" maxlength="500" placeholder="Reason shown to the user"></textarea></div><button class="sentinel-btn" id="issue">Issue ban</button><p id="issue-msg" class="sentinel-msg"></p></section><section class="sentinel-panel"><div class="sentinel-tabs"><button data-tab="bans">Bans</button><button data-tab="devices">Devices</button><button data-tab="appeals">Appeals</button><button data-tab="events">Audit log</button></div><div id="table-area" class="sentinel-scroll">Loading…</div></section><section class="sentinel-panel" id="appeal"><h2>Submit an appeal</h2><p class="sentinel-muted">Appeals require a ban reference and a signed-in account when available.</p><div class="sentinel-field"><label>Ban reference</label><input id="appeal-ban" placeholder="Ban UUID"></div><div class="sentinel-field"><label>Message</label><textarea id="appeal-message" rows="4" maxlength="2000"></textarea></div><button class="sentinel-btn secondary" id="submit-appeal">Submit appeal</button><p id="appeal-msg" class="sentinel-msg"></p></section></div><script src="../app.js?v=sentinel-1"></script><script src="../sentinel-admin.js?v=sentinel-1"></script></body></html>
