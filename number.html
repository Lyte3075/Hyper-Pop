<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Number Sprint ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"></head><body><div class="w"><nav class="hp-page-nav"><a class="logo" href="index.html">✦ Hyper-Pop</a><div id="account-slot"></div></nav><header class="hero"><div class="e">🔢</div><h1>Number Sprint</h1><p>Type the numbers 1 through 20 as fast as you can.</p></header><main class="box" style="text-align:center"><div class="big" id="n">1</div><input id="i" inputmode="numeric" style="padding:13px;border-radius:12px;border:1px solid var(--line);background:#ffffff08;color:#fff;text-align:center" placeholder="type number"><button class="btn" id="s">START</button><div class="result" id="r"></div></main></div><script src="app.js"></script><script>let next=1,t0=0;s.onclick=()=>{next=1;t0=performance.now();n.textContent=1;i.value='';i.focus();r.textContent=''};i.oninput=()=>{if(+i.value===next){next++;i.value='';n.textContent=next>20?'DONE':next;if(next>20){let score=Math.round(performance.now()-t0);r.textContent=score+' ms';hpSubmit('number',score)}}};</script></body></html>
