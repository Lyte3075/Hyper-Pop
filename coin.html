<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0b16"><title>Coin Flip ✦ Hyper-Pop</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{touch-action:manipulation;-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,var(--c)33,transparent 35%),#0b0b16;color:#f7f4ff;font:16px system-ui,sans-serif}button{font:inherit;touch-action:manipulation;cursor:pointer}.w{max-width:850px;margin:auto;padding:0 18px}nav{height:72px;display:flex;justify-content:space-between;align-items:center}.back{color:#aaa7c1}.logo{font-weight:800}.hero{text-align:center;padding:55px 0 30px}.hero .e{font-size:60px}.hero h1{font-size:clamp(42px,9vw,76px);letter-spacing:-.06em;margin:12px 0}.hero p{color:#aaa7c1}.box{margin:15px 0 60px;padding:25px;border:1px solid #ffffff18;background:#151526;border-radius:24px;box-shadow:0 25px 70px #0008}.big{font:500 55px monospace;text-align:center;margin:20px 0;perspective:600px}.coin{font-size:76px;display:inline-block;transform-style:preserve-3d}.coin.flip{animation:coinFlip 1.15s cubic-bezier(.2,.7,.2,1)}@keyframes coinFlip{0%{transform:rotateY(0) scale(1)}25%{transform:rotateY(540deg) scale(1.15) translateY(-12px)}55%{transform:rotateY(1080deg) scale(1.08) translateY(-22px)}100%{transform:rotateY(1800deg) scale(1) translateY(0)}}#f:disabled{opacity:.55;cursor:wait}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{padding:12px 16px;border-radius:12px;border:1px solid #ffffff18;background:#fff;color:#111;font-weight:800}.result{text-align:center;color:var(--c);font-weight:700;margin-top:14px}.foot{text-align:center;color:#66647a;font:11px monospace;padding-bottom:35px}</style><link rel="stylesheet" href="style.css"></head><body style="--c:#4be0e3"><div class="w"><nav class="hp-page-nav"><span class=
