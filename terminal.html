<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Hyper-Pop Terminal</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#f2f2f2;--muted:#858585;--red:#ff5555;--yellow:#ffd84d;--green:#54e38e;--cmd:#69cfff;--line:#242424}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg)}

.brand{font-weight:700;letter-spacing:.02em}.brand span{color:var(--green)}
#state{font-size:11px;color:var(--muted)}#state.good{color:var(--green)}#state.bad{color:var(--red)}#state.warn{color:var(--yellow)}

#tools{display:flex;gap:6px}

#editorTitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--green)}
#editorStatus{color:var(--muted);font-size:12px;white-space:nowrap}
#editorBody{display:flex;flex:1;min-height:0;min-width:0;overflow:hidden;background:#000}
#editorGutter{flex:0 0 auto;min-width:3.5em;height:100%;min-height:0;margin:0;padding:14px 9px;text-align:right;overflow:hidden;border-right:1px solid var(--line);background:#080808;color:#666;font:16pt/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre;user-select:none;-webkit-user-select:none}

#editorStatus.success{color:var(--green)}#editorStatus.error{color:var(--red)}#editorStatus.modified{color:var(--yellow)}

#editorToolbar button{padding:8px 12px}

@media(max-width:520px){body{font-size:13px}header{height:42px;flex-basis:42px}#screen{padding:12px}#tools button{padding:5px 7px}#editorHeader{min-height:44px}#editorText{padding:12px;font-size:16pt}#editorToolbar{padding:8px}#editorToolbar small{display:none}}
</style>

<body>
<div id="app">
<header><div class="brand"><span>HP</span> / TERMINAL <span style="color:var(--muted);font-weight:400">v0.4</span></div><div id="state" class="warn">INITIALIZING…</div></header>

async function openEditor(path){

async function saveEditor(){
 if(!editorPath) return;

 try{
  await writeFile(editorPath,editorText.value,false);
  editorOriginal=editorText.value;
  editorSaveButton.textContent='Saved ✓';

}
async function closeEditor(){

  if(!confirm('Save your changes before exiting nano? Select Cancel to keep editing.')){editorStatus.textContent='EXIT CANCELLED · CHANGES KEPT';editorStatus.className='modified';return}

function formatSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(2)+' MB';return (n/1073741824).toFixed(2)+' GB'}

async function countBytes(parts){const d=await directory(parts,false);let total=0;for await(const [name,h] of d.entries()){if(h.kind==='directory')total+=await countBytes(parts.concat(name));else total+=(await h.getFile()).size}return total}

// JavaScript and Python runtimes
let pyodidePromise=null;
const AsyncFunction=Object.getPrototypeOf(async function(){}).constructor;
function terminalInput(promptText=''){

  if(terminalInputResolver)throw Error('Terminal input is already being requested.');
  if(promptText)line(promptText,'dim');
  terminalInputResolver=resolve;
  cwdLabel.textContent='input';
  document.querySelector('.prompt').textContent='>';
  input.placeholder='type your answer and press enter';
  status('WAITING FOR INPUT','warn');
  input.focus();
 });
}
function finishTerminalInput(){
 terminalInputResolver=null;
 document.querySelector('.prompt').textContent='$';
 input.placeholder='type help and press enter';
 updatePrompt();
 status('OPFS READY','good');
}
async function executeJavaScript(source,label){
 let outputCount=0;
 const print=(...values)=>{const value=values.map(v=>typeof v==='string'?v:JSON.stringify(v)).join(' ');outputCount++;line(value)};
 try{
  const terminalConsole={log:(...v)=>print(...v),info:(...v)=>print(...v),warn:(...v)=>print(...v),error:(...v)=>print(...v),clear:()=>{}};
  const runner=new AsyncFunction('print','args','console','input','"use strict";\n'+source);
  const result=await runner(print,[],terminalConsole,terminalInput);
  if(result!==undefined)print(result);
  line((label||'JavaScript')+' completed'+(outputCount?'':' (no output).'),'ok');
 }catch(e){line('JavaScript error: '+e.message,'err')}
}
async function loadPyodideRuntime(){
 if(pyodidePromise)return pyodidePromise;
 pyodidePromise=(async()=>{
  const versions=['314.0.8','0.29.5','0.27.7'];
  let lastError=null;
  for(const version of versions){
   const base='https://cdn.jsdelivr.net/pyodide/v'+version+'/full/';
   try{
    if(!window.loadPyodide){
     await new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src=base+'pyodide.js';
      script.onload=()=>resolve();
      script.onerror=()=>reject(Error('Could not download '+script.src+' (network, content blocker, or CDN error).'));
      document.head.appendChild(script);
     });
    }
    const py=await window.loadPyodide({indexURL:base});
    return py;
   }catch(e){lastError=e;window.loadPyodide=undefined;}
  }
  throw Error('All Pyodide CDN versions failed. Last error: '+(lastError?.message||String(lastError)));
 })();
 try{return await pyodidePromise}catch(e){pyodidePromise=null;throw e}
}
async function executePython(source,label){
 line('Loading Python WebAssembly runtime…','dim');
 try{
  const py=await loadPyodideRuntime();
  py.setStdout({batched:x=>line(x)});
  py.setStderr({batched:x=>line(x,'err')});
  py.globals.set('terminal_input',async promptText=>await terminalInput(String(promptText||'')));

}

case 'db':{const sub=args[0];if(sub==='help'||!sub){line('Local OPFS document database commands:');line('  db collections');line('  db create <collection>');line('  db insert <collection> <json>');line('  db find <collection> [json-filter]');line('  db delete <collection> <json-filter>');line("Node API: const db=await require(\"database\"); const users=db.collection(\"users\");");line("Remote REST: await db.connect(\"https://api.example\",{headers:{Authorization:\"Bearer TOKEN\"}}); await db.request(\"/records\");")}else if(sub==='collections'){const names=await browserDatabase.collections();line(names.length?names.join('\\n'):'(no collections)','ok')}else if(sub==='create'){if(!args[1])throw Error('Usage: db create <collection>');await browserDatabase.collection(args[1]).create();line('Created '+args[1],'ok')}else if(sub==='insert'){if(!args[1]||!args[2])throw Error('Usage: db insert <collection> <json>');const result=await browserDatabase.collection(args[1]).insertOne(JSON.parse(args.slice(2).join(' ')));line('Inserted document '+result.insertedId,'ok')}else if(sub==='find'){if(!args[1])throw Error('Usage: db find <collection> [json-filter]');line(JSON.stringify(await browserDatabase.collection(args[1]).find(args[2]?JSON.parse(args.slice(2).join(' ')):{}),null,2),'ok')}else if(sub==='delete'){if(!args[1]||!args[2])throw Error('Usage: db delete <collection> <json-filter>');const result=await browserDatabase.collection(args[1]).deleteMany(JSON.parse(args.slice(2).join(' ')));line('Deleted '+result.deletedCount+' document(s)','ok')}else throw Error('Try db help.');break}
 case 'version':line('Hyper-Pop Terminal 0.4 / HP-SH + JavaScript + Python WebAssembly','ok');break;
case 'about':line('A browser-local command environment. Files live in this site origin’s OPFS storage.');line('Network requests can use the authenticated Hyper-Pop CORS proxy or your account-owned Reverse Proxy routes.','dim');
line('JavaScript runs in the page runtime. Python runs in Pyodide/WebAssembly (downloaded on first use).','dim');
line('Node commands use a browser-side Node compatibility layer, not native Node.js. npm packages must support browsers. Git commands connect to public GitHub repositories; this is not a full Git object database and local commits/pushes are not implemented.','dim');break;
case 'reset':screen.textContent='';line('Terminal display reset. Files were not changed.','ok');break;
case 'exit':location.href='index.html';break;
default:line('Command not found: '+cmd+'. Type help.','err');
}
}catch(e){line('ERROR: '+(e&&e.message?e.message:String(e)),'err')}
}
async function init(){try{if(!navigator.storage||!navigator.storage.getDirectory)throw Error('This browser does not support OPFS. Try an up-to-date Safari or another modern browser.');root=await navigator.storage.getDirectory();await directory(HOME,true);await loadNodePackages();status('OPFS READY','good');line('Hyper-Pop Terminal [HP-SH 0.4]','ok');line('Persistent browser-local filesystem initialized.','dim');line('Authenticated Hyper-Pop proxy networking is available. No access to private device files.','dim');line('Type help to see available commands.','');line('');updatePrompt()}catch(e){status('FILESYSTEM UNAVAILABLE','bad');line('Could not initialize browser storage: '+e.message,'err');line('This terminal requires a secure HTTPS page and browser OPFS support.','warn')}}
form.addEventListener('submit',async e=>{e.preventDefault();const raw=input.value;input.value='';if(terminalInputResolver){line('> '+raw,'cmd');const resolve=terminalInputResolver;finishTerminalInput(raw);resolve(raw);return}if(raw.trim()){history.push(raw);historyIndex=history.length;await run(raw)}});
input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();historyIndex=Math.max(0,historyIndex-1);input.value=history[historyIndex]||''}else if(e.key==='ArrowDown'){e.preventDefault();historyIndex=Math.min(history.length,historyIndex+1);input.value=history[historyIndex]||''}});
document.getElementById('clear').addEventListener('click',()=>{screen.textContent='';input.focus()});
editorSaveButton.addEventListener('click',async()=>{try{await saveEditor()}catch(e){line('ERROR: '+e.message,'err')}});
document.getElementById('editorExit').addEventListener('click',closeEditor);
editorText.addEventListener('input',()=>{updateLineNumbers();updateEditorStatus();});
editorText.addEventListener('scroll',()=>{editorGutter.scrollTop=editorText.scrollTop});
editorText.addEventListener('keydown',async e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){e.preventDefault();try{await saveEditor()}catch(err){line('ERROR: '+err.message,'err')}}
 else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'){e.preventDefault();await closeEditor()}
 else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='w'){e.preventDefault();const term=prompt('Search for:');if(term){const at=editorText.value.indexOf(term,editorText.selectionEnd);if(at>=0){editorText.focus();editorText.setSelectionRange(at,at+term.length)}else editorStatus.textContent='NOT FOUND'}}
});
screen.addEventListener('click',()=>input.focus());
init();
})();
