<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Hyper-Pop Terminal</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#f2f2f2;--muted:#858585;--red:#ff5555;--yellow:#ffd84d;--green:#54e38e;--line:#242424}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg)}
body{font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;overflow:hidden}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.02em}.brand span{color:var(--green)}
#state{font-size:11px;color:var(--muted)}#state.good{color:var(--green)}#state.bad{color:var(--red)}#state.warn{color:var(--yellow)}
#screen{flex:1;min-height:0;overflow:auto;padding:14px 15px 22px;overscroll-behavior:contain;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-color:#444 #000}
.line{min-height:1.55em}.dim{color:var(--muted)}.ok{color:var(--green)}.warn{color:var(--yellow)}.err{color:var(--red)}.prompt{color:var(--green)}.cmd{color:var(--fg)}
form{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#000}
#cwd{color:var(--green);max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;caret-color:var(--green);padding:4px 0}
#input::placeholder{color:#555}
button{font:inherit;color:var(--fg);background:#101010;border:1px solid #333;border-radius:5px;padding:5px 9px}
#tools{display:flex;gap:6px}
@media(max-width:520px){body{font-size:13px}header{height:42px;flex-basis:42px}#screen{padding:12px}#tools button{padding:5px 7px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand"><span>HP</span> / TERMINAL <span style="color:var(--muted);font-weight:400">v0.2</span></div><div id="state" class="warn">INITIALIZING…</div></header>
<main id="screen" role="log" aria-live="polite" aria-label="Terminal output"></main>
<form id="form" autocomplete="off">
<span id="cwd">~</span><span class="prompt">$</span>
<input id="input" aria-label="Terminal command" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type help and press enter">
<div id="tools"><button id="clear" type="button" title="Clear output">CLR</button></div>
</form>
</div>
<script>
(function(){
'use strict';
const screen=document.getElementById('screen'),form=document.getElementById('form'),input=document.getElementById('input'),cwdLabel=document.getElementById('cwd'),state=document.getElementById('state');
let root=null,cwd=['home','guest'],history=[],historyIndex=0;const envVars={HOME:'/home/guest',USER:'guest',SHELL:'/bin/hp-sh',TERM:'xterm-hp',PATH:'/bin:/usr/bin'};const startedAt=Date.now();
const HOME=['home','guest'];
function line(text='',kind=''){const el=document.createElement('div');el.className='line '+kind;el.textContent=String(text);screen.appendChild(el);screen.scrollTop=screen.scrollHeight}
function status(text,kind){state.textContent=text;state.className=kind||''}
function pathString(parts){return '/'+parts.join('/')}
function updatePrompt(){cwdLabel.textContent=cwd.length===2?'~':pathString(cwd)}
function tokenize(s){const out=[];let cur='',quote=null,escape=false;for(const ch of s){if(escape){cur+=ch;escape=false;continue}if(ch==='\\'&&quote!=="'"){escape=true;continue}if(quote){if(ch===quote)quote=null;else cur+=ch;continue}if(ch==='"'||ch==="'"){quote=ch;continue}if(/\s/.test(ch)){if(cur){out.push(cur);cur=''}}else cur+=ch}if(escape)cur+='\\';if(cur)out.push(cur);return out}
function resolve(path){if(!path||path==='~')return HOME.slice();let parts=path.startsWith('/')?[]:cwd.slice();for(const part of path.split('/')){if(!part||part==='.')continue;if(part==='..')parts.pop();else{if(part.includes('\0'))throw Error('Invalid path.');parts.push(part)}}return parts}
async function directory(parts,create){let d=root;for(const p of parts)d=await d.getDirectoryHandle(p,{create:!!create});return d}
async function parentAndName(parts){if(!parts.length)throw Error('Cannot modify the filesystem root.');return [await directory(parts.slice(0,-1),false),parts[parts.length-1]]}
async function readFile(parts){const [p,n]=await parentAndName(parts);const h=await p.getFileHandle(n);return await (await h.getFile()).text()}
async function writeFile(parts,data,append){const [p,n]=await parentAndName(parts);const h=await p.getFileHandle(n,{create:true});const w=await h.createWritable({keepExistingData:!!append});if(append){const f=await h.getFile();await w.seek(f.size)}else await w.truncate(0);await w.write(data);await w.close()}
async function list(parts){const d=await directory(parts,false),rows=[];for await(const [name,handle] of d.entries()){rows.push({name,dir:handle.kind==='directory'})}rows.sort((a,b)=>Number(b.dir)-Number(a.dir)||a.name.localeCompare(b.name));if(!rows.length)line('(empty)','dim');for(const x of rows)line((x.dir?'[DIR] ':'      ')+x.name,x.dir?'ok':'')}
function formatSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(2)+' MB';return (n/1073741824).toFixed(2)+' GB'}
async function entry(parts){const [p,n]=await parentAndName(parts);try{return {parent:p,name:n,handle:await p.getFileHandle(n)}}catch(e){return {parent:p,name:n,handle:await p.getDirectoryHandle(n)}}}
async function copyDirectory(from,to){const src=await directory(from,false),dst=await directory(to,true);for await(const [name,h] of src.entries()){if(h.kind==='directory')await copyDirectory(from.concat(name),to.concat(name));else{const file=await h.getFile(),target=await dst.getFileHandle(name,{create:true}),w=await target.createWritable();await w.write(await file.arrayBuffer());await w.close()}}}
async function countBytes(parts){const d=await directory(parts,false);let total=0;for await(const [name,h] of d.entries()){if(h.kind==='directory')total+=await countBytes(parts.concat(name));else total+=(await h.getFile()).size}return total}
function calc(expression){let s=expression.replace(/\s+/g,'');let i=0;function atom(){if(s[i]==='+'){i++;return atom()}if(s[i]==='-'){i++;return -atom()}if(s[i]==='('){i++;const v=add();if(s[i++]!==')')throw Error('Missing closing parenthesis.');return v}const m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/i);if(!m)throw Error('Invalid expression.');i+=m[0].length;return Number(m[0])}function power(){let v=atom();if(s[i]==='^'){i++;v=Math.pow(v,power())}return v}function mul(){let v=power();while(['*','/','%'].includes(s[i])){const op=s[i++],r=power();v=op==='*'?v*r:op==='/'?v/r:v%r}return v}function add(){let v=mul();while(s[i]==='+'||s[i]==='-'){const op=s[i++],r=mul();v=op==='+'?v+r:v-r}return v}const result=add();if(i!==s.length||!Number.isFinite(result))throw Error('Invalid or non-finite calculation.');return result}
function bytesToBase64(textValue){const bytes=new TextEncoder().encode(textValue);let binary='';bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary)}
function base64ToText(value){const binary=atob(value),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}

async function tree(parts,depth,prefix){if(depth>5)return;const d=await directory(parts,false),items=[];for await(const [name,h] of d.entries())items.push({name,dir:h.kind==='directory'});items.sort((a,b)=>Number(b.dir)-Number(a.dir)||a.name.localeCompare(b.name));for(let i=0;i<items.length;i++){const x=items[i],last=i===items.length-1;line(prefix+(last?'└── ':'├── ')+x.name+(x.dir?'/':''));if(x.dir)await tree(parts.concat(x.name),depth+1,prefix+(last?'    ':'│   '))}}
async function run(raw){const args=tokenize(raw),cmd=(args.shift()||'').toLowerCase(),arg=args[0];if(!cmd)return;
line((cwd.length===2?'~':pathString(cwd))+' $ '+raw,'cmd');
try{
switch(cmd){
case 'help':case '?':
line('HYPER-POP TERMINAL / HP-SH 0.2','ok');
line('Browser-local shell environment. Not a full Linux or iOS shell.','dim');
line('');
line('FILESYSTEM');
line('  pwd                         Show current directory');
line('  ls [path]                   List files and folders');
line('  cd [path]                   Change directory');
line('  mkdir <name>                Create a folder');
line('  touch <file>                Create an empty file');
line('  cat <file>                  Print a text file');
line('  write <file> <text>         Replace a file with text');
line('  append <file> <text>        Add text to a file');
line('  rm <file>                   Delete a file');
line('  rmdir <folder>              Delete an empty folder');
line('  tree [path]                 Show a directory tree');
line('  download <file>             Download a copy of a file');
line('  cp <source> <destination>   Copy a text file');
line('  mv <source> <destination>   Move or rename a text file');
line('  find [path] [name]          Find matching files and folders');
line('  stat <path>                 Show file or folder information');
line('  du [path]                   Show stored file size');
line('  head <file> [n]             Print first n lines');
line('  tail <file> [n]             Print last n lines');
line('  wc <file>                   Count lines, words and bytes');
line('  grep <text> <file>          Search lines in a text file');
line('  sort <file>                 Sort lines');
line('  uniq <file>                 Remove adjacent duplicate lines');
line('  rev <text>                  Reverse text');
line('  nl <file>                   Number lines');
line('  base64 <text>               Encode text as Base64');
line('  unbase64 <data>             Decode Base64 text');
line('  seq <end> or <start> <end>  Print a number sequence');
line('  calc <expression>           Calculate arithmetic');
line('  upload                      Import a file you select');
line('  open <https-url>            Open a web address');
line('  export [name=value]         List or set session variables');
line('  env                         List session variables');
line('  unset <name>                Remove a session variable');
line('  which <command>             Locate a built-in command');
line('  man <command>               Show command help');
line('  hostname, id, uptime, free  Show runtime information');
line('  version, about              Show terminal details');
line('');
line('SHELL');
line('  echo <text>                 Print text');
line('  clear                       Clear the screen');
line('  history                     Show command history');
line('  date                        Show local date and time');
line('  whoami                      Show local user');
line('  uname                       Show runtime information');
line('  storage                     Show OPFS availability');
line('  help                        Show this help');
line('  exit                        Return to Hyper-Pop');
line('');
line('TIP: Use quotes for names or text containing spaces.','dim');break;
case 'pwd':line(pathString(cwd),'ok');break;
case 'ls':await list(arg?resolve(arg):cwd);break;
case 'cd':{const next=resolve(arg||'~');await directory(next,false);cwd=next;updatePrompt();}break;
case 'mkdir':if(!arg)throw Error('Usage: mkdir <name>');await directory(resolve(arg),true);line('Created directory: '+arg,'ok');break;
case 'touch':if(!arg)throw Error('Usage: touch <file>');await writeFile(resolve(arg),'',true);line('Created file: '+arg,'ok');break;
case 'cat':if(!arg)throw Error('Usage: cat <file>');line(await readFile(resolve(arg)));break;
case 'write':if(!arg||args.length<2)throw Error('Usage: write <file> <text>');{const file=resolve(arg);await writeFile(file,args.slice(1).join(' '),false);line('Wrote '+arg,'ok')}break;
case 'append':if(!arg||args.length<2)throw Error('Usage: append <file> <text>');{const file=resolve(arg);await writeFile(file,args.slice(1).join(' '),true);line('Appended to '+arg,'ok')}break;
case 'rm':if(!arg)throw Error('Usage: rm <file>');{const [p,n]=await parentAndName(resolve(arg));await p.removeEntry(n);line('Deleted file: '+arg,'ok')}break;
case 'rmdir':if(!arg)throw Error('Usage: rmdir <folder>');{const [p,n]=await parentAndName(resolve(arg));await p.removeEntry(n);line('Deleted empty directory: '+arg,'ok')}break;
case 'tree':await tree(arg?resolve(arg):cwd,0,'');break;
case 'echo':line(args.join(' '));break;
case 'clear':screen.textContent='';break;
case 'history':history.forEach((x,i)=>line((i+1)+'  '+x,'dim'));break;
case 'date':line(new Date().toString());break;
case 'whoami':line('guest','ok');break;
case 'uname':line('Hyper-Pop Browser Runtime / JavaScript / OPFS');break;
case 'storage':line('Origin Private File System: '+(root?'available':'unavailable'),root?'ok':'err');line('Storage is private to this browser profile and this website origin.','dim');break;
case 'download':if(!arg)throw Error('Usage: download <file>');{const blob=new Blob([await readFile(resolve(arg))],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=resolve(arg).pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);line('Download started: '+arg,'ok')}break;
case 'cp':case 'mv':{if(args.length<2)throw Error('Usage: '+cmd+' <source> <destination>');const src=resolve(args[0]),dst=resolve(args[1]);if(pathString(src)===pathString(dst))throw Error('Source and destination are the same.');const data=await readFile(src);await writeFile(dst,data,false);if(cmd==='mv'){const [p,n]=await parentAndName(src);await p.removeEntry(n)}line((cmd==='cp'?'Copied ':'Moved ')+args[0]+' → '+args[1],'ok')}break;
case 'find':{const base=arg?resolve(arg):cwd,needle=(args[1]||'').toLowerCase();let found=0;async function walk(p){const d=await directory(p,false);for await(const [name,h] of d.entries()){const full=pathString(p.concat(name));if(!needle||name.toLowerCase().includes(needle)){line(full+(h.kind==='directory'?'/':''));found++}if(h.kind==='directory')await walk(p.concat(name))}}await walk(base);if(!found)line('No matches.','dim')}break;
case 'stat':{if(!arg)throw Error('Usage: stat <path>');const p=resolve(arg);try{const d=await directory(p,false);let count=0;for await(const _ of d.entries())count++;line('Directory: '+pathString(p));line('Entries: '+count)}catch(_){const f=await readFile(p);line('File: '+pathString(p));line('Size: '+new TextEncoder().encode(f).length+' bytes');line('Lines: '+(f?f.split('\n').length:0))}}break;
case 'du':{const p=resolve(arg||'.'),n=await countBytes(p);line(formatSize(n)+'  '+pathString(p),'ok')}break;
case 'head':case 'tail':{if(!arg)throw Error('Usage: '+cmd+' <file> [lines]');const rows=(await readFile(resolve(arg))).split('\n'),n=Math.max(1,Math.min(500,Number(args[1])||10));(cmd==='head'?rows.slice(0,n):rows.slice(-n)).forEach(x=>line(x))}break;
case 'wc':{if(!arg)throw Error('Usage: wc <file>');const s=await readFile(resolve(arg));line(s.split('\n').length+' lines  '+(s.trim()?s.trim().split(/\s+/).length:0)+' words  '+new TextEncoder().encode(s).length+' bytes')}break;
case 'grep':{if(args.length<2)throw Error('Usage: grep <text> <file>');const needle=args[0].toLowerCase(),rows=(await readFile(resolve(args[1]))).split('\n');let n=0;rows.forEach((x,i)=>{if(x.toLowerCase().includes(needle)){line((i+1)+': '+x);n++}});if(!n)line('No matches.','dim')}break;
case 'sort':case 'uniq':case 'nl':{if(!arg)throw Error('Usage: '+cmd+' <file>');let rows=(await readFile(resolve(arg))).split('\n');if(cmd==='sort')rows.sort((a,b)=>a.localeCompare(b));if(cmd==='uniq')rows=rows.filter((x,i)=>i===0||x!==rows[i-1]);if(cmd==='nl')rows=rows.map((x,i)=>String(i+1).padStart(4)+'  '+x);rows.forEach(x=>line(x))}break;
case 'rev':line(args.join(' ').split('').reverse().join(''));break;
case 'base64':line(bytesToBase64(args.join(' ')),'ok');break;
case 'unbase64':line(base64ToText(args.join(' ')));break;
case 'seq':{if(!arg)throw Error('Usage: seq <end> or seq <start> <end>');const a=args.length>1?Number(args[0]):1,b=Number(args[args.length-1]);if(!Number.isInteger(a)||!Number.isInteger(b)||Math.abs(b-a)>1000)throw Error('Sequence must be integers with at most 1001 values.');for(let n=a;n<=b;n++)line(n)}break;
case 'calc':if(!args.length)throw Error('Usage: calc <expression>');line(String(calc(args.join(' '))),'ok');break;
case 'upload':{const picker=document.createElement('input');picker.type='file';picker.multiple=true;picker.onchange=async()=>{for(const f of picker.files){const dest=cwd.concat(f.name);await writeFile(dest,await f.text(),false);line('Imported '+f.name+' ('+formatSize(f.size)+')','ok')}};picker.click()}break;
case 'open':{if(!arg)throw Error('Usage: open <https-url>');const u=new URL(arg,location.href);if(u.protocol!=='https:')throw Error('Only HTTPS addresses can be opened.');window.open(u.href,'_blank','noopener')}break;
case 'export':if(!arg)Object.keys(envVars).sort().forEach(k=>line(k+'='+envVars[k]));else{const m=raw.slice(raw.indexOf(' ')+1).match(/^([A-Za-z_][A-Za-z0-9_]*)=(.*)$/);if(!m)throw Error('Usage: export NAME=value');envVars[m[1]]=m[2];line(m[1]+' exported','ok')}break;
case 'env':Object.keys(envVars).sort().forEach(k=>line(k+'='+envVars[k]));break;
case 'unset':if(!arg)throw Error('Usage: unset <name>');delete envVars[arg];line('Unset '+arg,'ok');break;
case 'which':if(!arg)throw Error('Usage: which <command>');line(['help','pwd','ls','cd','mkdir','touch','cat','write','append','rm','rmdir','tree','echo','clear','history','date','whoami','uname','storage','download','cp','mv','find','stat','du','head','tail','wc','grep','sort','uniq','rev','nl','base64','unbase64','seq','calc','upload','open','export','env','unset','which','man','hostname','id','uptime','free','version','about','exit'].includes(arg)?'/bin/'+arg:'not found',arg? 'ok':'');break;
case 'man':line('Built-in command: '+(arg||'help'));line('Use help for the command index. Most file commands accept absolute or relative paths.');break;
case 'hostname':line('hyper-pop-browser');break;
case 'id':line('uid=1000(guest) gid=1000(guest) groups=1000(guest)');break;
case 'uptime':line('Session uptime: '+Math.floor((Date.now()-startedAt)/1000)+' seconds');break;
case 'free':line('Browser-managed memory is not fully exposed to web pages.','warn');if(performance.memory)line('JS heap: '+formatSize(performance.memory.usedJSHeapSize)+' / '+formatSize(performance.memory.jsHeapSizeLimit));break;
case 'version':line('Hyper-Pop Terminal 0.2 / HP-SH','ok');break;
case 'about':line('A static, browser-local command environment. Files live in this site origin’s OPFS storage.');line('No Supabase, no server shell, no unrestricted system access.','dim');break;
case 'reset':screen.textContent='';line('Terminal display reset. Files were not changed.','ok');break;
case 'exit':location.href='index.html';break;
default:line('Command not found: '+cmd+'. Type help.','err');
}
}catch(e){line('ERROR: '+(e&&e.message?e.message:String(e)),'err')}
}
async function init(){try{if(!navigator.storage||!navigator.storage.getDirectory)throw Error('This browser does not support OPFS. Try an up-to-date Safari or another modern browser.');root=await navigator.storage.getDirectory();await directory(HOME,true);status('OPFS READY','good');line('Hyper-Pop Terminal [HP-SH 0.2]','ok');line('Persistent browser-local filesystem initialized.','dim');line('No Supabase connection. No access to private device files.','dim');line('Type help to see available commands.','');line('');updatePrompt()}catch(e){status('FILESYSTEM UNAVAILABLE','bad');line('Could not initialize browser storage: '+e.message,'err');line('This terminal requires a secure HTTPS page and browser OPFS support.','warn')}}
form.addEventListener('submit',async e=>{e.preventDefault();const raw=input.value;input.value='';if(raw.trim()){history.push(raw);historyIndex=history.length;await run(raw)}});
input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();historyIndex=Math.max(0,historyIndex-1);input.value=history[historyIndex]||''}else if(e.key==='ArrowDown'){e.preventDefault();historyIndex=Math.min(history.length,historyIndex+1);input.value=history[historyIndex]||''}});
document.getElementById('clear').addEventListener('click',()=>{screen.textContent='';input.focus()});
screen.addEventListener('click',()=>input.focus());
init();
})();
</script>
</body>
</html>
