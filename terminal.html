}

async function loadTypeScript(){

  if(errors.length){for(const d of errors)line('TypeScript: '+ts.flattenDiagnosticMessageText(d.messageText,' '),'err');return}

function splitShellBatch(source){
 const out=[];let part='',quote='',escape=false;
 for(let i=0;i<source.length;i++){
  const ch=source[i];
  if(escape){part+=ch;escape=false;continue}
  if(ch==='\\'&&quote!=="'"){part+=ch;escape=true;continue}
  if(quote){part+=ch;if(ch===quote)quote='';continue}
  if(ch==='"'||ch==="'"){quote=ch;part+=ch;continue}
  if(ch===';'||ch==='\n'||ch==='\r'){
   if(part.trim())out.push(part.trim());part='';
   if(ch==='\r'&&source[i+1]==='\n')i++;
   continue;
  }
  part+=ch;
 }
 if(part.trim())out.push(part.trim());
 return out;
}
