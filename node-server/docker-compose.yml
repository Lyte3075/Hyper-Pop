services:
  hyperpop-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: hyperpop-node-server:latest
    container_name: hyperpop-node-server
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-10000}:10000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "10000"
    healthcheck:
      test: ["CMD", "npm", "run", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
