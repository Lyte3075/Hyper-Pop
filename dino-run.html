<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dino Run ✦ Hyper-Pop</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.game{max-width:900px;margin:auto;text-align:center}
.panel{padding:20px;background:#ffffff08;border:1px solid #ffffff18;border-radius:26px;overflow:hidden}
.hud{display:flex;justify-content:space-between;gap:12px;font:700 15px "DM Mono";color:#ffe66d;margin:0 4px 12px}
.canvas-wrap{position:relative;border-radius:20px;overflow:hidden;background:#dff7ff;border:1px solid #ffffff22;box-shadow:0 18px 60px #0006}
canvas{display:block;width:100%;height:auto;touch-action:none}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.arrow{width:74px;height:58px;font-size:24px}
.start{min-width:130px}
.msg{min-height:25px;color:#aaa7c1;margin-top:12px;font-weight:700}
.help{font:12px "DM Mono";color:#77758b;margin-top:10px}
@media(max-width:600px){.panel{padding:12px}.arrow{width:70px;height:56px}}
</style>
</head>
<body>
<div class="w">
<nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav>
<header class="hero"><div class="e">🦖</div><h1>Dino Run</h1><p>Run through the neon wilderness. Jump the obstacles. Don't become prehistoric roadkill.</p></header>
<main class="box game"><div class="panel">
<div class="hud"><span id="score">000000</span><span id="best">BEST 000000</span></div>
<div class="canvas-wrap"><canvas id="game" width="900" height="330"></canvas></div>
<div class="controls">
<button class="btn arrow" id="left" aria-label="Move left">←</button>
<button class="btn arrow" id="down" aria-label="Duck">↓</button>
<button class="btn start" id="jump">JUMP</button>
<button class="btn arrow" id="up" aria-label="Jump">↑</button>
<button class="btn arrow" id="right" aria-label="Move right">→</button>
</div>
<div class="msg" id="msg">Press SPACE, W, ↑, or swipe up to start jumping.</div>
<div class="help">WASD • Arrow Keys • Buttons • Swipe</div>
</div></main>
</div>
<script src="app.js"></script>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d"),$=id=>document.getElementById(id);
let running=false,over=false,last=0,score=0,best=Number(localStorage.getItem("hpDinoBest")||0),speed=310,spawn=0,ground=270;
let d={x:130,y:ground-54,w:48,h:54,vy:0,jump:false,duck:false},obs=[],clouds=[],audio=null;
function sfx(type){
 try{
  audio=audio||new AudioContext();if(audio.state==="suspended")audio.resume();
  const now=audio.currentTime;
  const seq={jump:[420,.09,"square"],land:[180,.06,"triangle"],hit:[90,.25,"sawtooth"],score:[760,.07,"triangle"],start:[520,.12,"triangle"],duck:[240,.05,"sine"]}[type]||[440,.06,"sine"];
  const o=audio.createOscillator(),g=audio.createGain();o.type=seq[2];o.frequency.setValueAtTime(seq[0],now);
  if(type==="jump")o.frequency.exponentialRampToValueAtTime(700,now+seq[1]);
  if(type==="hit")o.frequency.exponentialRampToValueAtTime(35,now+seq[1]);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.07,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+seq[1]);
  o.connect(g).connect(audio.destination);o.start(now);o.stop(now+seq[1]+.02);
 }catch(e){}
}
function reset(){
 running=true;over=false;score=0;speed=310;spawn=.4;d={x:130,y:ground-54,w:48,h:54,vy:0,jump:false,duck:false};obs=[];clouds=[];
 for(let i=0;i<5;i++)clouds.push({x:Math.random()*900,y:35+Math.random()*75,s:.35+Math.random()*.45});
 last=performance.now();sfx("start");$("msg").textContent="RUN!";requestAnimationFrame(loop);
}
function jump(){if(!running){reset();return}if(!d.jump&&d.y>=ground-d.h){d.vy=-720;d.jump=true;sfx("jump")}}
function duck(v){if(running)d.duck=v}
function move(dir){if(running)d.x=Math.max(60,Math.min(280,d.x+dir*18))}
function spawnObstacle(){
 const fly=Math.random()<Math.min(.22,score/9000);
 const type=fly?"bird":Math.random()<.5?"cactus":"rock";
 const h=type==="cactus"?45:type==="rock"?30:28,w=type==="cactus"?25:type==="rock"?38:42;
 obs.push({x:920,y:ground-h,w,h,type,passed:false});
}
function collide(a,b){
 const ax=a.x+6,ay=a.y+5,aw=a.w-12,ah=a.h-8;
 const bx=b.x+3,by=b.y+3,bw=b.w-6,bh=b.h-6;
 return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}
function draw(){
 const g=ctx.createLinearGradient(0,0,0,330);g.addColorStop(0,"#dff7ff");g.addColorStop(.62,"#fff7dc");g.addColorStop(1,"#ffe0b5");ctx.fillStyle=g;ctx.fillRect(0,0,900,330);
 ctx.fillStyle="#ffffff99";for(const q of clouds){ctx.beginPath();ctx.arc(q.x,q.y,18,0,7);ctx.arc(q.x+20,q.y-5,24,0,7);ctx.arc(q.x+43,q.y,16,0,7);ctx.fill()}
 ctx.fillStyle="#9c78d6";ctx.fillRect(0,ground,900,4);
 ctx.fillStyle="#b18ee8";for(let x=0;x<900;x+=28)ctx.fillRect((x-(score*speed/180)%28),ground+13,13,3);
 for(const o of obs){
  ctx.fillStyle=o.type==="cactus"?"#386b62":o.type==="rock"?"#665d78":"#7b3f77";
  if(o.type==="cactus"){ctx.fillRect(o.x+8,o.y,10,o.h);ctx.fillRect(o.x,o.y+15,9,8);ctx.fillRect(o.x+17,o.y+22,9,8)}
  else if(o.type==="rock"){ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+9,o.y+5);ctx.lineTo(o.x+25,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill()}
  else{ctx.fillRect(o.x,o.y+8,o.w,8);ctx.fillRect(o.x+8,o.y,o.w-16,10);ctx.fillRect(o.x+2,o.y+15,9,5);ctx.fillRect(o.x+31,o.y+15,9,5)}
 }
 ctx.save();ctx.translate(d.x,d.y);
 if(d.duck)ctx.scale(1,.72);
 ctx.fillStyle="#312b55";ctx.fillRect(4,10,34,38);ctx.fillRect(30,0,20,27);ctx.fillRect(45,5,9,7);ctx.fillStyle="#fff";ctx.fillRect(42,6,4,4);ctx.fillStyle="#ff5db1";ctx.fillRect(7,45,10,9);ctx.fillRect(29,45,10,9);ctx.restore();
}
function loop(now){
 if(!running)return;
 const dt=Math.min(.035,(now-last)/1000);last=now;score+=dt*100;speed=310+Math.min(260,score*.028);
 d.vy+=1900*dt;d.y+=d.vy*dt;if(d.y>=ground-d.h){if(d.jump)sfx("land");d.y=ground-d.h;d.vy=0;d.jump=false}
 spawn-=dt;if(spawn<=0){spawnObstacle();spawn=.72+Math.random()*.7-Math.min(.25,score/18000)}
 for(const q of clouds){q.x-=dt*18*q.s;if(q.x<-80)q.x=920}
 for(const o of obs){o.x-=speed*dt;if(!o.passed&&o.x+d.w<d.x){o.passed=true;sfx("score")}}
 obs=obs.filter(o=>o.x>-80);
 const hit=obs.some(o=>collide({x:d.x,y:d.duck?d.y+12:d.y,w:d.w,h:d.duck?d.h-12:d.h},o));
 if(hit){running=false;over=true;best=Math.max(best,Math.floor(score));localStorage.setItem("hpDinoBest",best);sfx("hit");$("msg").textContent="💥 BONK! Press JUMP or swipe up to run again.";$("best").textContent="BEST "+String(best).padStart(6,"0");draw();return}
 $("score").textContent=String(Math.floor(score)).padStart(6,"0");draw();requestAnimationFrame(loop)
}
function action(key){
 if(key==="jump")jump();
 if(key==="down")duck(true);
 if(key==="left")move(-1);
 if(key==="right")move(1);
}
function release(key){if(key==="down")duck(false)}
document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if([" ","arrowup","w"].includes(k)){e.preventDefault();jump()}
 if(["arrowdown","s"].includes(k)){e.preventDefault();duck(true)}
 if(["arrowleft","a"].includes(k)){e.preventDefault();move(-1)}
 if(["arrowright","d"].includes(k)){e.preventDefault();move(1)}
});
document.addEventListener("keyup",e=>{const k=e.key.toLowerCase();if(["arrowdown","s"].includes(k))duck(false)});
document.querySelectorAll(".controls .btn").forEach(b=>{
 const key=b.id;
 b.addEventListener("pointerdown",e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);action(key)});
 b.addEventListener("pointerup",e=>{e.preventDefault();release(key)});
 b.addEventListener("pointercancel",()=>release(key));
});
let sx=0,sy=0;
c.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});
c.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dy)>Math.abs(dx)){if(dy<0)jump();else duck(true);setTimeout(()=>duck(false),250)}else move(dx>0?1:-1)},{passive:true});
$("score").textContent="000000";$("best").textContent="BEST "+String(best).padStart(6,"0");draw();
</script>
</body>
</html>
