<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Speedy Sheep ✦ Hyper-Pop</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.game{max-width:900px;margin:auto;text-align:center}
.panel{padding:20px;background:#ffffff08;border:1px solid #ffffff18;border-radius:26px;overflow:hidden}
.hud{display:flex;justify-content:space-between;gap:12px;font:700 15px "DM Mono";color:#ffe66d;margin:0 4px 12px}
.canvas-wrap{position:relative;border-radius:20px;overflow:hidden;background:#dff7ff;border:1px solid #ffffff22;box-shadow:0 18px 60px #0006}
canvas{display:block;width:100%;height:auto;touch-action:none}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.arrow{width:140px;height:58px;font-size:17px;padding:0 8px;white-space:nowrap}
.start{min-width:130px}
.msg{min-height:25px;color:#aaa7c1;margin-top:12px;font-weight:700}
.help{font:12px "DM Mono";color:#77758b;margin-top:10px}
@media(max-width:600px){.panel{padding:12px}.arrow{width:46%;max-width:180px;height:58px;font-size:16px}}
</style>
</head>
<body>
<div class="w">
<nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav>
<header class="hero"><div class="e">🐑</div><h1>Speedy Sheep</h1><p>Run, jump, and duck through a never-ending journey across the world.</p></header>
<main class="box game"><div class="panel">
<div class="hud"><span id="score">000000</span><span id="best">BEST 000000</span></div>
<div class="canvas-wrap"><canvas id="game" width="900" height="330"></canvas></div>
<div class="controls">
<button class="btn arrow" id="jump">JUMP</button>
<button class="btn arrow" id="down">DUCK</button>
</div>
<div class="msg" id="msg">Press JUMP, SPACE, or swipe up to start.</div>
<div class="help">SPACE / ↑ to jump • ↓ to duck • Swipe up/down</div>
</div></main>
</div>
<script src="app.js"></script>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d"),$=id=>document.getElementById(id);
let running=false,over=false,last=0,score=0,best=Number(localStorage.getItem("hpDinoBest")||0),speed=310,spawn=0,ground=270,worldIndex=0,worldProgress=0;
let d={x:130,y:ground-58,w:62,h:58,vy:0,jump:false,duck:false,jumpTime:0},obs=[],clouds=[],audio=null;
const worlds=[
 {name:"DESERT",sky:["#f6d78d","#fff0bd"],ground:"#b87945",line:"#d69a62",accent:"#7d5a3b",kind:"desert",obstacles:["cactus","tumbleweed"],ceil:["vulture","canyon"]},
 {name:"FOREST",sky:["#78c98b","#d9f7b5"],ground:"#3f7445",line:"#6ea95a",accent:"#244b2c",kind:"forest",obstacles:["log","stump","mushroom"],ceil:["lowbranch","owl"]},
 {name:"FARM",sky:["#78c9ff","#f7e9a8"],ground:"#6d9f4f",line:"#9cc96c",accent:"#8b5a2b",kind:"farm",obstacles:["haybale","fence","tractor"],ceil:["barnbeam","windmill"]},
 {name:"MOUNTAINS",sky:["#a8d8ff","#e8f1f7"],ground:"#66727d",line:"#9aa6ad",accent:"#52606b",kind:"mountains",obstacles:["boulder","pine","snowrock"],ceil:["rockoverhang","eagle"]},
 {name:"METRO",sky:["#59658a","#c1a5c8"],ground:"#343847",line:"#6b7188",accent:"#4be0e3",kind:"metro",obstacles:["barrier","trash","cone"],ceil:["sign","pipe"]},
 {name:"CITY",sky:["#171b3b","#8b4b7d"],ground:"#20243d",line:"#454b6b",accent:"#ff5db1",kind:"city",obstacles:["car","hydrant","barrier"],ceil:["billboard","beam"]}
];
function sfx(type){
 try{
  audio=audio||new AudioContext();if(audio.state==="suspended")audio.resume();
  const now=audio.currentTime;
  const seq={jump:[420,.09,"square"],land:[180,.06,"triangle"],hit:[90,.25,"sawtooth"],score:[760,.07,"triangle"],start:[520,.12,"triangle"],duck:[240,.05,"sine"]}[type]||[440,.06,"sine"];
  const o=audio.createOscillator(),g=audio.createGain();o.type=seq[2];o.frequency.setValueAtTime(seq[0],now);
  if(type==="jump")o.frequency.exponentialRampToValueAtTime(700,now+seq[1]);
  if(type==="hit")o.frequency.exponentialRampToValueAtTime(35,now+seq[1]);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.07,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+seq[1]);
  o.connect(g).connect(audio.destination);o.start(now);o.stop(now+seq[1]+.02);
 }catch(e){}
}
function reset(){
 running=true;over=false;score=0;speed=310;spawn=.4;worldIndex=0;worldProgress=0;d={x:130,y:ground-58,w:62,h:58,vy:0,jump:false,duck:false,jumpTime:0};obs=[];clouds=[];
 for(let i=0;i<5;i++)clouds.push({x:Math.random()*900,y:35+Math.random()*75,s:.35+Math.random()*.45});
 last=performance.now();sfx("start");$("msg").textContent="RUN!";requestAnimationFrame(loop);
}
function jump(){
 if(!running){reset();d.vy=-820;d.jump=true;d.jumpTime=0;sfx("jump");return}
 if(!d.jump&&d.y>=ground-d.h){d.vy=-820;d.jump=true;d.jumpTime=0;sfx("jump")}
}
function duck(v){if(running)d.duck=v}
function move(dir){if(running)d.x=Math.max(60,Math.min(280,d.x+dir*18))}
function spawnObstacle(){
 const w=worlds[worldIndex];
 const wantCeiling=Math.random()<.30;
 const type=(wantCeiling?w.ceil:w.obstacles)[Math.floor(Math.random()*(wantCeiling?w.ceil.length:w.obstacles.length))];
 const specs={
  cactus:[30,50,28,"ground"],tumbleweed:[38,30,38,"ground"],
  log:[58,25,52,"ground"],stump:[34,38,34,"ground"],mushroom:[38,28,42,"ground"],
  haybale:[48,42,48,"ground"],fence:[62,48,16,"ground"],tractor:[62,46,58,"ground"],
  boulder:[50,38,50,"ground"],pine:[38,72,40,"ground"],snowrock:[44,28,44,"ground"],
  barrier:[62,34,42,"ground"],trash:[38,44,34,"ground"],cone:[30,34,26,"ground"],
  car:[78,38,70,"ground"],hydrant:[30,48,28,"ground"],
  vulture:[46,26,44,"air"],lowbranch:[90,24,44,"air"],owl:[42,28,50,"air"],
  barnbeam:[105,22,48,"air"],windmill:[76,24,55,"air"],rockoverhang:[105,26,54,"air"],eagle:[48,25,46,"air"],
  sign:[110,20,48,"air"],pipe:[100,24,48,"air"],billboard:[125,22,50,"air"],beam:[115,20,46,"air"]
 };
 const [ww,hh,_,zone]=specs[type]||[40,35,40,"ground"];
 const y=zone==="air"?ground-105:ground-hh;
 obs.push({x:920,y,w:ww,h:hh,type,zone,passed:false});
}
 for(const o of obs){
  const colors={cactus:"#2e704d",tumbleweed:"#9a693c",log:"#70452b",stump:"#79512f",mushroom:"#d94d62",haybale:"#d9a83f",fence:"#8b5a2b",tractor:"#4f7b57",boulder:"#555b65",pine:"#2e6540",snowrock:"#b9c9d3",barrier:"#e34f62",trash:"#777b88",cone:"#ff8b35",car:"#cf4665",hydrant:"#e34d4d",vulture:"#55405e",lowbranch:"#5b4029",owl:"#5b493e",barnbeam:"#7c4a2c",windmill:"#6a7280",rockoverhang:"#59636d",eagle:"#5a5d6e",sign:"#4be0e3",pipe:"#7c8792",billboard:"#ff5db1",beam:"#777f8b"};
  ctx.fillStyle=colors[o.type]||w.accent;
  if(["cactus"].includes(o.type)){ctx.fillRect(o.x+9,o.y,12,o.h);ctx.fillRect(o.x,o.y+15,10,9);ctx.fillRect(o.x+21,o.y+23,10,9)}
  else if(["tumbleweed","mushroom","boulder","snowrock","trash"].includes(o.type)){ctx.beginPath();ctx.arc(o.x+o.w/2,o.y+o.h/2,Math.min(o.w,o.h)/2,0,Math.PI*2);ctx.fill()}
  else if(o.type==="pine"){ctx.beginPath();ctx.moveTo(o.x+o.w/2,o.y);ctx.lineTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill();ctx.fillRect(o.x+o.w/2-5,o.y+o.h-18,10,18)}
  else if(["fence","barrier","beam","barnbeam","pipe"].includes(o.type)){ctx.fillRect(o.x,o.y,o.w,8);ctx.fillRect(o.x,o.y+o.h-8,8,8);ctx.fillRect(o.x+o.w-8,o.y+o.h-8,8,8)}
  else if(["lowbranch","rockoverhang"].includes(o.type)){ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillRect(o.x+10,o.y+o.h,10,18)}
  else if(["sign","billboard"].includes(o.type)){ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle="#111a";ctx.fillRect(o.x+8,o.y+7,o.w-16,o.h-14)}
  else if(o.type==="car"){ctx.fillRect(o.x,o.y+12,o.w,o.h-12);ctx.fillRect(o.x+14,o.y,o.w-28,18);ctx.fillStyle="#bdefff";ctx.fillRect(o.x+22,o.y+5,18,9)}
  else if(o.type==="tractor"){ctx.fillRect(o.x+8,o.y+12,o.w-16,o.h-12);ctx.fillRect(o.x+24,o.y,o.w-30,20);ctx.fillStyle="#222";ctx.fillRect(o.x,o.y+o.h-15,15,15);ctx.fillRect(o.x+o.w-15,o.y+o.h-18,18,18)}
  else if(o.type==="hydrant"){ctx.fillRect(o.x+8,o.y,o.w-16,o.h);ctx.fillRect(o.x,o.y+10,o.w,8)}
  else if(o.type==="cone"){ctx.beginPath();ctx.moveTo(o.x+o.w/2,o.y);ctx.lineTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.fill()}
  else {ctx.fillRect(o.x,o.y,o.w,o.h)}
 }
 ctx.fillStyle=w.accent;
 if(w.kind==="desert"){for(let x=0;x<900;x+=150){ctx.beginPath();ctx.arc(x+45,ground-4,45,Math.PI,0);ctx.fill()}}
 if(w.kind==="forest"){for(let x=30;x<900;x+=95){ctx.fillRect(x,ground-90,10,90);ctx.beginPath();ctx.moveTo(x+5,ground-135);ctx.lineTo(x-25,ground-70);ctx.lineTo(x+35,ground-70);ctx.fill()}}
 if(w.kind==="farm"){for(let x=20;x<900;x+=170){ctx.fillRect(x,ground-85,6,85);ctx.fillRect(x-25,ground-110,56,6)}}
 if(w.kind==="mountains"){ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(130,100);ctx.lineTo(250,ground);ctx.lineTo(410,80);ctx.lineTo(600,ground);ctx.lineTo(760,110);ctx.lineTo(900,ground);ctx.fill()}}
 if(w.kind==="metro"){for(let x=0;x<900;x+=115){ctx.fillRect(x,ground-120,72,120);ctx.fillStyle="#8a91aa";ctx.fillRect(x+10,ground-100,14,20);ctx.fillRect(x+38,ground-100,14,20);ctx.fillStyle=w.accent)}}
 if(w.kind==="city"){for(let x=0;x<900;x+=90){const h=70+(x%110);ctx.fillRect(x,ground-h,65,h);ctx.fillStyle="#ffe66d99";for(let y=ground-h+12;y<ground-8;y+=20)ctx.fillRect(x+12,y,8,8);ctx.fillStyle=w.accent}}
>
