<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Gravity Dodge ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.game{max-width:720px;margin:auto;text-align:center}.panel{padding:22px;background:#ffffff08;border:1px solid #ffffff18;border-radius:24px}.big{font-size:clamp(55px,15vw,100px);margin:18px 0}.score{font:700 28px "DM Mono";color:#ffe66d}.msg{min-height:28px;color:#aaa7c1;margin:12px}.btn{border:0;border-radius:13px;padding:13px 18px;background:#f7f4ff;color:#11111f;font-weight:800;cursor:pointer;margin:5px}.btn.alt{background:#ffffff0d;color:#fff;border:1px solid #ffffff18}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choice{min-width:110px}.bar{height:12px;background:#ffffff10;border-radius:99px;overflow:hidden;margin:15px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5db1,#9b7bff,#4be0e3);transition:width .2s}.kbd{font:12px "DM Mono";color:#77758b;margin-top:16px}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.pop{animation:pop .18s}@keyframes pop{50%{transform:scale(1.08)}}@media(max-width:600px){.panel{padding:16px}}</style></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav><header class="hero"><div class="e">🪐</div><h1>Gravity Dodge</h1><p>Move the orb. Dodge the falling stars. Survive as long as possible.</p></header><main class="box game"><div class="panel"><div id="arena" style="position:relative;height:300px;margin:10px 0;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#17172f,#070711);border:1px solid #ffffff18"><div id="orb" style="position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:44px;z-index:2">🔵</div></div><div class="score" id="score">0.0s</div><div class="bar"><i id="bar"></i></div><button class="btn" id="start">START</button><button class="btn alt" id="left">←</button><button class="btn alt" id="right">→</button><div class="msg" id="msg">The sky is about to get unfriendly.</div></div></main></div><script src="app.js"></script><script>let run=false,t=0,x=50,last=0,audio,obstacles=[],raf=0;const $=id=>document.getElementById(id);function s(f=440,d=.07,type="sine"){try{audio=audio||new AudioContext();if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=.05;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function move(d){x=Math.max(8,Math.min(92,x+d));$("orb").style.transform=`translateX(${x-50}%)`;s(500,.04)}function end(){run=false;cancelAnimationFrame(raf);s(100,.25,"sawtooth");$("msg").textContent="💥 You got bonked. Score: "+t.toFixed(1)+"s";$("start").textContent="TRY AGAIN"}function frame(now){if(!run)return;if(!last)last=now;let dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;$("score").textContent=t.toFixed(1)+"s";$("bar").style.width=Math.min(100,t*4)+"%";if(Math.random()<dt*(.7+t/16)){obstacles.push({x:Math.random()*92+4,y:-20,el:(()=>{let e=document.createElement("div");e.textContent="☄️";e.style.cssText="position:absolute;font-size:30px;transform:translate(-50%,-50%)";$("arena").append(e);return e})()})}obstacles.forEach(o=>{o.y+=dt*(90+t*2);o.el.style.left=o.x+"%";o.el.style.top=o.y+"px"});for(const o of obstacles)if(o.y>78&&o.y<92&&Math.abs(o.x-x)<9){end();return}obstacles=obstacles.filter(o=>{if(o.y<320)return true;o.el.remove();return false});requestAnimationFrame(frame)}$("start").onclick=()=>{run=true;t=0;last=0;x=50;obstacles=[];$("arena").querySelectorAll("[data-obstacle]").forEach(e=>e.remove());$("msg").textContent="DODGE!";$("start").textContent="RUNNING...";s(660,.12);raf=requestAnimationFrame(frame)};$("left").onclick=()=>move(-8);$("right").onclick=()=>move(8);document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")move(-8);if(e.key==="ArrowRight"||e.key==="d")move(8)});</script></body></html>
