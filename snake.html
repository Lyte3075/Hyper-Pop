<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Snake ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.snakebox{max-width:620px;margin:auto}.snake-board{width:min(92vw,560px);aspect-ratio:1;margin:20px auto;background:#090b16;border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:repeat(20,1fr);overflow:hidden;box-shadow:0 20px 70px #0008}.sq{border:1px solid #ffffff05}.sq.food{background:var(--pink);box-shadow:0 0 18px var(--pink);border-radius:45%}.sq.snake{background:var(--cyan);box-shadow:0 0 12px #4be0e388;border-radius:5px}.sq.head{background:#fff}.scoreline{text-align:center;font:14px "DM Mono";color:var(--muted)}.snake-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.pad{display:grid;grid-template-columns:repeat(3,62px);gap:7px;justify-content:center;margin:18px auto}.pad button{width:62px;height:50px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:#fff;font-size:20px}.pad .empty{visibility:hidden}.swipe{display:none;text-align:center;color:var(--muted);font:11px 'DM Mono'}@media(max-width:699px){.swipe{display:block}}</style></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav><header class="hero"><div class="e">🐍</div><h1>Snake</h1><p>Eat the fruit, grow longer, and do not become your own problem.</p></header><main class="box snakebox"><div class="scoreline">SCORE <b id="score">0</b> · BEST <b id="best">0</b></div><div class="snake-board" id="board"></div><div class="snake-actions"><button class="btn" id="start">START / RESTART</button><a class="btn alt" href="leaderboard.html">🏆 LEADERBOARD</a></div><div class="pad"><button class="empty">·</button><button data-d="up">▲</button><button class="empty">·</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><div class="swipe">Swipe anywhere on the board to steer.</div><p id="status" class="result">Mobile: buttons or swipe. PC: WASD or Arrow Keys.</p></main></div><script src="app.js"></script><script>const N=20,board=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');let snake,dir,next,food,score,timer,running=false,best=+(localStorage.hpSnakeBest||0);bestEl.textContent=best;function draw(){board.innerHTML='';for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='sq';const x=i%N,y=Math.floor(i/N),si=snake?.findIndex(p=>p.x===x&&p.y===y);if(food&&food.x===x&&food.y===y)d.classList.add('food');if(si>=0)d.classList.add('snake');if(si===0)d.classList.add('head');board.appendChild(d)}}function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}function startGame(){clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next={...dir};score=0;scoreEl.textContent=0;running=true;statusEl.textContent='Go!';place();draw();timer=setInterval(step,115)}function setDir(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(!d||d.x===-dir.x&&d.y===-dir.y)return;next=d}function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some((p,i)=>i>0&&p.x===h.x&&p.y===h.y))return gameOver();snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;place()}else snake.pop();draw()}function gameOver(){clearInterval(timer);running=false;best=Math.max(best,score);localStorage.hpSnakeBest=best;bestEl.textContent=best;statusEl.textContent='Game over! '+score+' points. Tap restart for a new round.';if(score>0)hpSubmit('snake',score)}document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key])}});document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setDir(b.dataset.d));
let sx=0,sy=0;board.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:true});board.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up')},{passive:true});
start.onclick=startGame;snake=[{x:10,y:10}];dir={x:1,y:0};next=dir;food={x:15,y:10};draw();</script></body></html>
