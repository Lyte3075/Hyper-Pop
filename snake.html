<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Snake ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.snakebox{max-width:620px;margin:auto;overflow:hidden}.snake-board{width:min(100%,560px);height:auto;aspect-ratio:1/1;max-width:560px;margin:20px auto;touch-action:none;overscroll-behavior:none;background:#090b16;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 70px #0008}.snake-canvas{display:block;width:100%;height:100%;touch-action:none}.scoreline{text-align:center;font:14px "DM Mono";color:var(--muted)}.snake-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.pad{display:grid;grid-template-columns:repeat(3,62px);gap:7px;justify-content:center;margin:18px auto}.pad button{width:62px;height:50px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:#fff;font-size:20px}.pad .empty{visibility:hidden}.swipe{display:none;text-align:center;color:var(--muted);font:11px "DM Mono"}@media(max-width:699px){.swipe{display:block}}</style></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav><header class="hero"><div class="e">🐍</div><h1>Snake</h1><p>Eat the fruit, grow longer, and do not become your own problem.</p></header><main class="box snakebox"><div class="scoreline">SCORE <b id="score">0</b> · BEST <b id="best">0</b></div><div class="snake-board" id="board"><canvas class="snake-canvas" id="canvas"></canvas></div><div class="snake-actions"><button class="btn" id="start">START / RESTART</button><a class="btn alt" href="leaderboard.html">🏆 LEADERBOARD</a></div><div class="pad"><button class="empty">·</button><button data-d="up">▲</button><button class="empty">·</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><div class="swipe">Swipe anywhere on the board to steer.</div><p id="status" class="result">Mobile: buttons or swipe. PC: WASD or Arrow Keys.</p></main></div><script src="app.js"></script><script>
const N=20,board=document.getElementById('board'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');let snake,dir,next,food,score,timer,running=false,best=+(localStorage.hpSnakeBest||0),lastStep=0,anim=0;
function resize(){const r=board.getBoundingClientRect(),d=Math.floor(Math.min(r.width,r.height)*devicePixelRatio);canvas.width=d;canvas.height=d}addEventListener('resize',resize);
let previousSnake=[];function draw(t=0){if(!snake)return;const size=canvas.width/N,p=Math.min(1,(t-lastStep)/115);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#090b16';ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=snake.length-1;i>=0;i--){const cur=snake[i],old=previousSnake[i]||cur;let px=old.x+(cur.x-old.x)*p,py=old.y+(cur.y-old.y)*p;if(Math.abs(cur.x-old.x)>1)px=cur.x;if(Math.abs(cur.y-old.y)>1)py=cur.y;ctx.fillStyle=i===0?'#fff':'#4be0e3';const rad=size*.28;ctx.beginPath();ctx.roundRect(px*size+size*.07,py*size+size*.07,size*.86,size*.86,rad);ctx.fill()}if(food){ctx.fillStyle='#ff5db1';ctx.beginPath();ctx.arc(food.x*size+size/2,food.y*size+size/2,size*.3,0,Math.PI*2);ctx.fill()}if(running)anim=requestAnimationFrame(draw)}function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function startGame(){clearInterval(timer);cancelAnimationFrame(anim);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];previousSnake=snake.map(p=>({...p}));dir={x:1,y:0};next={...dir};score=0;scoreEl.textContent=0;running=true;statusEl.textContent='Go!';place();lastStep=performance.now();draw(lastStep);timer=setInterval(step,115)}
function setDir(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(!d||d.x===-dir.x&&d.y===-dir.y)return;next=d}
function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some((p,i)=>i>0&&p.x===h.x&&p.y===h.y))return gameOver();previousSnake=snake.map(p=>({...p}));snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;place()}else snake.pop();lastStep=performance.now();draw(lastStep)}
function gameOver(){clearInterval(timer);cancelAnimationFrame(anim);running=false;best=Math.max(best,score);localStorage.hpSnakeBest=best;bestEl.textContent=best;statusEl.textContent='Game over! '+score+' points.';hpSubmit('snake',score).then(ok=>{statusEl.textContent+=ok?' Score saved to leaderboard! 🏆':' Log in to save your score.'})}
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key])}});document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>setDir(x.dataset.d));
let sx=0,sy=0;board.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:false});board.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});board.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up')},{passive:false});
start.onclick=startGame;snake=[{x:10,y:10}];previousSnake=snake.map(p=>({...p}));dir={x:1,y:0};next=dir;food={x:15,y:10};resize();draw();
</script></body></html>
