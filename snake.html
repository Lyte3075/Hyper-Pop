<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Snake ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.snakebox{max-width:620px;margin:auto;overflow:hidden}.snake-board{width:min(100%,560px);height:auto;aspect-ratio:1/1;max-width:560px;margin:20px auto;touch-action:none;overscroll-behavior:none;background:#090b16;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 70px #0008}.snake-canvas{display:block;width:100%;height:100%;touch-action:none}.scoreline{text-align:center;font:14px "DM Mono";color:var(--muted)}.snake-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.pad{display:grid;grid-template-columns:repeat(3,62px);gap:7px;justify-content:center;margin:18px auto}.pad button{width:62px;height:50px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:#fff;font-size:20px}.pad .empty{visibility:hidden}.swipe{display:none;text-align:center;color:var(--muted);font:11px "DM Mono"}@media(max-width:699px){.swipe{display:block}}<style>
.snake-board{background:linear-gradient(#8bd35b 0 0);border-color:#72ad4d;box-shadow:0 20px 70px #0008,0 0 0 5px #ffffff08}
.statusrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px}.pill{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#ffffff08;font:11px "DM Mono";color:#aaa7c1}.pill b{color:#fff}.snake-board{position:relative}.pausemark{position:absolute;inset:0;display:none;place-items:center;background:#05050bcc;color:#fff;font:900 40px "Space Grotesk";z-index:2}.pausemark.show{display:grid}.flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:50}.flash.on{animation:snflash .22s}@keyframes snflash{50%{opacity:.12}}</style></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav><header class="hero"><div class="e">🐍</div><h1>Snake</h1><p>Eat the fruit, grow longer, and do not become your own problem.</p></header><main class="box snakebox"><div class="scoreline">SCORE <b id="score">0</b> · BEST <b id="best">0</b></div><div class="statusrow"><span class="pill">LEVEL <b id="level">1</b></span><span class="pill">COMBO <b id="combo">x1</b></span></div><div class="snake-board" id="board"><canvas class="snake-canvas" id="canvas"></canvas><div class="pausemark" id="pausemark">Ⅱ PAUSED</div></div><div class="snake-actions"><button class="btn" id="start">START / RESTART</button><button class="btn alt" id="pause">Ⅱ PAUSE</button><button class="btn alt" id="sound">🔊 SFX</button><a class="btn alt" href="leaderboard.html">🏆 LEADERBOARD</a></div><div class="pad"><button class="empty">·</button><button data-d="up">▲</button><button class="empty">·</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><div class="swipe">Swipe anywhere on the board to steer.</div><p id="status" class="result">Mobile: buttons or swipe. PC: WASD or Arrow Keys.</p></main></div><script src="app.js"></script><script>
const N=20,board=document.getElementById('board'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');let snake,dir,next,food,bonus,score,timer,running=false,paused=false,best=+(localStorage.hpSnakeBest||0),level=1,combo=1,comboUntil=0,lastStep=0,anim=0,audioCtx=null,soundOn=localStorage.hpSnakeSound!=='off';
function turnTone(){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type='sine';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(520,t+.055);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.075);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.09)}catch(e){}}function tone(f,d=.06){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}function resize(){const r=board.getBoundingClientRect(),d=Math.floor(Math.min(r.width,r.height)*devicePixelRatio);canvas.width=d;canvas.height=d}addEventListener('resize',resize);
let previousSnake=[];function draw(t=0){if(!snake)return;const size=canvas.width/(N+1.5),p=Math.min(1,(t-lastStep)/90);ctx.clearRect(0,0,canvas.width,canvas.height);
const grd=ctx.createLinearGradient(0,0,0,canvas.height);grd.addColorStop(0,'#9bdd68');grd.addColorStop(1,'#68b94e');ctx.fillStyle=grd;ctx.fillRect(0,0,canvas.width,canvas.height);
for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=(x+y)%2?'#ffffff08':'#00000008';ctx.fillRect(x*size,y*size,size,size)}
for(let i=snake.length-1;i>=0;i--){const cur=snake[i],old=previousSnake[i]||cur;let px=cur.x,py=cur.y;if(previousSnake[i]){px=old.x+(cur.x-old.x)*p;py=old.y+(cur.y-old.y)*p;if(Math.abs(cur.x-old.x)>1)px=cur.x;if(Math.abs(cur.y-old.y)>1)py=cur.y;}
const cx=px*size+size/2,cy=py*size+size/2,w=size*.78,h=size*.78;
ctx.fillStyle=i===0?'#2f8f3f':'#39a84a';ctx.fillRect(cx-w/2,cy-h/2,w,h);
if(i<snake.length-1){const n=snake[i+1],nx=n.x*size+size/2,ny=n.y*size+size/2;ctx.fillStyle='#39a84a';ctx.fillRect(Math.min(cx,nx)-w/2,Math.min(cy,ny)-h/2,Math.abs(nx-cx)+w,Math.abs(ny-cy)+h)}
if(i===0){ctx.fillStyle='#fff';const ex=cx+dir.x*size*.18,ey=cy+dir.y*size*.18;ctx.beginPath();ctx.arc(ex-dir.y*size*.15,ey+dir.x*size*.15,size*.09,0,Math.PI*2);ctx.arc(ex+dir.y*size*.15,ey-dir.x*size*.15,size*.09,0,Math.PI*2);ctx.fill();ctx.fillStyle='#173d1c';ctx.beginPath();ctx.arc(ex-dir.y*size*.15,ey+dir.x*size*.15,size*.04,0,Math.PI*2);ctx.arc(ex+dir.y*size*.15,ey-dir.x*size*.15,size*.04,0,Math.PI*2);ctx.fill()}}
if(food){ctx.fillStyle='#ef3f4f';ctx.beginPath();ctx.arc(food.x*size+size/2,food.y*size+size/2,size*.27,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7f2f35';ctx.fillRect(food.x*size+size*.56,food.y*size+size*.16,size*.08,size*.13)}if(running&&!paused)anim=requestAnimationFrame(draw)}function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function startGame(){clearInterval(timer);cancelAnimationFrame(anim);if(soundOn&&audioCtx&&audioCtx.state==='suspended')audioCtx.resume();snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];previousSnake=snake.map(p=>({...p}));dir={x:1,y:0};next={...dir};score=0;scoreEl.textContent=0;running=true;statusEl.textContent='Go!';place();lastStep=performance.now();draw(lastStep);timer=setInterval(step,90)}
function setDir(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(!d||d.x===-dir.x&&d.y===-dir.y)return;if(running&&!paused&&(d.x!==next.x||d.y!==next.y))turnTone();next=d}
function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some((p,i)=>i>0&&p.x===h.x&&p.y===h.y))return gameOver();previousSnake=snake.map(p=>({...p}));snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=combo;combo=Math.min(9,combo+1);comboUntil=Date.now()+1600;scoreEl.textContent=score;document.getElementById('combo').textContent='x'+combo;tone(520+combo*35);place();if(score%5===0){level++;document.getElementById('level').textContent=level;tone(900,.12)}}else snake.pop();if(Date.now()>comboUntil){combo=1;document.getElementById('combo').textContent='x1'}lastStep=performance.now();draw(lastStep)}
function gameOver(){clearInterval(timer);cancelAnimationFrame(anim);running=false;paused=false;best=Math.max(best,score);localStorage.hpSnakeBest=best;bestEl.textContent=best;statusEl.textContent='Game over! '+score+' points.';hpSubmit('snake',score).then(ok=>{statusEl.textContent+=ok?' Score saved to leaderboard! 🏆':' Log in to save your score.'})}
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key])}});document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>setDir(x.dataset.d));
let sx=0,sy=0;board.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY},{passive:false});board.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});board.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?'right':'left');else setDir(dy>0?'down':'up')},{passive:false});
start.onclick=()=>{try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){} startGame()};document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;document.getElementById('pausemark').classList.toggle('show',paused);document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';tone(paused?220:620);if(paused){cancelAnimationFrame(anim);draw(performance.now())}else{lastStep=performance.now();previousSnake=snake.map(p=>({...p}));draw(lastStep)}};document.getElementById('sound').onclick=()=>{soundOn=!soundOn;localStorage.hpSnakeSound=soundOn?'on':'off';document.getElementById('sound').textContent=soundOn?'🔊 SFX':'🔇 SFX';if(soundOn)tone(700)};start.onclick=startGame;snake=[{x:10,y:10}];previousSnake=snake.map(p=>({...p}));dir={x:1,y:0};next=dir;food={x:15,y:10};resize();draw();
</script></body></html>
