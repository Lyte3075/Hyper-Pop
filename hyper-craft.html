const STORAGE_KEY='hypercraft-discovered-v2';
function normalizeDiscovered(value){if(!Array.isArray(value))return [];return value.map(x=>Array.isArray(x)?{icon:String(x[0]||'✨'),name:String(x[1]||'').trim()}:x).filter(x=>x&&x.name&&x.icon)}
function loadDiscovered(){try{const current=normalizeDiscovered(JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'));const old=normalizeDiscovered(JSON.parse(localStorage.getItem('hypercraft-discovered')||'null'));const merged=[...base.map(([icon,name])=>({icon,name})),...old,...current];const seen=new Set();const result=merged.filter(x=>{const k=x.name.toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true});if(result.length){localStorage.setItem(STORAGE_KEY,JSON.stringify(result));return result}}catch(e){}return base.map(([icon,name])=>({icon,name}))}
let discovered=loadDiscovered(),s1=null,s2=null;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(discovered));return true}catch(e){return false}}
function keyOf(a,b){return [a.name.toLowerCase(),b.name.toLowerCase()].sort().join('+')}
function renderSlots(){for(const [id,v,n] of [['slot1',s1,1],['slot2',s2,2]]){const e=document.getElementById(id);if(v){e.classList.add('has');e.innerHTML='<span class="icon">'+v.icon+'</span><span class="name">'+v.name+'</span>'}else{e.classList.remove('has');e.textContent='Pick an element for slot '+n}}}
function render(){const q=document.getElementById('search').value.toLowerCase();const list=discovered.filter(x=>x.name.toLowerCase().includes(q));document.getElementById('count').textContent=discovered.length+' discovered element'+(discovered.length===1?'':'s');document.getElementById('grid').innerHTML=list.map((x,i)=>'<button class="element" data-i="'+discovered.indexOf(x)+'"><div class="icon">'+x.icon+'</div><div class="name">'+x.name+'</div></button>').join('');document.querySelectorAll('.element').forEach(e=>e.onclick=()=>pick(discovered[+e.dataset.i]));renderSlots()}

function showResult(icon,name,note){document.getElementById('result').innerHTML='<div class="icon">'+icon+'</div><div class="result-name">'+name+'</div><div class="result-note">'+note+'</div>'}
function localCombine(a,b){const r=recipes[keyOf(a,b)];if(r)return {icon:r[0],name:r[1],note:'Built-in recipe'};return null}
async function aiCombine(a,b){const t=localStorage.getItem('hyperpop_token');if(!t)return null;try{const r=await fetch('https://iapnejlttsqqefkpmelp.supabase.co/functions/v1/hypercraft-combine',{method:'POST',headers:{'Content-Type':'application/json','x-hyperpop-session':t},body:JSON.stringify({a:a.name,b:b.name})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.name)return null;return {icon:d.emoji||'✨',name:d.name,note:d.note||'Generated by AI'}}catch(e){return null}}async function combine(){if(!s1||!s2){showResult('❓','Pick two things first','Choose two discovered elements.');return}const a=s1,b=s2;const local=localCombine(a,b);if(local){showResult(local.icon,local.name,local.note);if(!discovered.some(x=>x.name.toLowerCase()===local.name.toLowerCase())){discovered.push({icon:local.icon,name:local.name});save()}s1=null;s2=null;render();return}showResult('🧠','Thinking...','No built-in formula matched, so Hyper-Craft is checking the AI.');const ai=await aiCombine(a,b);const r=ai;if(!r){showResult('❌','No sensible combination','Nothing established was found for those two things.');s1=null;s2=null;render();return}if(!discovered.some(x=>x.name.toLowerCase()===r.name.toLowerCase())){discovered.push({icon:r.icon,name:r.name});save()}showResult(r.icon,r.name,r.note);s1=null;s2=null;render()}
document.getElementById('combine').onclick=combine;document.getElementById('clear').onclick=()=>{s1=s2=null;renderSlots()};document.getElementById('search').oninput=render;
