const emojiPool=['✨','🌀','🔭','🧬','🧿','🌠','🪄','🧩','🛰️','🗿','🛠️','🎲','🎮','📡','🌐','💠','🔬','🌟','🧊','🔥','🌪️','🌈','🪐','👽','🤯','🧙','🏆','💫'];
const STORAGE_KEY='hypercraft-discovered-v2';
function esc(v){return String(v||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function recipeText(recipe){return recipe&&recipe.length===2?esc(recipe[0])+' + '+esc(recipe[1]):'Recipe not recorded yet';}
function findClosestRecipe(item){
  if(item&&item.recipe&&item.recipe.length===2)return item.recipe;
  const target=String(item&&item.name||'').toLowerCase();
  for(const [k,r] of Object.entries(recipes))if(String(r[1]).toLowerCase()===target){const p=k.split('+');return p.length===2?p:null}
  return null;
}
function showRecipe(item){
  const modal=document.getElementById('recipe-modal'), recipe=findClosestRecipe(item);
  document.getElementById('recipe-title').textContent=item.name;
  document.getElementById('recipe-result').textContent=item.icon;
  document.getElementById('recipe-line').textContent=recipe?recipeText(recipe)+' = '+item.name:'No recorded recipe for this discovery';
  document.getElementById('recipe-note').textContent=recipe?'This is the recipe Hyper-Craft recorded as the recipe used to discover it.':'Older discoveries may not have their original recipe saved. If a built-in recipe exists, the closest known one is shown.';
  modal.classList.add('show');modal.setAttribute('aria-hidden','false');
}
function closeRecipe(){const m=document.getElementById('recipe-modal');m.classList.remove('show');m.setAttribute('aria-hidden','true')}

function normalizeDiscovered(value){if(!Array.isArray(value))return [];return value.map(x=>Array.isArray(x)?{icon:String(x[0]||'✨'),name:String(x[1]||'').trim()}:x).filter(x=>x&&x.name&&x.icon).map(x=>({icon:String(x.icon),name:String(x.name).trim(),...(Array.isArray(x.recipe)?{recipe:[String(x.recipe[0]),String(x.recipe[1])]}:{})}))}
function loadDiscovered(){try{const current=normalizeDiscovered(JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'));const old=normalizeDiscovered(JSON.parse(localStorage.getItem('hypercraft-discovered')||'null'));const merged=[...base.map(([icon,name])=>({icon,name})),...old,...current];const seen=new Set();const result=merged.filter(x=>{const k=x.name.toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true});if(result.length){localStorage.setItem(STORAGE_KEY,JSON.stringify(result));return result}}catch(e){}return base.map(([icon,name])=>({icon,name}))}
let discovered=loadDiscovered(),s1=null,s2=null;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(discovered));return true}catch(e){return false}}
function exportProgress(){
  try{
    const payload={
      format:'hyper-craft-progress',
      version:2,
      exportedAt:new Date().toISOString(),
      elements:discovered.map(x=>({icon:x.icon,name:x.name,...(x.recipe?{recipe:x.recipe}: {})}))
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='hyper-craft-progress.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showResult('📤','Progress exported','Your discovered elements were saved to a JSON file.');
  }catch(e){showResult('❌','Export failed','Could not create the progress file.');}
}
function importProgress(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(String(reader.result||''));
      const incoming=normalizeDiscovered(
        Array.isArray(data)?data:(data&&Array.isArray(data.elements)?data.elements:null)
      );
      if(!incoming.length)throw new Error('No elements');
      const before=discovered.length;
      const byName=new Map(discovered.map(x=>[x.name.toLowerCase(),x]));
      for(const item of incoming){
        const key=item.name.toLowerCase();
        if(!byName.has(key))byName.set(key,{icon:item.icon,name:item.name,...(item.recipe?{recipe:item.recipe}:{})});
      }
      discovered=Array.from(byName.values());
      save();
      const added=discovered.length-before;
      showResult('📥','Progress imported',added?('Added '+added+' new discovery'+(added===1?'discovery':'discoveries')+'. Existing discoveries were kept.'):'Everything in that file was already discovered.');
      render();
    }catch(e){
      showResult('❌','Import failed','That file is not a valid Hyper-Craft progress JSON file.');
    }
  };
  reader.onerror=()=>showResult('❌','Import failed','The progress file could not be read.');
  reader.readAsText(file);
}
window.HYPERCRAFT_RECIPES=recipes;

function keyOf(a,b){return [a.name.toLowerCase(),b.name.toLowerCase()].sort().join('+')}
function renderSlots(){for(const [id,v,n] of [['slot1',s1,1],['slot2',s2,2]]){const e=document.getElementById(id);if(v){e.classList.add('has');e.innerHTML='<span class="icon">'+v.icon+'</span><span class="name">'+v.name+'</span>'}else{e.classList.remove('has');e.textContent='Pick an element for slot '+n}}}
function render(){const q=document.getElementById('search').value.toLowerCase();const list=discovered.filter(x=>x.name.toLowerCase().includes(q));document.getElementById('count').textContent=discovered.length+' discovered element'+(discovered.length===1?'':'s');document.getElementById('grid').innerHTML=list.map(x=>{const i=discovered.indexOf(x);return '<div class="element" data-i="'+i+'" tabindex="0"><button class="element-info" data-info="'+i+'" aria-label="Show recipe for '+esc(x.name)+'" title="View recipe">ⓘ</button><div class="icon">'+esc(x.icon)+'</div><div class="name">'+esc(x.name)+'</div></div>'}).join('');document.querySelectorAll('.element').forEach(e=>{e.onclick=ev=>{if(ev.target.closest('.element-info'))return;pick(discovered[+e.dataset.i])}});document.querySelectorAll('.element-info').forEach(e=>e.onclick=ev=>{ev.stopPropagation();showRecipe(discovered[+e.dataset.info])});renderSlots()}
function pick(x){if(!s1)s1=x;else if(!s2)s2=x;else{s1=x;s2=null}renderSlots()}
function showResult(icon,name,note){document.getElementById('result').innerHTML='<div class="icon">'+icon+'</div><div class="result-name">'+name+'</div><div class="result-note">'+note+'</div>'}
function localCombine(a,b){const r=recipes[keyOf(a,b)];if(r)return {icon:r[0],name:r[1],note:'From recipe',recipe:[a.name,b.name]};return null}
function aiCombine(a,b){return window.HyperCraftLocalAI?window.HyperCraftLocalAI.combine(a,b):null}
async function pollinationsCombine(a,b){
  try{
    const token=localStorage.getItem('hyperpop_token');
    if(!token)return null;
    const r=await fetch('https://iapnejlttsqqefkpmelp.supabase.co/functions/v1/hypercraft-combine',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-hyperpop-session':token},
      body:JSON.stringify({a:a.name,b:b.name})
    });
    const d=await r.json().catch(()=>null);
    if(!r.ok||!d||!d.name)return null;
    return {icon:d.emoji||'✨',name:d.name,note:'Cloud Generated',recipe:[a.name,b.name]};
  }catch(e){return null}
}
function addDiscovery(r,a,b){
  if(!r||!r.name)return;
  if(!discovered.some(x=>x.name.toLowerCase()===r.name.toLowerCase())){
    discovered.push({icon:r.icon,name:r.name,recipe:r.recipe||[a.name,b.name]});
    save();
  }
}
async function combine(){
  if(!s1||!s2){showResult('❓','Pick two things first','Choose two discovered elements.');return}
  const a=s1,b=s2;
  const local=localCombine(a,b);
  if(local){
    showResult(local.icon,local.name,local.note);
    addDiscovery(local,a,b);
    s1=null;s2=null;render();return;
  }
  showResult('🧠','Thinking...','Trying the local Hyper-Craft AI first.');
  /* The recipe database is the only product maker. Unknown pairs never invent an item. */
  showResult('❌','No recipe found','That combination is not in the Hyper-Craft recipe list yet.');
  s1=null;s2=null;render();
}
document.getElementById('combine').onclick=combine;document.getElementById('clear').onclick=()=>{s1=s2=null;renderSlots()};document.getElementById('export-progress').onclick=exportProgress;document.getElementById('import-progress').onclick=()=>document.getElementById('import-file').click();document.getElementById('import-file').onchange=e=>{importProgress(e.target.files&&e.target.files[0]);e.target.value=''};document.getElementById('search').oninput=render;
