<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0b16"><title>Hyper-Craft ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>
.craftbox{max-width:900px;margin:auto}.craft-top{display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative}.slot{min-height:120px;border:1px dashed #ffffff30;border-radius:18px;background:#ffffff06;display:grid;place-items:center;text-align:center;padding:15px;color:var(--muted)}.slot.has{border-style:solid;background:#ffffff0c;color:#fff}.slot .icon{font-size:45px;display:block}.slot .name{font-weight:700;margin-top:5px}.plus{text-align:center;font-size:28px;color:var(--cyan);margin:0;line-height:1;position:relative;z-index:2}.craft-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.craft-actions button{padding:12px 17px;border-radius:13px;border:1px solid var(--line);background:#fff;color:#111;font-weight:800}.craft-actions .secondary{background:#ffffff08;color:#fff}.result-card{text-align:center;padding:22px;border-radius:18px;background:linear-gradient(145deg,#201b38,#111121);border:1px solid #ffffff18;min-height:120px}.result-card .icon{font-size:50px}.result-name{font-size:25px;font-weight:800;margin-top:5px}.result-note{font:11px "DM Mono";color:var(--muted);margin-top:7px}.elements{margin-top:20px}.element-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:9px;max-height:430px;overflow:auto;padding:3px}.element{border:1px solid #ffffff15;background:#ffffff06;border-radius:14px;padding:12px 8px;color:#fff;text-align:center;cursor:pointer}.element:hover{border-color:#ffffff40;transform:translateY(-1px)}.element .icon{font-size:30px}.element .name{font-size:12px;margin-top:4px}.craft-search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:#fff;outline:none;margin:8px 0 12px}.count{text-align:center;color:var(--muted);font:11px "DM Mono";margin:10px}.ai-settings{margin-top:18px;border-top:1px solid #ffffff12;padding-top:15px}.ai-settings summary{cursor:pointer;color:var(--cyan);font-weight:700}.ai-settings input{width:100%;margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:#fff}.hint{color:var(--muted);font-size:11px;line-height:1.5;margin-top:7px}@media(max-width:580px){.craft-top{grid-template-columns:1fr}.plus{margin:-3px 0}.element-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.element{padding:10px 5px}}
</style></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav><header class="hero"><div class="e">🧪</div><h1>Hyper-Craft</h1><p>Combine two things. Discover something new. Keep going until your tiny universe becomes enormous.</p></header><main class="box craftbox">
<div class="craft-top"><button id="slot1" class="slot">Pick an element for slot 1</button><button id="slot2" class="slot">Pick an element for slot 2</button><div class="plus">＋</div></div>
<div id="result" class="result-card"><div class="icon">✨</div><div class="result-name">What will you make?</div><div class="result-note">Choose two elements, then combine them.</div></div>
<div class="craft-actions"><button id="combine">⚡ Combine</button><button id="clear" class="secondary">↻ Clear slots</button></div>
<div class="elements"><input id="search" class="craft-search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Search discovered elements... 🔎"><div id="count" class="count"></div><div id="grid" class="element-grid"></div></div>

</main></div><script src="app.js"></script><script>
const base=[
['🌍','Earth'],['💧','Water'],['🔥','Fire'],['💨','Air']
];
const recipes={
'fire+water':['🌫️','Steam'],'earth+water':['🌱','Plant'],'earth+fire':['🌋','Lava'],'fire+wind':['💨','Smoke'],'water+wind':['🌊','Wave'],'water+earth':['🟫','Mud'],'lava+water':['🪨','Stone'],'lava+earth':['🌋','Volcano'],'rain+earth':['🌱','Plant'],'cloud+water':['🌧️','Rain'],'snow+water':['❄️','Ice'],'sun+plant':['🌳','Tree'],'plant+earth':['🌳','Tree'],'tree+human':['🧑','Woodworker'],'human+machine':['🤖','Cyborg'],'metal+energy':['⚡','Electricity'],'metal+magnet':['🧲','Magnet'],'star+space':['🌌','Galaxy'],'planet+space':['🪐','Solar System'],'sun+moon':['🌗','Eclipse'],'life+stone':['🐾','Animal'],'life+water':['🐟','Fish'],'life+air':['🐦','Bird'],'bird+wind':['🦅','Eagle'],'fish+water':['🐋','Whale'],'cat+human':['🐱','Pet'],'dog+human':['🐶','Pet'],'plant+rain':['🌺','Garden'],'tree+house':['🏠','Treehouse'],'house+city':['🏙️','Neighborhood'],'city+car':['🚦','Traffic'],'car+energy':['🚗','Electric Car'],'computer+internet':['🌐','Web'],'phone+internet':['📱','Smartphone'],'computer+game':['👾','Video Game'],'knowledge+computer':['🧠','Artificial Intelligence'],'idea+machine':['⚙️','Invention'],'science+magic':['🔮','Alchemy'],'art+music':['🎭','Performance'],'love+music':['🎵','Song'],'fire+metal':['🔩','Forge'],'stone+metal':['🔧','Tool'],'bread+cheese':['🥪','Sandwich'],'apple+tree':['🍎','Apple Tree'],'coffee+ice cream':['🥤','Frappé'],'cake+ice cream':['🍨','Dessert'],'pizza+fire':['🍕','Hot Pizza'],'mountain+snow':['🏔️','Snow Mountain'],'island+water':['🏝️','Island'],'island+volcano':['🌋','Volcanic Island'],'castle+magic':['🏰','Enchanted Castle'],'ufo+space':['👽','Alien'],'rocket+space':['🚀','Spaceship'],'internet+game':['🎮','Online Game'],'time+machine':['⏳','Time Machine'],'mind+idea':['💡','Thought'],'rainbow+water':['🌈','Prism'],'crystal+magic':['💎','Magic Crystal']
};
const emojiPool=['✨','🌀','🔭','🧬','🧿','🌠','🪄','🧩','🛰️','🗿','🛠️','🎲','🎮','📡','🌐','💠','🔬','🌟','🧊','🔥','🌪️','🌈','🪐','👽','🤯','🧙','🏆','💫'];
const STORAGE_KEY='hypercraft-discovered-v2';
function loadDiscovered(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(Array.isArray(saved)&&saved.length)return saved.filter(x=>x&&typeof x.name==='string'&&typeof x.icon==='string');const old=JSON.parse(localStorage.getItem('hypercraft-discovered')||'null');if(Array.isArray(old)&&old.length)return old.filter(x=>x&&typeof x.name==='string'&&typeof x.icon==='string')}catch(e){}return base.map(([icon,name])=>({icon,name}))}
let discovered=loadDiscovered(),s1=null,s2=null;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(discovered));return true}catch(e){return false}}
function keyOf(a,b){return [a.name.toLowerCase(),b.name.toLowerCase()].sort().join('+')}
function renderSlots(){for(const [id,v,n] of [['slot1',s1,1],['slot2',s2,2]]){const e=document.getElementById(id);if(v){e.classList.add('has');e.innerHTML='<span class="icon">'+v.icon+'</span><span class="name">'+v.name+'</span>'}else{e.classList.remove('has');e.textContent='Pick an element for slot '+n}}}
function render(){const q=document.getElementById('search').value.toLowerCase();const list=discovered.filter(x=>x.name.toLowerCase().includes(q));document.getElementById('count').textContent=discovered.length+' discovered element'+(discovered.length===1?'':'s');document.getElementById('grid').innerHTML=list.map((x,i)=>'<button class="element" data-i="'+discovered.indexOf(x)+'"><div class="icon">'+x.icon+'</div><div class="name">'+x.name+'</div></button>').join('');document.querySelectorAll('.element').forEach(e=>e.onclick=()=>pick(discovered[+e.dataset.i]));renderSlots()}
function pick(x){if(!s1)s1=x;else if(!s2)s2=x;else{s1=x;s2=null}renderSlots()}
function showResult(icon,name,note){document.getElementById('result').innerHTML='<div class="icon">'+icon+'</div><div class="result-name">'+name+'</div><div class="result-note">'+note+'</div>'}
function localCombine(a,b){const r=recipes[keyOf(a,b)];if(r)return {icon:r[0],name:r[1],note:'Built-in recipe'};return null}
async function aiCombine(a,b){const t=localStorage.getItem('hyperpop_token');if(!t)return null;try{const r=await fetch('https://iapnejlttsqqefkpmelp.supabase.co/functions/v1/hypercraft-combine',{method:'POST',headers:{'Content-Type':'application/json','x-hyperpop-session':t},body:JSON.stringify({a:a.name,b:b.name})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.name)return null;return {icon:d.emoji||'✨',name:d.name,note:d.note||'Generated by AI'}}catch(e){return null}}async function combine(){if(!s1||!s2){showResult('❓','Pick two things first','Choose two discovered elements.');return}const a=s1,b=s2;showResult('🧠','Thinking...','The combination engine is working.');const ai=await aiCombine(a,b);const r=ai||localCombine(a,b);if(!r){showResult('❌','No sensible combination','Nothing established was found for those two things.');s1=null;s2=null;render();return}if(!discovered.some(x=>x.name.toLowerCase()===r.name.toLowerCase())){discovered.push({icon:r.icon,name:r.name});save()}showResult(r.icon,r.name,r.note);s1=null;s2=null;render()}
document.getElementById('combine').onclick=combine;document.getElementById('clear').onclick=()=>{s1=s2=null;renderSlots()};document.getElementById('search').oninput=render;document.getElementById('saveKey').onclick=()=>{const k=document.getElementById('key').value.trim();if(k)localStorage.setItem('hypercraft-ai-key',k);document.getElementById('key').value='';document.querySelector('.ai-settings .hint').textContent=k?'AI key saved in this browser.':'No key saved. Built-in mode remains active.'};if(localStorage.getItem('hypercraft-ai-key'))document.querySelector('.ai-settings .hint').textContent='AI mode is enabled for this browser. Your key is stored locally.';
document.getElementById('search').value='';
requestAnimationFrame(()=>render());
setTimeout(render,50);
setTimeout(render,250);
</script></body></html>
