<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Maze of Shadows</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050608;color:#eee;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#35151d 0,#100b11 42%,#030405 78%);z-index:-2}body:after{content:"";position:fixed;inset:0;opacity:.18;z-index:-1;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:42px 42px}.shell{width:min(900px,94vw);padding:30px 0 45px}.brand{text-align:center;margin:8vh auto 42px}.eyebrow{color:#ff656b;letter-spacing:.38em;font-size:.72rem;font-weight:800}.brand h1{font-size:clamp(2.8rem,9vw,6.5rem);line-height:.92;letter-spacing:-.07em;margin:15px 0;text-shadow:0 0 35px #ed1d3855}.brand h1 span{color:#ff454f}.brand p{color:#aaa;letter-spacing:.18em;font-size:.78rem}.btn{display:block;width:min(360px,100%);margin:12px auto;padding:15px 20px;border:1px solid #ff4d5b;background:#a50e20;color:white;text-transform:uppercase;letter-spacing:.18em;font-weight:850;border-radius:5px;cursor:pointer;font-size:.9rem}.btn.secondary{background:#101115;border-color:#555}.panel{display:none;margin:25px auto;padding:22px;border:1px solid #ffffff20;background:#090a0ddd;border-radius:10px;max-width:680px;box-shadow:0 20px 80px #0009}.panel.show{display:block}.panel h2{margin:0 0 18px;letter-spacing:.12em;font-size:1rem}.chapters,.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.chapter,.slot{min-height:150px;padding:16px;border:1px solid #ffffff24;border-radius:7px;background:#111217;color:#eee;text-align:left}.chapter h3{margin:10px 0 6px}.chapter p,.slot p{font-size:.8rem;color:#aaa;line-height:1.5}.chapter .num{color:#ff626d;font-size:.75rem;letter-spacing:.2em}.chapter:disabled{opacity:.38;filter:grayscale(1)}.chapter:not(:disabled),.slot button{cursor:pointer}.slot{min-height:130px}.slot strong{display:block;margin-bottom:8px}.slot button{margin-top:8px;padding:8px 10px;background:#211116;border:1px solid #b83a48;color:#fff;border-radius:4px}.hint{color:#888;text-align:center;font-size:.75rem;margin:22px 0}.back{background:transparent;border:0;color:#bbb;cursor:pointer;padding:10px 0}@media(max-width:600px){.chapters,.slots{grid-template-columns:1fr}.chapter{min-height:unset}.brand{margin-top:5vh}.panel{padding:16px}}
</style></head><body><main class="shell"><div class="brand"><div class="eyebrow">A SURVIVAL HORROR EXPERIENCE</div><h1>MAZE OF<br><span>SHADOWS</span></h1><p>THE DARKNESS REMEMBERS.</p><button class="btn" id="play">Play</button><button class="btn secondary" id="continue">Continue</button></div>
<section class="panel" id="chapterPanel"><h2>SELECT CHAPTER</h2><div class="chapters" id="chapters"></div><p class="hint">Complete a chapter to unlock the next. Your progress saves on this device.</p><button class="back" data-back>← Main menu</button></section>
<section class="panel" id="savePanel"><h2>SAVE SLOTS</h2><div class="slots" id="slots"></div><button class="back" data-back>← Back</button></section></main>
<script>
const KEY='mosCampaignV1',SLOTS='mosSaveSlotsV1';const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};let campaign=read(KEY,{unlocked:1,beaten:[],lastChapter:1}),slots=read(SLOTS,[null,null,null]);function persist(){localStorage.setItem(KEY,JSON.stringify(campaign));localStorage.setItem(SLOTS,JSON.stringify(slots))}
const chapterData=[{title:'The Original Maze',desc:'Find nine keys. Survive what hunts you.',file:'maze-of-shadows.html'},{title:'The Grass Maze',desc:'Find nine fuel canisters, reach the parking lot, and escape by car.',file:'maze-of-shadows-chapter2.html'},{title:'The Deepest Dark',desc:'A new nightmare awaits. (Locked chapter)',file:''}];
function show(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));if(id)document.getElementById(id).classList.add('show')}
function renderChapters(){const el=document.getElementById('chapters');el.innerHTML='';chapterData.forEach((c,i)=>{const n=i+1,unlocked=n<=campaign.unlocked;const b=document.createElement('button');b.className='chapter';b.disabled=!unlocked||!c.file;b.innerHTML='<span class="num">CHAPTER 0'+n+'</span><h3>'+c.title+'</h3><p>'+c.desc+'</p><small>'+(campaign.beaten.includes(n)?'✓ COMPLETED':unlocked?'UNLOCKED':'🔒 COMPLETE CHAPTER '+(n-1))+'</small>';b.onclick=()=>{if(c.file)location.href=c.file};el.appendChild(b)})}
function renderSlots(){const el=document.getElementById('slots');el.innerHTML='';slots.forEach((s,i)=>{const card=document.createElement('div');card.className='slot';card.innerHTML='<strong>SLOT '+(i+1)+'</strong>'+(s?'<p>Chapter '+s.chapter+' · '+new Date(s.savedAt).toLocaleString()+'<br>Health: '+s.health+'% · Flashlight: '+s.battery+'%<br>Inventory: '+(s.inventory||'Empty')+'</p>':'<p>Empty save slot</p>');if(s){const load=document.createElement('button');load.textContent='Load save';load.onclick=()=>{campaign.lastChapter=s.chapter;persist();location.href=chapterData[s.chapter-1].file+'?loadSlot='+(i+1)};card.appendChild(load);const del=document.createElement('button');del.textContent='Delete';del.onclick=()=>{slots[i]=null;persist();renderSlots()};card.appendChild(del)}el.appendChild(card)})}
document.getElementById('play').onclick=()=>{renderChapters();show('chapterPanel')};document.getElementById('continue').onclick=()=>{renderChapters();renderSlots();show('savePanel')};document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show(null));renderChapters();persist();
</script></body></html>
