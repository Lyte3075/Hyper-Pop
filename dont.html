<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0b16"><title>Do Not Press ✦ Hyper-Pop</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{touch-action:manipulation;-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,var(--c)33,transparent 35%),#0b0b16;color:#f7f4ff;font:16px system-ui,sans-serif}button,input{font:inherit;touch-action:manipulation}button{cursor:pointer}.w{max-width:850px;margin:auto;padding:0 18px}nav{height:72px;display:flex;justify-content:space-between;align-items:center}.back{color:#aaa7c1}.logo{font-weight:800}.hero{text-align:center;padding:55px 0 30px}.hero .e{font-size:60px}.hero h1{font-size:clamp(42px,9vw,76px);letter-spacing:-.06em;margin:12px 0}.hero p{color:#aaa7c1}.box{margin:15px 0 60px;padding:25px;border:1px solid #ffffff18;background:#151526;border-radius:24px;box-shadow:0 25px 70px #0008}.big{font:500 55px monospace;text-align:center;margin:20px 0}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{padding:12px 16px;border-radius:12px;border:1px solid #ffffff18;background:#fff;color:#111;font-weight:800}.dark{background:#ffffff08;color:#fff}.result{text-align:center;color:var(--c);font-weight:700;margin-top:14px;min-height:24px}.counter{text-align:center;color:#aaa7c1;font:13px monospace;margin-top:12px}.danger{position:relative;overflow:hidden}.big{transition:transform .12s}.big.shake{animation:shake .28s ease}@keyframes shake{20%{transform:translateX(-9px) rotate(-3deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}100%{transform:none}}.btn{transition:transform .1s,box-shadow .1s}.btn:active{transform:scale(.94)}.btn.hot{animation:hot .35s ease}@keyframes hot{40%{transform:scale(1.12);box-shadow:0 0 35px #ff5db188}}.spark{position:fixed;pointer-events:none;font-size:25px;animation:fly .75s ease-out forwards;z-index:20}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(180deg) scale(.4);opacity:0}}.screen{animation:screen .22s ease}@keyframes screen{50%{filter:brightness(1.7) saturate(1.5)}}.foot{text-align:center;color:#66647a;font:11px monospace;padding-bottom:35px}</style><link rel="stylesheet" href="style.css"></head><body style="--c:#ff5db1"><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav><header class="hero"><div class="e">🚨</div><h1>Do Not Press</h1><p>One tiny thing. One whole page. Zero productivity required.</p></header><main class="box"><div class="big" id="icon">🚫</div><div class="actions"><button class="btn" id="x">DO NOT PRESS</button><button class="btn dark" id="reset">↻ RESET</button></div><div class="result" id="r">Seriously.</div><div class="counter" id="count">Presses: 0 • Danger: 0%</div>
<script>
let presses=Number(localStorage.getItem("hyperpop-dont-presses")||0);
let danger=Number(localStorage.getItem("hyperpop-dont-danger")||0);
let audioCtx=null,soundOn=localStorage.getItem("hyperpop-dont-sound")!=="off";
const $=id=>document.getElementById(id);
function sfx(kind){
 if(!soundOn)return;
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  const cfg=kind==="danger"?[120,.22,"sawtooth",.09]:kind==="reset"?[260,.12,"square",.045]:[420+Math.min(presses,30)*12,.07,"triangle",.065];
  o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],now);
  o.frequency.exponentialRampToValueAtTime(cfg[0]*1.7,now+cfg[1]);
  g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(cfg[3],now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+cfg[1]);
  o.connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+cfg[1]+.02);
 }catch(e){}
}
function burst(){
 const icons=["💥","⚡","🚨","✨","🔥"];
 for(let i=0;i<8;i++){
  const e=document.createElement("span");e.className="spark";e.textContent=icons[i%icons.length];
  e.style.left="50%";e.style.top="45%";e.style.setProperty("--x",(Math.random()*260-130)+"px");e.style.setProperty("--y",(Math.random()*240-120)+"px");
  document.body.append(e);setTimeout(()=>e.remove(),750);
 }
}
function render(){$("count").textContent="Presses: "+presses+" • Danger: "+Math.min(100,danger)+"%"}
function unlockCommandPrompt(){localStorage.setItem("hyperpop-command-prompt-unlocked","1");if(window.HyperPopCommandPrompt?.unlock)window.HyperPopCommandPrompt.unlock();}\nfunction press(){
 presses++;danger=Math.min(100,danger+Math.max(1,Math.floor(presses/10)));\n if(danger>=100){danger=100;unlockCommandPrompt();}
 localStorage.setItem("hyperpop-dont-presses",presses);localStorage.setItem("hyperpop-dont-danger",danger);
 const messages=presses<5?["I warned you.","Seriously.","You pressed it again.","This is becoming a habit."]:presses<15?["STOP.","The button is judging you.","You have chosen chaos.","🚨 BOOP DETECTED 🚨"]:presses<30?["THE DANGER IS RISING.","Why are you like this?","⚠️ BUTTON ANGER: INCREASING ⚠️"]:["💀 YOU HAVE UNLEASHED THE BUTTON.","🚨🚨🚨 BAD IDEA DETECTED 🚨🚨🚨","THE BUTTON KNOWS YOUR SECRETS.","RUN. JUST RUN."];
 $("r").textContent=messages[Math.floor(Math.random()*messages.length)];
 $("icon").textContent=presses%10===0?"💥":presses%5===0?"⚠️":"🚫";
 $("x").classList.remove("hot");void $("x").offsetWidth;$("x").classList.add("hot");
 $("icon").classList.remove("shake");void $("icon").offsetWidth;$("icon").classList.add("shake");
 document.body.classList.remove("screen");void document.body.offsetWidth;document.body.classList.add("screen");
 sfx(presses%10===0?"danger":"click");if(presses%3===0)burst();render();
}
$("x").onclick=press;
$("reset").onclick=()=>{sfx("reset");localStorage.removeItem("hyperpop-dont-presses");localStorage.removeItem("hyperpop-dont-danger");presses=0;danger=0;$("r").textContent="Seriously.";render()};
render();
</script></main><footer class="foot">Hyper-Pop ✦ tiny internet, big vibes</footer></div><script>document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});</script><script src="app.js"></script></body></html>
