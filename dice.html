<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0b16"><title>Decision Dice ✦ Hyper-Pop</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{touch-action:manipulation;-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,var(--c)33,transparent 35%),#0b0b16;color:#f7f4ff;font:16px system-ui,sans-serif}button,input{font:inherit;touch-action:manipulation}button{cursor:pointer}.w{max-width:850px;margin:auto;padding:0 18px}nav{height:72px;display:flex;justify-content:space-between;align-items:center}.back{color:#aaa7c1}.logo{font-weight:800}.hero{text-align:center;padding:55px 0 30px}.hero .e{font-size:60px}.hero h1{font-size:clamp(42px,9vw,76px);letter-spacing:-.06em;margin:12px 0}.hero p{color:#aaa7c1}.box{margin:15px 0 60px;padding:25px;border:1px solid #ffffff18;background:#151526;border-radius:24px;box-shadow:0 25px 70px #0008}.big{font:500 55px monospace;text-align:center;margin:20px 0}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{padding:12px 16px;border-radius:12px;border:1px solid #ffffff18;background:#fff;color:#111;font-weight:800}.dark{background:#ffffff08;color:#fff}.result{text-align:center;color:var(--c);font-weight:700;margin-top:14px}.foot{text-align:center;color:#66647a;font:11px monospace;padding-bottom:35px}</style><link rel="stylesheet" href="style.css"></head><body style="--c:#9b7bff"><div class="w"><nav class="hp-page-nav"><a class="logo" href="index.html">✦ Hyper-Pop</a><div id="account-slot"></div></nav><header class="hero"><div class="e">🎲</div><h1>Decision Dice</h1><p>One tiny thing. One whole page. Zero productivity required.</p></header><main class="box"><div class="big" id="d">—</div><div class="actions"><button class="btn" onclick="roll(1)">ROLL 1</button><button class="btn" onclick="roll(3)">ROLL 3</button><button class="btn dark" onclick="d.textContent='D20 → '+(1+Math.floor(Math.random()*20))">D20</button></div><div class="result">Let fate handle it.</div><script>function roll(n){let a=Array.from({length:n},()=>1+Math.floor(Math.random()*6));d.textContent=a.join(" + ")+" = "+a.reduce((x,y)=>x+y,0)}</script></main><footer class="foot">Hyper-Pop ✦ tiny internet, big vibes</footer></div><script>document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});</script><script src="app.js"></script></body></html>
