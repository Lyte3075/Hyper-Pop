<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Memory Flash ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a></nav><header class="hero"><div class="e">🧠</div><h1>Memory Flash</h1><p>Remember the glowing sequence, then repeat it.</p></header><main class="box" style="text-align:center"><div id="seq" style="font:500 32px 'DM Mono';min-height:50px"></div><input id="i" placeholder="enter sequence, e.g. 2413" inputmode="numeric" style="padding:13px;border-radius:12px;border:1px solid var(--line);background:#ffffff08;color:#fff;text-align:center"><button class="btn" id="s">START</button><div class="result" id="r"></div></main></div><script src="app.js"></script><script>let a=[];s.onclick=()=>{a=Array.from({length:5},()=>1+Math.floor(Math.random()*4));seq.textContent=a.join('');i.value='';r.textContent='Memorize…';setTimeout(()=>{seq.textContent='???';i.focus()},1800)};i.oninput=()=>{if(i.value.length===5){let x=Math.round(performance.now());let ok=i.value===a.join('');r.textContent=ok?'Correct! 🧠':'Not quite!';if(ok)hpSubmit('memory',x%100000)}};</script></body></html>
