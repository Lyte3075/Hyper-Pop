<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Name Forge ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.tool{max-width:720px;margin:auto}.panel{padding:22px;background:#ffffff08;border:1px solid #ffffff18;border-radius:24px}.out{padding:20px;border-radius:18px;background:#0b0b16;border:1px solid #ffffff12;font:700 20px "DM Mono";text-align:center;word-break:break-word;min-height:70px;display:grid;place-items:center}.btn{border:0;border-radius:13px;padding:13px 18px;background:#f7f4ff;color:#11111f;font-weight:800;cursor:pointer;margin:5px}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.input{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;font-size:16px;margin-bottom:10px}.hint{text-align:center;color:#aaa7c1;margin:12px}.pop{animation:pop .18s}@keyframes pop{50%{transform:scale(1.05)}}</style></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><div id="account-slot"></div></nav><header class="hero"><div class="e">🪪</div><h1>Name Forge</h1><p>Generate absurd, heroic, suspicious, or surprisingly good names.</p></header><main class="box tool"><div class="panel"><div class="out" id="out">Your next identity awaits.</div><div class="row"><button class="btn" id="gen">FORGE NAME ✨</button></div><div class="hint">Choose a vibe</div><div class="row" id="vibes"></div></div></main></div><script src="app.js"></script><script>const sets={chaos:["Pixel","Turbo","Goblin","Cosmic","Waffle","Neon","Quantum","Button","Laser","Captain"],hero:["Nova","Atlas","Riven","Orion","Vega","Astra","Echo","Blaze","Kai","Sol"],weird:["Spork","Banana","Crouton","Toaster","Sock","Moth","Chair","Pickle","Noodle","Goose"]};let vibe="chaos",audio;const $=id=>document.getElementById(id);function s(f=500,d=.06){try{audio=audio||new AudioContext();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}Object.keys(sets).forEach(v=>{let b=document.createElement("button");b.className="btn";b.textContent=v.toUpperCase();b.onclick=()=>{vibe=v;s(650);document.querySelectorAll("#vibes .btn").forEach(x=>x.classList.remove("pop"));b.classList.add("pop")};$("vibes").append(b)});$("gen").onclick=()=>{let a=sets[vibe],n=a[Math.floor(Math.random()*a.length)]+" "+a[Math.floor(Math.random()*a.length)]+" "+["X","3000","Prime","Ultra","Supreme",".exe"][Math.floor(Math.random()*6)];$("out").textContent=n;$("out").classList.add("pop");setTimeout(()=>$("out").classList.remove("pop"),180);s(520+Math.random()*500,.08)}</script></body></html>
