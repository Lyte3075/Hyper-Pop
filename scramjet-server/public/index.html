<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080811">
<title>Hyper-Pop Browser</title>
<style>
:root{color-scheme:dark;--bg:#080811;--panel:#151522;--line:#ffffff20;--cyan:#4be0e3;--pink:#ff5db1;--purple:#9b7bff}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:#f8f7ff}.shell{height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 15% 0,#32204a,transparent 40%),radial-gradient(ellipse at 90% 0,#063e45,transparent 35%),var(--bg)}header{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:#090912cc}.logo{font-weight:850;font-size:20px;white-space:nowrap}.logo span{background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));color:transparent;background-clip:text}.tools{display:flex;gap:7px;align-items:center;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}button,input{font:inherit}.tools button{height:40px;min-width:40px;border:1px solid var(--line);border-radius:10px;background:#ffffff0a;color:white;cursor:pointer}.tools input{height:42px;min-width:0;flex:1;border:1px solid var(--line);border-radius:11px;background:#080810;color:white;padding:0 13px;outline:none}.tools input:focus{border-color:var(--purple)}#go{padding:0 17px;background:linear-gradient(110deg,var(--cyan),#b5a1ff,var(--pink));color:#10101a;border:0;font-weight:800}.status{padding:6px 12px;color:#aaa7c1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame{flex:1;min-height:0;background:white}.frame iframe{height:100%;width:100%;border:0;background:white}.home{height:100%;overflow:auto;display:grid;place-items:center;text-align:center;padding:24px}.content{width:min(660px,100%);padding:35px 0}.spark{color:var(--cyan);letter-spacing:13px;font-size:23px}.content h1{font-size:clamp(38px,8vw,66px);letter-spacing:-.06em;margin:8px 0}.content h1 span{background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));color:transparent;background-clip:text}.content p{color:#b5b1cb;line-height:1.65}.note{font-size:12px!important;color:#8f8aa8!important;margin-top:25px}.hidden{display:none!important}@media(max-width:560px){header{padding:10px}.tools{gap:5px;padding:7px}.tools button{min-width:35px;width:35px}.tools input{font-size:13px}.content{padding:18px 0}}
</style>
</head>
<body>
<div class="shell">
<header><div class="logo">Hyper<span>✦Pop</span></div><div style="flex:1"></div><button id="homeBtn" type="button" aria-label="Home">⌂</button></header>
<div class="tools"><button id="back" type="button" title="Back">‹</button><button id="forward" type="button" title="Forward">›</button><button id="reload" type="button" title="Reload">↻</button><input id="address" autocomplete="url" spellcheck="false" placeholder="Search or enter a website address"><button id="go" type="button">Go ↗</button></div>
<div class="status" id="status">Scramjet is initializing…</div>
<main class="frame" id="frame"><section class="home" id="home"><div class="content"><div class="spark">✦ ✧ ✦</div><h1>Curiosity, <span>go.</span></h1><p>Search for something interesting or enter a website address to open it in the Hyper-Pop browser.</p><form id="search"><div style="display:flex;gap:8px;margin-top:22px"><input id="query" aria-label="Search or enter a website" placeholder="Try example.com or a search query" style="flex:1;min-width:0;padding:14px;border:1px solid var(--line);border-radius:12px;background:#141421;color:white"><button id="searchGo" style="padding:0 17px;border:0;border-radius:12px;background:linear-gradient(110deg,var(--cyan),#b5a1ff,var(--pink));font-weight:800;color:#111">Search</button></div></form><p class="note">Experimental browser engine. Some sites may still block proxy traffic. This free deployment may sleep when idle.</p></div></section></main>
</div>
<script src="/scram/scramjet.all.js"></script>
<script src="/baremux/index.js"></script>
<script>
const $=id=>document.getElementById(id), address=$("address"), status=$("status"), frameHost=$("frame"), homePage=$("home");
let frame=null, controller=null, history=[], position=-1;
function normalize(value){value=value.trim();if(!value)return "";try{return new URL(value).href}catch{}if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(value))return "https://"+value;return "https://www.google.com/search?q="+encodeURIComponent(value)}
async function init(){try{if(!navigator.serviceWorker)throw new Error("This browser does not support service workers.");await navigator.serviceWorker.register("/sw.js");const { ScramjetController } = $scramjetLoadController();controller=new ScramjetController({files:{wasm:"/scram/scramjet.wasm.wasm",all:"/scram/scramjet.all.js",sync:"/scram/scramjet.sync.js"}});await controller.init();const connection=new BareMux.BareMuxConnection("/baremux/worker.js");const ws=(location.protocol==="https:"?"wss://":"ws://")+location.host+"/wisp/";await connection.setTransport("/libcurl/index.mjs",[{websocket:ws}]);status.textContent="Ready · Scramjet engine initialized"}catch(e){status.textContent="Setup error: "+(e.message||String(e))}}
async function go(value,push=true){const url=normalize(value);if(!url)return;address.value=url;status.textContent="Opening "+url;try{if(!controller)await init();if(!controller)throw new Error("Scramjet could not initialize");if(frame)frame.remove();homePage.classList.add("hidden");frame=controller.createFrame();frame.frame.style.width="100%";frame.frame.style.height="100%";frame.frame.style.border="0";frame.frame.title="Hyper-Pop proxied website";frameHost.appendChild(frame.frame);frame.go(url);if(push){history=history.slice(0,position+1);history.push(url);position=history.length-1}status.textContent="Opened "+new URL(url).hostname}catch(e){status.textContent="Could not open page: "+(e.message||String(e))}}
$("go").onclick=()=>go(address.value);$("search").addEventListener("submit",e=>{e.preventDefault();go($("query").value)});address.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go(address.value)}});$("homeBtn").onclick=()=>{if(frame)frame.remove();frame=null;homePage.classList.remove("hidden");status.textContent="New tab";address.value=""};$("reload").onclick=()=>{if(position>=0)go(history[position],false)};$("back").onclick=()=>{if(position>0){position--;go(history[position],false)}};$("forward").onclick=()=>{if(position<history.length-1){position++;go(history[position],false)}};init();
</script>
</body>
</html>
