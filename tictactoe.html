<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tic-Tac-Toe ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.modegrid,.modgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{padding:12px;border:1px solid var(--line);border-radius:14px;background:#ffffff07;color:#fff;text-align:left;cursor:pointer}.choice.active{border-color:var(--cyan);background:#4be0e315}.choice b{display:block}.choice small{color:var(--muted)}.board3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:390px;margin:20px auto}.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:16px;background:#ffffff07;color:#fff;font-size:clamp(40px,12vw,70px);font-weight:700;cursor:pointer}.cell.x{color:var(--pink)}.cell.o{color:var(--cyan)}.paneltitle{margin:24px 0 10px;font-size:14px;color:var(--muted)}.daily{border:1px solid #ffe66d55;background:#ffe66d0b;padding:14px;border-radius:15px;margin-bottom:14px}.status{text-align:center;min-height:24px;color:var(--yellow);font-weight:700}.timer{text-align:center;color:var(--cyan);font:12px "DM Mono";min-height:18px}.swapbtn{display:none;margin:8px auto 0}.resultbox{margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:14px;text-align:center;color:var(--muted)}@media(max-width:500px){.modegrid,.modgrid{grid-template-columns:1fr}}</style></head><body><div class="w"><nav class="hp-page-nav"><a class="logo" href="index.html">← Hyper-Pop</a><div id="account-slot"></div></nav><header class="hero"><div class="e">⭕</div><h1>Tic-Tac-Toe</h1><p>Strong bots, extra modes, daily rule combos, and proper round endings.</p></header><main class="box"><div class="daily"><b>🌟 Daily Challenge</b><br><span id="daily"></span></div><div class="paneltitle">GAME MODE</div><div class="modegrid" id="modes"><button class="choice active" data-mode="easy"><b>🤖 Chill Bot</b><small>Random and forgiving.</small></button><button class="choice" data-mode="medium"><b>🤖 Clever Bot</b><small>Wins and blocks when it can.</small></button><button class="choice" data-mode="hard"><b>🤖 Hard Bot</b><small>Minimax tactical play.</small></button><button class="choice" data-mode="impossible"><b>🤖 Impossible Bot</b><small>Perfect play.</small></button><button class="choice" data-mode="chaos"><b>🤖 Chaos Bot</b><small>Wild decisions with occasional brilliance.</small></button><button class="choice" data-mode="2p"><b>👥 2 Players</b><small>Pass the device.</small></button><button class="choice" data-mode="speed"><b>⚡ Speed Round</b><small>7 seconds per turn.</small></button><button class="choice" data-mode="reverse"><b>🔄 Reverse</b><small>Make three in a row and you lose.</small></button><button class="choice" data-mode="daily"><b>🌟 Daily Challenge</b><small>Same rules for everyone today.</small></button></div><div class="paneltitle">MODIFIERS</div><div class="modgrid"><button class="choice active" data-mod="none"><b>Classic</b><small>Normal board.</small></button><button class="choice" data-mod="wild"><b>Wild Start</b><small>O starts in a random square.</small></button><button class="choice" data-mod="block"><b>Blocked Cell</b><small>One square is unavailable.</small></button><button class="choice" data-mod="double"><b>Double Turn</b><small>X gets one extra turn.</small></button><button class="choice" data-mod="swap"><b>Swap Rule</b><small>Swap sides after the opening move.</small></button><button class="choice" data-mod="tiny"><b>Tiny Timer</b><small>5 seconds per turn.</small></button></div><div class="board3" id="board"></div><div class="status" id="status"></div><div class="timer" id="timer"></div><button class="btn swapbtn" id="swap">↔ SWAP SIDES</button><div class="actions"><button class="btn" id="start">NEW ROUND</button><a class="btn alt" href="leaderboard.html">🏆 LEADERBOARD</a></div><div class="resultbox" id="round"></div></main></div><script src="app.js"></script><script>
const modNames={none:'Classic',wild:'Wild Start',block:'Blocked Cell',double:'Double Turn',swap:'Swap Rule',tiny:'Tiny Timer'},modes={easy:'Chill Bot',medium:'Clever Bot',hard:'Hard Bot',impossible:'Impossible Bot',chaos:'Chaos Bot','2p':'2 Players',speed:'Speed Round',reverse:'Reverse',daily:'Daily Challenge'};
let mode='easy',mod='none',cells=Array(9).fill(''),turn='X',over=false,blocked=-1,doubleUsed=false,swapAvailable=false,timerId=null,seconds=0;
function utcDate(){return new Date().toISOString().slice(0,10)}function rngFor(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const ds=rngFor(utcDate()),dailyModes=['easy','medium','hard','impossible','chaos','2p','speed','reverse'],allMods=['wild','block','double','swap','tiny'],dailyChosenMods=[];while(dailyChosenMods.length<3){const x=allMods[Math.floor(ds()*allMods.length)];if(!dailyChosenMods.includes(x))dailyChosenMods.push(x)}const dailyMode=dailyModes[Math.floor(ds()*dailyModes.length)];daily.textContent=modes[dailyMode]+' + '+dailyChosenMods.map(x=>modNames[x]).join(' + ')+' · same challenge for everyone today.';
function render(){board.innerHTML=cells.map((v,i)=>'<button class="cell '+(v==='X'?'x':v==='O'?'o':'')+'" data-i="'+i+'">'+(i===blocked?'✕':v)+'</button>').join('');board.querySelectorAll('.cell').forEach(b=>b.onclick=()=>move(+b.dataset.i))}
function wins(a){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(q=>q.every(i=>a[i]===a[q[0]]&&a[i]))}
function finish(winner,reason){over=true;clearInterval(timerId);timer.textContent='';const lose=(mode==='reverse');if(reason==='draw')status.textContent='Draw! 🤝';else if(lose)status.textContent=(winner===turn?winner+' made three and loses!':winner+' wins!')+' 🎉';else status.textContent=winner==='X'?(mode==='2p'?'Player X wins! 🎉':'You win! 🎉'):(mode==='2p'?'Player O wins! 🎉':'You lose! 🤖');round.textContent=reason==='draw'?'The board is full.':status.textContent;if(winner==='X'&&!lose&&mode!=='2p')hpSubmit('tictactoe',100);setTimeout(()=>{if(confirm('Round over. Start a new round?'))newGame()},220)}
function checkEnd(){const w=wins(cells);if(w){finish(cells.find(x=>x), 'win');return true}if(cells.every((x,i)=>x||i===blocked)){finish(null,'draw');return true}return false}
function startTimer(){clearInterval(timerId);if(!(mode==='speed'||mod==='tiny'||(mode==='daily'&&dailyChosenMods.includes('tiny'))))return;seconds=(mode==='speed'?7:5);timer.textContent='⏱ '+seconds+'s';timerId=setInterval(()=>{seconds--;timer.textContent='⏱ '+seconds+'s';if(seconds<=0){clearInterval(timerId);const old=turn;turn=turn==='X'?'O':'X';status.textContent=old+' ran out of time. '+turn+' plays!';startTimer();if(mode!=='2p'&&turn==='O')setTimeout(bot,180)}},1000)}
function move(i){if(over||cells[i]||i===blocked||(mode!=='2p'&&turn==='O'))return;cells[i]=turn;render();if(checkEnd())return;if((mod==='double'||(mode==='daily'&&dailyChosenMods.includes('double')))&&turn==='X'&&!doubleUsed){doubleUsed=true;status.textContent='Double turn! X goes again.';startTimer();return}if((mod==='swap'||(mode==='daily'&&dailyChosenMods.includes('swap')))&&cells.filter(Boolean).length===1&&!swapAvailable){swapAvailable=true;swap.style.display='block'}turn=turn==='X'?'O':'X';status.textContent=mode==='2p'?'Player '+turn+' • your turn':turn==='X'?'Your turn • X':'Bot is thinking…';startTimer();if(mode!=='2p'&&turn==='O')setTimeout(bot,260)}
function winOrBlock(mark){for(const i of cells.map((v,j)=>!v&&j!==blocked?j:null).filter(v=>v!==null)){cells[i]=mark;const ok=wins(cells);cells[i]='';if(ok)return i}return null}
function minimax(a,turn2){const w=wins(a);if(w)return turn2==='O'?-10:10;if(a.every((x,i)=>x||i===blocked))return 0;const em=a.map((x,i)=>!x&&i!==blocked?i:null).filter(x=>x!==null);if(turn2==='X'){let best=-99;for(const i of em){a[i]='X';best=Math.max(best,minimax(a,'O'));a[i]=''}return best}else{let best=99;for(const i of em){a[i]='O';best=Math.min(best,minimax(a,'X'));a[i]=''}return best}}
function perfect(){let best=-99,pick=null;for(const i of cells.map((v,j)=>!v&&j!==blocked?j:null).filter(x=>x!==null)){cells[i]='O';const s=minimax(cells,'X');cells[i]='';if(s>best){best=s;pick=i}}return pick}
function bot(){if(over)return;const em=cells.map((v,i)=>!v&&i!==blocked?i:null).filter(x=>x!==null);if(!em.length)return;let pick;if(mode==='easy'||mode==='chaos')pick=em[Math.floor(Math.random()*em.length)];else if(mode==='medium')pick=winOrBlock('O')??winOrBlock('X')??(cells[4]===''?4:em[Math.floor(Math.random()*em.length)]);else pick=perfect();cells[pick]='O';render();if(checkEnd())return;turn='X';status.textContent='Your turn • X';startTimer()}
function newGame(){clearInterval(timerId);cells=Array(9).fill('');turn='X';over=false;blocked=-1;doubleUsed=false;swapAvailable=false;swap.style.display='none';round.textContent='';let activeMode=mode,activeMod=mod;if(mode==='daily'){activeMode=dailyMode;activeMod='daily'}if(activeMod==='block'||(mode==='daily'&&dailyChosenMods.includes('block')))blocked=Math.floor(ds()*9);if(activeMod==='wild'||(mode==='daily'&&dailyChosenMods.includes('wild'))){let i=Math.floor(ds()*9);cells[i]='O'}status.textContent=activeMode==='2p'?'Player X • your turn':'Your turn • X';render();if(cells.includes('O'))status.textContent='Your turn • X';startTimer()}
swap.onclick=()=>{if(!swapAvailable||over)return;swapAvailable=false;swap.style.display='none';cells=cells.map(x=>x==='X'?'O':x==='O'?'X':'');turn='X';render();status.textContent='Sides swapped! Your turn • X'};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;newGame()});document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mod]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mod=b.dataset.mod;newGame()});start.onclick=newGame;newGame();
</script></body></html>
