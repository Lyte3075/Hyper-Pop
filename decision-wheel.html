<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Decision Wheel ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.tool{max-width:720px;margin:auto}.panel{padding:22px;background:#ffffff08;border:1px solid #ffffff18;border-radius:24px}.out{padding:20px;border-radius:18px;background:#0b0b16;border:1px solid #ffffff12;font:700 20px "DM Mono";text-align:center;word-break:break-word;min-height:70px;display:grid;place-items:center}.btn{border:0;border-radius:13px;padding:13px 18px;background:#f7f4ff;color:#11111f;font-weight:800;cursor:pointer;margin:5px}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.input{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;font-size:16px;margin-bottom:10px}.hint{text-align:center;color:#aaa7c1;margin:12px}.pop{animation:pop .18s}@keyframes pop{50%{transform:scale(1.05)}}</style></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav><header class="hero"><div class="e">🎡</div><h1>Decision Wheel</h1><p>Paste choices, spin the wheel, and let chaos make the decision.</p></header><main class="box tool"><div class="panel"><textarea class="input" id="choices" rows="5" placeholder="Pizza&#10;Tacos&#10;Burger"></textarea><div class="out" id="out">Add at least two choices.</div><div class="row"><button class="btn" id="spin">SPIN! 🎡</button></div></div></main></div><script src="app.js"></script><script>let audio;const $=id=>document.getElementById(id);function s(f=440,d=.06){try{audio=audio||new AudioContext();let o=audio.createOscillator(),g=audio.createGain();o.type="triangle";o.frequency.value=f;g.gain.value=.06;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}$("spin").onclick=()=>{let a=$("choices").value.split("\n").map(x=>x.trim()).filter(Boolean);if(a.length<2){$("out").textContent="Need at least 2 choices.";s(130,.12);return}let i=0,t=0;let timer=setInterval(()=>{i=Math.floor(Math.random()*a.length);$("out").textContent=a[i];s(300+i*55,.035);if(++t>18){clearInterval(timer);s(900,.16);$("out").textContent="🎯 "+a[i]}},65)}</script></body></html>
