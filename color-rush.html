<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Color Rush ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.game{max-width:720px;margin:auto;text-align:center}.panel{padding:22px;background:#ffffff08;border:1px solid #ffffff18;border-radius:24px}.big{font-size:clamp(55px,15vw,100px);margin:18px 0}.score{font:700 28px "DM Mono";color:#ffe66d}.msg{min-height:28px;color:#aaa7c1;margin:12px}.btn{border:0;border-radius:13px;padding:13px 18px;background:#f7f4ff;color:#11111f;font-weight:800;cursor:pointer;margin:5px}.btn.alt{background:#ffffff0d;color:#fff;border:1px solid #ffffff18}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choice{min-width:110px}.bar{height:12px;background:#ffffff10;border-radius:99px;overflow:hidden;margin:15px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5db1,#9b7bff,#4be0e3);transition:none}.kbd{font:12px "DM Mono";color:#77758b;margin-top:16px}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.pop{animation:pop .18s}@keyframes pop{50%{transform:scale(1.08)}}@media(max-width:600px){.panel{padding:16px}}</style></head><body><div class="w"><nav class="hp-page-nav"><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div><a class="hp-page-back" href="index.html" aria-label="Back to Hyper-Pop" title="Back to Hyper-Pop">←</a></nav><header class="hero"><div class="e">🌈</div><h1>Color Rush</h1><p>Tap the button matching the target color. The timer gets nastier every round.</p></header><main class="box game"><div class="panel"><div class="msg">TARGET</div><div class="big" id="target">PINK</div><div class="choices" id="choices"></div><div class="score" id="score">Round 0</div><div class="bar"><i id="bar"></i></div><div class="msg" id="msg">Pick the matching color!</div></div></main></div><script src="app.js"></script><script>const colors=[["PINK","#ff5db1"],["CYAN","#4be0e3"],["YELLOW","#ffe66d"],["PURPLE","#9b7bff"]];let round=0,good=0,answer,deadline,timer,audio;const $=id=>document.getElementById(id);function s(f=500,d=.06){try{audio=audio||new AudioContext();if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.value=f;g.gain.value=.055;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function next(){round++;answer=colors[Math.floor(Math.random()*4)];$("target").textContent=answer[0];$("target").style.color=answer[1];$("score").textContent="Round "+round+" • "+good+" correct";deadline=performance.now()+Math.max(650,1800-round*35);clearInterval(timer);timer=setInterval(()=>{let left=Math.max(0,deadline-performance.now()),pct=left/Math.max(1,Math.max(650,1800-round*35))*100;$("bar").style.width=pct+"%";if(!left){clearInterval(timer);good=Math.max(0,good-1);s(130,.15);$("msg").textContent="⏰ Too slow!";next()}},30)}colors.forEach(c=>{let b=document.createElement("button");b.className="btn choice";b.textContent=c[0];b.style.borderColor=c[1];b.onclick=()=>{if(performance.now()>deadline)return;if(c[0]===answer[0]){good++;s(880,.07);$("msg").textContent="✨ NICE!"}else{s(120,.12);$("msg").textContent="NOPE!";good=Math.max(0,good-1)}next()};$("choices").append(b)});next();</script></body></html>
