<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Color Mixer ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.tool{max-width:720px;margin:auto}.panel{padding:22px;background:#ffffff08;border:1px solid #ffffff18;border-radius:24px}.out{padding:20px;border-radius:18px;background:#0b0b16;border:1px solid #ffffff12;font:700 20px "DM Mono";text-align:center;word-break:break-word;min-height:70px;display:grid;place-items:center}.btn{border:0;border-radius:13px;padding:13px 18px;background:#f7f4ff;color:#11111f;font-weight:800;cursor:pointer;margin:5px}.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.input{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;font-size:16px;margin-bottom:10px}.hint{text-align:center;color:#aaa7c1;margin:12px}.pop{animation:pop .18s}@keyframes pop{50%{transform:scale(1.05)}}</style></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><div id="account-slot"></div></nav><header class="hero"><div class="e">🧪</div><h1>Color Mixer</h1><p>Build a color, hear its little synth tone, and copy the hex value.</p></header><main class="box tool"><div class="panel"><input id="color" type="color" value="#ff5db1" style="width:100%;height:100px;border:0;background:none"><div class="out" id="out">#FF5DB1</div><div class="row"><button class="btn" id="sound">PLAY COLOR</button></div><div class="hint">Every color becomes a tiny note.</div></div></main></div><script src="app.js"></script><script>let audio;const $=id=>document.getElementById(id);function play(){try{audio=audio||new AudioContext();let h=$("color").value.slice(1),v=parseInt(h,16),r=v>>16,g=v>>8&255,b=v&255,f=180+(r+g+b)/3*2;let o=audio.createOscillator(),x=audio.createGain();o.type="sine";o.frequency.value=f;x.gain.value=.07;o.connect(x).connect(audio.destination);o.start();o.stop(audio.currentTime+.18)}catch(e){}}$("color").oninput=()=>{$("out").textContent=$("color").value.toUpperCase()};$("sound").onclick=play;</script></body></html>
