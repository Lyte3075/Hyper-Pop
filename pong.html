<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Pong ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.game{max-width:720px;margin:auto;text-align:center}.panel{padding:22px;background:#ffffff08;border:1px solid #ffffff18;border-radius:24px}.big{font-size:clamp(55px,15vw,100px);margin:18px 0}.score{font:700 28px "DM Mono";color:#ffe66d}.msg{min-height:28px;color:#aaa7c1;margin:12px}.btn{border:0;border-radius:13px;padding:13px 18px;background:#f7f4ff;color:#11111f;font-weight:800;cursor:pointer;margin:5px}.btn.alt{background:#ffffff0d;color:#fff;border:1px solid #ffffff18}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choice{min-width:110px}.bar{height:12px;background:#ffffff10;border-radius:99px;overflow:hidden;margin:15px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5db1,#9b7bff,#4be0e3);transition:width .2s}.kbd{font:12px "DM Mono";color:#77758b;margin-top:16px}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.pop{animation:pop .18s}@keyframes pop{50%{transform:scale(1.08)}}@media(max-width:600px){.panel{padding:16px}}</style></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav><header class="hero"><div class="e">🏓</div><h1>Pocket Pong</h1><p>Keep the ball alive. Your opponent gets faster every time you score.</p></header><main class="box game"><div class="panel"><div class="panel" style="padding:8px"><canvas id="c" width="600" height="340" style="width:100%;border-radius:16px;background:#080812;touch-action:none"></canvas></div><div class="score" id="score">0 : 0</div><button class="btn" id="start">START</button><div class="msg" id="msg">Move with your finger, mouse, or ↑ ↓.</div></div></main></div><script src="app.js"></script><script>const c=document.getElementById("c"),ctx=c.getContext("2d"),start=document.getElementById("start");let py=142,botY=142,bx=300,by=170,dx=4,dy=3,me=0,bot=0,run=false,audio,raf;function s(f=500,d=.05){try{audio=audio||new AudioContext();if(audio.state==="suspended")audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=f;g.gain.value=.035;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function reset(){bx=300;by=170;dx=Math.random()>.5?4:-4;dy=(Math.random()>.5?3:-3)}function draw(){ctx.clearRect(0,0,600,340);ctx.fillStyle="#f7f4ff";ctx.fillRect(22,py,12,55);ctx.fillRect(566,botY,12,55);ctx.beginPath();ctx.arc(bx,by,8,0,7);ctx.fill();if(!run)return;botY+=(by-27-botY)*.045;bx+=dx;by+=dy;if(by<8||by>332){dy*=-1;s(260)}if(bx<45&&bx>25&&by>py-8&&by<py+63){dx=Math.abs(dx)+.15;s(720)}if(bx>555&&bx<575&&by>botY-8&&by<botY+63){dx=-Math.abs(dx)-.15;s(720)}if(bx<0){bot++;reset();s(140)}if(bx>600){me++;reset();s(880)}document.getElementById("score").textContent=me+" : "+bot;raf=requestAnimationFrame(draw)}function aim(e){let r=c.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*340;py=Math.max(0,Math.min(285,y-27))}c.addEventListener("pointermove",aim);c.addEventListener("pointerdown",aim);start.onclick=()=>{if(run)return;run=true;me=0;bot=0;reset();s(600,.1);cancelAnimationFrame(raf);draw()};draw();</script></body></html>
