<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0b16"><title>Tiny Thoughts ✦ Hyper-Pop</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{touch-action:manipulation;-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,var(--c)33,transparent 35%),#0b0b16;color:#f7f4ff;font:16px system-ui,sans-serif}button,input{font:inherit;touch-action:manipulation}button{cursor:pointer}.w{max-width:850px;margin:auto;padding:0 18px}nav{height:72px;display:flex;justify-content:space-between;align-items:center}.back{color:#aaa7c1}.logo{font-weight:800}.hero{text-align:center;padding:55px 0 30px}.hero .e{font-size:60px}.hero h1{font-size:clamp(42px,9vw,76px);letter-spacing:-.06em;margin:12px 0}.hero p{color:#aaa7c1}.box{margin:15px 0 60px;padding:25px;border:1px solid #ffffff18;background:#151526;border-radius:24px;box-shadow:0 25px 70px #0008}.big{font:500 55px monospace;text-align:center;margin:20px 0}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{padding:12px 16px;border-radius:12px;border:1px solid #ffffff18;background:#fff;color:#111;font-weight:800}.dark{background:#ffffff08;color:#fff}.result{text-align:center;color:var(--c);font-weight:700;margin-top:14px}.foot{text-align:center;color:#66647a;font:11px monospace;padding-bottom:35px}</style><link rel="stylesheet" href="style.css"></head><body style="--c:#4be0e3"><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav><header class="hero"><div class="e">🪄</div><h1>Tiny Thoughts</h1><p>One tiny thing. One whole page. Zero productivity required.</p></header><main class="box"><div class="big" style="font-size:28px;line-height:1.4" id="t">Somewhere, a button has never been clicked.</div><div class="actions"><button class="btn" onclick="go()">GIVE ME A THOUGHT ✦</button></div><script>const a=["Your screen is a rectangle with ambitions.","A tiny duck approves this website.","The internet has enough fonts. Probably.","You have entered the silly corner of the internet.","This thought has absolutely no practical value.","Somewhere, a pigeon is walking like it owns the sidewalk.","The moon has been doing the same job for billions of years.","Your last thought was probably about something completely unrelated.","A keyboard is just a tiny piano for letters.","There is no reason this button should be this satisfying.","Somewhere, a cat is ignoring an important meeting.","Clouds are just sky thoughts waiting to happen.","The future is currently being assembled one weird moment at a time.","A sock has probably disappeared from your laundry forever.","Your phone has seen things. Mostly screenshots.","The universe is extremely large and you are currently reading this sentence.","A spoon is a tiny shovel for soup.","Somewhere, someone just opened a fridge and forgot why.","If chairs could talk, meetings would become much longer.","Your brain invented the idea of a brain. That's pretty funny.","There is probably a rock older than every website ever made.","The word 'banana' is doing a lot of work for a fruit.","A traffic cone is basically a road's warning emoji.","You could be doing anything right now. You chose this.","Somewhere, a printer is experiencing an emotion.","The first person to see a rainbow had no idea what to call it.","A circle has no corners and seems pretty confident about it.","Every loading screen is a tiny test of patience.","You are standing on a planet that is spinning very fast.","A fish has never had to understand Wi-Fi.","Somewhere, a dog just heard a mysterious noise.","Your reflection has been copying you this whole time.","The alphabet is just a playlist of sounds.","A sandwich is food architecture.","There is probably a button somewhere that does absolutely nothing.","Your future self has already survived every awkward thing you haven't done yet.","A microwave is a tiny room where leftovers go to become interesting.","The ocean has never once asked permission to make a wave.","Every map is a tiny argument about where things are.","Somewhere in the world, a bug is having a very productive day.","A bookmark is a tiny flag planted in a story.","The word 'queue' is mostly waiting around.","Your keyboard has a key for almost everything except the exact thing you want.","Somewhere, a tree is quietly winning at being alive.","A shadow is basically light's negative space.","The internet is a giant collection of people saying 'wait, does anyone know how to fix this?'","A door is just a wall that decided to cooperate.","Somewhere, a squirrel has a plan. Nobody knows what it is.","You have probably walked past something interesting today without noticing.","A calendar is just a grid full of future guesses.","The shortest distance between two snacks is usually the kitchen.","Every elevator ride is a tiny shared silence adventure.","A pencil is a tiny stick with a surprisingly complicated career.","Somewhere, a ceiling fan is spinning with no idea why.","The best ideas sometimes arrive while you are trying to think about something else.","A pixel is incredibly small but somehow knows how to become a picture.","There is no universal rule saying toast has to land butter-side down. The floor may simply be biased.","Your cursor is probably somewhere on this page, wondering what it did to deserve this.","A cloud can look like a dragon until you look away.","The world contains billions of people and yet everyone still loses their keys.","A notification is a tiny interruption wearing a uniform.","If time had a loading bar, nobody would trust it.","Somewhere, a robot is probably reading this and taking notes.","A backpack is a portable room with terrible organization.","Your fridge is basically a cold pantry with a light.","A staircase is a very committed ramp.","A pencil eraser is an undo button with crumbs.","Somewhere, a bird is having the best day of its life for absolutely no reason.","The internet started as an idea and now contains pictures of raccoons stealing things.","A window is a wall that chose scenery.","You don't need a reason to press this button again.","Some thoughts are profound. This one is wearing socks.","A tiny decision can create a very large detour.","Somewhere, someone is discovering the exact song you already love.","Your shoes have probably been to more places than you remember.","A keyboard shortcut is just a secret handshake for computers.","The future is mostly a collection of things that have not happened yet.","A puddle is a temporary mirror with terrible self-esteem.","Somewhere, a leaf is currently falling with excellent dramatic timing.","The best kind of weird is the kind that makes you smile.","Your brain is doing thousands of things right now and still found time for this.","A calendar reminder is a note from your past self to your future self.","A hallway is just a room that forgot to be a room.","Somewhere, a toaster is waiting for its moment.","There is probably a perfectly good explanation. It just hasn't arrived yet.","The universe has no shortage of space for one more silly idea.","A zipper is a tiny mechanical agreement between two pieces of fabric.","A backpack zipper has been trusted with astonishingly important snacks.","Every great adventure begins with somebody saying 'why not?'","Somewhere, a frog is having absolutely no idea what Wi-Fi is.","A good nap is time travel with a blanket.","The word 'tiny' is surprisingly useful for describing large amounts of internet nonsense.","A blank page is just a future story waiting for its first mistake.","Somewhere, a calculator is being asked to do something it was never emotionally prepared for.","You are now slightly more aware that you are reading a tiny thought.","This thought will disappear as soon as you press the button. Probably.","Congratulations. You have successfully thought about thinking.","The button remains innocent of everything that happens here.","Somewhere, a very small idea just became a very large website feature.","This is not a life lesson. It is barely a sentence.","You could call this wisdom, but the thought police may disagree.","A thought is just your brain throwing a notification at itself.","There are probably infinite possible thoughts, and we picked this one.","If this thought made you laugh, it has completed its mission.","The tiny internet has spoken. It said something weird."];function go(){t.textContent=a[Math.floor(Math.random()*a.length)]}</script></main><footer class="foot">Hyper-Pop ✦ tiny internet, big vibes</footer></div><script>document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});</script><script src="app.js"></script></body></html>
