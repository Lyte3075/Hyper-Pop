<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Aim Pop ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"></head><body><div class="w"><nav class="hp-page-nav"><a class="logo" href="index.html">← Hyper-Pop</a><div id="account-slot"></div></nav><header class="hero"><div class="e">🎯</div><h1>Aim Pop</h1><p>Pop 15 targets. Misses cost time. Fastest run wins.</p></header><main class="box"><div id="arena" style="height:420px;border:1px solid var(--line);border-radius:18px;background:#0d0d19;position:relative;overflow:hidden;touch-action:manipulation"><button id="target" style="display:none;position:absolute;width:58px;height:58px;border-radius:50%;border:4px solid #fff;background:var(--pink);box-shadow:0 0 25px #ff5db188"></button><div id="msg" style="height:100%;display:grid;place-items:center;color:var(--muted)">Press START</div></div><div style="display:flex;gap:10px;justify-content:center;margin-top:15px"><button class="btn" id="start">START</button><a class="btn dark" href="leaderboard.html">🏆 LEADERBOARD</a></div><div class="result" id="result"></div></main></div><script src="app.js"></script><script>
let hits=0,started=0;function place(){target.style.display='block';msg.style.display='none';target.style.left=Math.random()*(arena.clientWidth-65)+'px';target.style.top=Math.random()*(arena.clientHeight-65)+'px'}start.onclick=()=>{hits=0;started=performance.now();start.textContent='RUNNING…';place()};target.onclick=async()=>{hits++;if(hits>=15){target.style.display='none';let score=Math.round(performance.now()-started);start.textContent='START';result.textContent=score+' ms · '+(await hpSubmit('aim',score)?'score submitted':'log in to submit')}else place()};
</script></body></html>
