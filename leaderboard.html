<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Leaderboards ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span></nav><header class="hero"><div class="e">🏆</div><h1>Leaderboards</h1><p>The tiny internet keeps score.</p></header><main class="box"><select id="game" style="width:100%;padding:13px;border-radius:12px;background:#ffffff08;color:#fff;border:1px solid var(--line)"><option value="reaction">⚡ Reaction Rush</option><option value="clicker">👆 Button Bonanza</option><option value="aim">🎯 Aim Pop</option><option value="number">🔢 Number Sprint</option><option value="memory">🧠 Memory Flash</option></select><div class="board" id="b"></div></main></div><script src="app.js"></script><script>
async function load(){const rows=await hpRpc('hyperpop_leaderboard',{p_game:game.value,p_limit:25});b.innerHTML='<div class="board-row board-head"><span>#</span><span>PLAYER</span><span>SCORE</span></div>'+(rows||[]).map(r=>'<div class="board-row"><span>'+r.rank+'</span><span>@'+r.username+'</span><span class="board-score">'+r.score+'</span></div>').join('')||'<div class="login-needed">No scores yet. Be the first!</div>'}game.onchange=load;load();
