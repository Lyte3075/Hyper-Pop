<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Leaderboards ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"></head><body><div class="w"><nav class="hp-page-nav"><a class="logo" href="index.html">← Hyper-Pop</a><div id="account-slot"></div></nav><header class="hero"><div class="e">🏆</div><h1>Leaderboards</h1><p>The tiny internet keeps score.</p></header><main class="box"><select id="game" style="width:100%;padding:13px;border-radius:12px;background:#ffffff08;color:#fff;border:1px solid var(--line)"><option value="reaction">⚡ Reaction Rush</option><option value="clicker">👆 Button Bonanza</option><option value="aim">🎯 Aim Pop</option><option value="number">🔢 Number Sprint</option><option value="frameshot">🎬 FrameShot</option><option value="snake">🐍 Snake</option><option value="tictactoe">⭕ Tic-Tac-Toe</option></select><div class="board" id="b"></div></main></div><script src="app.js?v=party-tab-1"></script><script>
const gameSelect=document.getElementById('game');
const board=document.getElementById('b');
const LB_API='https://iapnejlttsqqefkpmelp.supabase.co/rest/v1/rpc/hyperpop_leaderboard',LB_KEY='sb_publishable_TB7oC4nDlUJq-Gcb2yoTjQ_Dvbh6NlM';
const gameLabels={reaction:'Reaction Rush',clicker:'Button Bonanza',aim:'Aim Pop',number:'Number Sprint',frameshot:'FrameShot',snake:'Snake',tictactoe:'Tic-Tac-Toe'};
async function load(){
  const selected=gameSelect.value;
  board.innerHTML='<div class="login-needed">Loading '+gameLabels[selected]+' scores…</div>';
  try{
    const response=await fetch(LB_API,{method:'POST',headers:{apikey:LB_KEY,'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({p_game:selected,p_limit:25})});if(!response.ok)throw new Error('Leaderboard request failed ('+response.status+').');const rows=await response.json();
    if(!Array.isArray(rows)){
      board.innerHTML='<div class="login-needed">'+(rows?.error||'Could not load leaderboard. Please try again.')+'</div>';
      return;
    }
    if(rows.length===0){
      board.innerHTML='<div class="login-needed">No '+gameLabels[selected]+' scores yet. Play a round and submit your score to claim the first spot! 🏆</div>';
      return;
    }
    const timed=['reaction','aim','number'].includes(selected);
    const heading=timed?'LOWER IS BETTER':'HIGHER IS BETTER';
    board.innerHTML='<div class="board-row board-head"><span>#</span><span>PLAYER</span><span>'+heading+'</span></div>'+rows.map(r=>'<div class="board-row"><span>'+(r.rank??r.row_number??'—')+'</span><span>@'+String(r.username).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</span><span class="board-score">'+(timed?Math.round(r.score)+' ms':Math.round(r.score*100)/100)+'</span></div>').join('');
  }catch(error){
    console.error('[Hyper-Pop leaderboard]',error);
    board.innerHTML='<div class="login-needed">Leaderboard could not load. Check your connection and try again.</div>';
  }
}
gameSelect.addEventListener('change',load);
load();
</script></body></html>
