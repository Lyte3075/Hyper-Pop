<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Rooftop Runner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
:root{--bg:rgba(240,246,250,.95);--fg:#1d2a33;--red:#e5242b;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:rgba(20,26,31,.95);--fg:#e8eef2}}
html{font-size:clamp(11px,min(2.1vw,3.4vh),19px)}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f2;font-family:system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;left:calc(1rem + var(--sl));top:calc(1rem + var(--st));color:#1d2a33;font-weight:700;font-size:1.1rem;line-height:1.45;pointer-events:none;text-shadow:0 0 .4rem #fff}
#dot{position:fixed;left:50%;top:50%;width:.4rem;height:.4rem;margin:-.2rem;border-radius:50%;background:var(--red);pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(transparent 50%,rgba(255,255,255,.6));opacity:0}
#hurt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(transparent 40%,rgba(229,36,43,.7));opacity:0}
#toast{position:fixed;top:14%;left:0;right:0;text-align:center;font-weight:800;font-size:1.7rem;color:var(--red);text-shadow:0 0 .5rem #fff;pointer-events:none;opacity:0;transition:opacity .4s;padding:0 1rem}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);text-align:center;z-index:5;touch-action:pan-y}
#panel{width:min(94vw,36rem);max-height:94vh;max-height:94dvh;overflow:auto;padding:1.2rem 1.5rem;box-sizing:border-box;-webkit-overflow-scrolling:touch}
h1{margin:0 0 .5rem;font-size:2.6rem;letter-spacing:.04em}h1 span{color:var(--red)}h2,h3{margin:.6rem 0;font-size:1.4rem}h3{font-size:1.2rem}
p{margin:.45rem 0;font-size:1rem;line-height:1.4}
button{background:var(--red);color:#fff;border:0;border-radius:.45rem;padding:.6rem 1.3rem;margin:.3rem;font-size:1.1rem;min-height:2.6rem;font-weight:700;cursor:pointer;touch-action:manipulation}
button.alt{background:#5b6b75}
label{display:block;text-align:left;margin:.6rem 0;font-size:1rem}label input[type=range]{width:100%;height:1.6rem}label input[type=checkbox]{width:1.1rem;height:1.1rem;vertical-align:middle}
.kb{display:grid;grid-template-columns:1fr auto;gap:.15rem .7rem;align-items:center;text-align:left;font-size:1rem}.kb button{padding:.25rem .7rem;margin:.15rem;font-size:.95rem;min-height:2rem;min-width:6rem}
ol{text-align:left;display:inline-block;margin:.3rem;padding-left:1.6rem;font-size:1rem}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:3}
.tb{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(20,26,31,.4);border:2px solid rgba(255,255,255,.6);color:#fff;font-weight:800;font-size:max(.8rem,2.8vmin);letter-spacing:.04em;touch-action:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.tb.on{background:rgba(229,36,43,.8)}
#bj{right:calc(5vmin + var(--sr));bottom:calc(7vmin + var(--sb));width:21vmin;height:21vmin;font-size:max(.9rem,3.6vmin)}
#bs{right:calc(29vmin + var(--sr));bottom:calc(5vmin + var(--sb));width:15vmin;height:15vmin}
#bt{right:calc(8vmin + var(--sr));bottom:calc(31vmin + var(--sb));width:14vmin;height:14vmin}
#bv,#bp,#br{top:calc(2vmin + var(--st));width:11vmin;height:11vmin}
#bp{right:calc(2vmin + var(--sr))}#bv{right:calc(15vmin + var(--sr))}#br{right:calc(28vmin + var(--sr))}
#jb{position:absolute;width:24vmin;height:24vmin;margin:-12vmin 0 0 -12vmin;left:calc(20vmin + var(--sl));top:calc(100% - 26vmin - var(--sb));border-radius:50%;background:rgba(20,26,31,.22);border:2px solid rgba(255,255,255,.55);opacity:.55;pointer-events:none}
#jk{position:absolute;left:50%;top:50%;width:10vmin;height:10vmin;border-radius:50%;background:rgba(255,255,255,.8);transform:translate(-50%,-50%)}
</style></head><body>
<div id="dot"></div><div id="vig"></div><div id="hurt"></div><div id="hud"></div><div id="toast"></div>
<div id="ov"><div id="panel"></div></div>
<div id="touch"><div id="jb"><div id="jk"></div></div><div class="tb" id="bj" data-t="jump">UP</div><div class="tb" id="bs" data-t="slide">DOWN</div><div class="tb" id="bt" data-t="turn">EXTRA</div><div class="tb" id="bp" data-t="pause">II</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- settings ----------
const ACT=[['fwd','Forward'],['back','Back'],['left','Left'],['right','Right'],['jump','Up (jump, kick-off)'],['slide','Down (slide, roll, drop)'],['turn','Extra (quick turn)'],['vision','Runner vision'],['respawn','Respawn']];
const DEF={fwd:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD',jump:'Space',slide:'ControlLeft',turn:'KeyQ',vision:'KeyV',respawn:'KeyR'};
const isTouch=(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches)||'ontouchstart' in window;
let set={sens:1,fov:75,vol:.7,bob:1,invY:false,vision:true,body:true,touch:isTouch,binds:{...DEF}};
try{const s=JSON.parse(localStorage.getItem('rr_set'));if(s)set={...set,...s,binds:{...DEF,...s.binds}}}catch(e){}
const save=()=>{try{localStorage.setItem('rr_set',JSON.stringify(set))}catch(e){}};
let times=[];try{times=JSON.parse(localStorage.getItem('rr_times'))||[]}catch(e){}
const lbl=c=>c.replace(/^Key|^Digit/,'').replace('Left',' L').replace('Right',' R');

// ---------- audio ----------
let AC,master,noiseBuf,windG,slideG,wallG;
function initAudio(){
  if(AC){AC.resume();return}
  AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=set.vol;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const loop=(fc,type)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fc;const g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(master);s.start();return g};
  windG=loop(450,'bandpass');slideG=loop(2000,'highpass');wallG=loop(1000,'bandpass');
}
function tone(f,d,t='sine',v=.2,f2){if(!AC)return;const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(master);o.start();o.stop(n+d)}
function puff(fc,d,v){if(!AC)return;const n=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;const g=AC.createGain();g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(master);s.start(0,Math.random());s.stop(n+d)}
const chime=()=>[660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.18),i*90));

// ---------- scene ----------
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0xcfe3f2);S.fog=new THREE.Fog(0xcfe3f2,100,700);
const C=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1100);
S.add(new THREE.HemisphereLight(0xffffff,0xb8c4cc,.95));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(40,80,20);S.add(sun);
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const boxes=[];
const white=new THREE.MeshLambertMaterial({color:0xf6f6f4}),grey=new THREE.MeshLambertMaterial({color:0xe3e8eb});
const redM=new THREE.MeshLambertMaterial({color:0xe5242b}),flagM=new THREE.MeshBasicMaterial({color:0xe5242b});
const lineMat=new THREE.LineBasicMaterial({color:0xb4bec5});
const springM=new THREE.MeshLambertMaterial({color:0xff8a1f}),gardenM=new THREE.MeshLambertMaterial({color:0xbfe0c8});
const setVision=()=>redM.color.setHex(set.vision?0xe5242b:0xf6f6f4);setVision();
const batches=new Map(),eList=[],AXT=[[1,2],[2,0],[0,1]];
function add(x,y,z,w,h,d,mat,tag,ne){ // static boxes are merged into a few meshes (flushBatches) for speed
  let L=batches.get(mat);if(!L)batches.set(mat,L=[]);L.push(x,y,z,w,h,d);
  if(!ne)eList.push(x,y,z,w,h,d);
  boxes.push({min:{x:x-w/2,y,z:z-d/2},max:{x:x+w/2,y:y+h,z:z+d/2},tag});
}
function flushBatches(){
  for(const[mat,L]of batches)for(let o=0;o<L.length;o+=15000){
    const pos=[],nor=[],idx=[],end=Math.min(L.length,o+15000);
    for(let q=o;q<end;q+=6){
      const sz=[L[q+3]/2,L[q+4]/2,L[q+5]/2],c0=[L[q],L[q+1]+L[q+4]/2,L[q+2]];
      for(let a=0;a<3;a++)for(const sg of[1,-1]){
        const c=c0.slice();c[a]+=sg*sz[a];let ba=AXT[a][0],ca=AXT[a][1];if(sg<0){const t=ba;ba=ca;ca=t}
        const b0=pos.length/3,n=[0,0,0];n[a]=sg;
        for(const[sb,sc]of[[-1,-1],[1,-1],[1,1],[-1,1]]){const pt=c.slice();pt[ba]+=sb*sz[ba];pt[ca]+=sc*sz[ca];pos.push(pt[0],pt[1],pt[2]);nor.push(n[0],n[1],n[2])}
        idx.push(b0,b0+1,b0+2,b0,b0+2,b0+3);
      }
    }
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));g.setIndex(idx);
    const m=new THREE.Mesh(g,mat);m.frustumCulled=false;S.add(m);
  }
  for(let o=0;o<eList.length;o+=12000){
    const pos=[],end=Math.min(eList.length,o+12000);
    for(let q=o;q<end;q+=6){
      const x=eList[q],y=eList[q+1],z=eList[q+2],hw=eList[q+3]/2,hh=eList[q+4],hd=eList[q+5]/2;
      const c=[[x-hw,z-hd],[x+hw,z-hd],[x+hw,z+hd],[x-hw,z+hd]];
      for(let i=0;i<4;i++){const A=c[i],B=c[(i+1)%4];pos.push(A[0],y,A[1],B[0],y,B[1],A[0],y+hh,A[1],B[0],y+hh,B[1],A[0],y,A[1],A[0],y+hh,A[1])}
    }
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));const l=new THREE.LineSegments(g,lineMat);l.frustumCulled=false;S.add(l);
  }
  batches.clear();eList.length=0;
}
const BP=36,N=20;let tb={};try{tb=JSON.parse(localStorage.getItem('rr_trials'))||{}}catch(e){}
const ramps=[],zips=[],bl=[],towers=[];
const gridH=new THREE.GridHelper(N*BP+300,(N*BP+300)/6,0xc3ccd2,0xd9e0e4);gridH.position.y=.03;S.add(gridH);
add(0,-1,0,N*BP+300,1,N*BP+300,grey,'roof',1);
function ramp(x,z,len,w,y0,y1,dx,dz,mat){ // low end at x,z rising along dx,dz
  ramps.push({ox:x,oz:z,dx,dz,len,w,y0,y1,s:(y1-y0)/len});
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,.6,Math.hypot(len,y1-y0)),mat);
  m.position.set(x+dx*len/2,(y0+y1)/2-.3,z+dz*len/2);m.rotation.order='YXZ';m.rotation.y=Math.atan2(dx,dz);m.rotation.x=-Math.atan2(y1-y0,len);
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),lineMat));S.add(m);
}
function makeZip(a,b){
  const len=a.distanceTo(b);zips.push({a,b,len,d:b.clone().sub(a).normalize()});
  const m=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,len),new THREE.MeshBasicMaterial({color:0x2d3a44}));
  m.position.copy(a).add(b).multiplyScalar(.5);m.lookAt(b);S.add(m);
  for(const q of[a,b]){const pm=new THREE.Mesh(new THREE.BoxGeometry(.25,3,.25),new THREE.MeshLambertMaterial({color:0xffc21a}));pm.position.set(q.x,q.y-1.5,q.z);S.add(pm)}
}
function zipTry(A,B,C){
  if(Math.abs(A.ht-B.ht)<3)return;
  const hi=A.ht>B.ht?A:B,lo=hi===A?B:A,ax=Math.abs(hi.x-lo.x)>Math.abs(hi.z-lo.z)?'x':'z';
  const sg=ax==='x'?Math.sign(lo.x-hi.x):Math.sign(lo.z-hi.z),ea=(ax==='x'?hi.w:hi.d)/2-2,eb=(ax==='x'?lo.w:lo.d)/2-2;
  const a=new THREE.Vector3(hi.x+(ax==='x'?sg*ea:3),hi.ht+3,hi.z+(ax==='z'?sg*ea:3));
  const b=new THREE.Vector3(lo.x-(ax==='x'?sg*eb:-3),lo.ht+3,lo.z-(ax==='z'?sg*eb:-3));
  if((a.y+b.y)/2<C.ht+2)return;makeZip(a,b);
}
function props(x,z,w,d,ht){
  for(let k=0,n=2+Math.floor(rnd()*3);k<n;k++){
    const px=x+(rnd()-.5)*(w-6),pz=z+(rnd()-.5)*(d-6),t=rnd();
    if(Math.abs(px-x)<5&&Math.abs(pz-z)<5)continue;
    if(t<.35)add(px,ht,pz,2.2,1.2,1.6,grey,'crate',1);          // AC unit
    else if(t<.55)add(px,ht,pz,3,3.5,3,white,'crate',1);       // water tank
    else if(t<.75)add(px,ht,pz,.25,9,.25,grey,'crate',1);      // antenna
    else add(px,ht,pz,7,4,.4,redM,'wall',1);                   // billboard
  }
}
function tower(i,j,H){
  const b=bl[i][j],cx=b.x,cz=b.z,W=24,fh=8;b.tw=true;b.ht=H+.8;towers.push({x:cx,z:cz});
  const wl=(x,z,w,d,y,hh)=>add(x,y,z,w,hh,d,white,'roof',1);
  for(let s=0;s*fh<H;s++){
    const y0=s*fh,top=y0+(s?.8:0),ho=fh-(s?.8:0),openX=s%2===0,hx=s%2?-1:1;
    if(s){
      const sl=(a2,b2,c,e)=>{const x0=hx>0?a2:-b2,x1=hx>0?b2:-a2;add(cx+(x0+x1)/2,y0,cz+(c+e)/2,x1-x0,.8,e-c,grey,'roof',1)};
      sl(-12,0,-12,12);sl(0,12,-12,-4);sl(0,12,4,12);sl(0,2,-4,4);sl(10,12,-4,4); // floor with a hole
    }
    if((s+1)*fh<H)add(cx-hx*6,top,cz,3.5,1,2.4,springM,'spring',1); // springboard under the next floor's hole
    add(cx-hx*9.5,top,cz-8,3,1.1,1.4,grey,'crate',1);add(cx-hx*9.5,top,cz+8,3,1.1,1.4,grey,'crate',1); // desks
    add(cx+hx*10.2,top,cz-10.2,1.2,ho,1.2,white,'roof',1);add(cx+hx*10.2,top,cz+10.2,1.2,ho,1.2,white,'roof',1); // pillars
    for(const sg of[-1,1]){
      if(openX){wl(cx+sg*11.5,cz-7.5,1,9,top,4.5);wl(cx+sg*11.5,cz+7.5,1,9,top,4.5);wl(cx+sg*11.5,cz,1,W,top+4.5,ho-4.5);wl(cx,cz+sg*11.5,W,1,top,ho)}
      else{wl(cx-7.5,cz+sg*11.5,9,1,top,4.5);wl(cx+7.5,cz+sg*11.5,9,1,top,4.5);wl(cx,cz+sg*11.5,W,1,top+4.5,ho-4.5);wl(cx+sg*11.5,cz,1,W,top,ho)}
    }
  }
  add(cx,H,cz,W,.8,W,grey,'roof',1);add(cx+4,H+.8,cz-6,8,5,.8,redM,'wall',1);add(cx-6,H+.8,cz+5,.25,12,.25,grey,'crate',1);
}
const TW={};[[3,3,72],[10,3,88],[16,4,96],[4,10,80],[15,10,88],[7,15,72],[12,16,96],[3,16,80],[17,17,88],[8,8,80]].forEach(([i,j,H])=>TW[i+','+j]=H);
for(let i=0;i<N;i++){bl[i]=[];for(let j=0;j<N;j++){
  const x=(i-N/2+.5)*BP,z=(j-N/2+.5)*BP,w=26+rnd()*8,d=26+rnd()*8;
  if(TW[i+','+j]){bl[i][j]={x,z,w:24,d:24,ht:0};tower(i,j,TW[i+','+j]);continue}
  const dc=Math.hypot(i-N/2,j-N/2)/(N/2),ht=Math.max(28,Math.round(30+26*Math.max(0,1-dc)*(.75+.25*Math.sin(i*.9)*Math.cos(j*.8))+6*Math.sin(i*.6+1)*Math.cos(j*.5)+rnd()*7)),isS=i===N/2&&j===N/2; // taller downtown core, lower outskirts
  add(x,0,z,w,ht,d,(i+j)%2?white:grey,'roof');bl[i][j]={x,z,w,d,ht};
  if(isS)continue;
  if(rnd()<.3){const dir=rnd()<.5?[1,0]:[0,1];ramp(x-dir[0]*12,z-dir[1]*12,24,6,ht,ht+6,dir[0],dir[1],white)}
  else{const q=rnd();
    if(q<.5)add(x+(rnd()-.5)*w*.5,ht,z+(rnd()-.5)*d*.5,2.5,1.1,2,redM,'crate');
    else add(x+(rnd()-.5)*w*.4,ht,z+(rnd()-.5)*d*.4,3,1,2.4,springM,'spring');}
  if(rnd()<.2)add(x,ht,z-d/2+1.2,w*.6,5,.8,redM,'wall');
  props(x,z,w,d,ht);
  if(rnd()<.18)add(x+(rnd()-.5)*8,ht,z+(rnd()-.5)*8,9,.3,7,gardenM,'roof',1); // roof garden
  if(rnd()<.08){const cx2=x+(rnd()-.5)*8;add(cx2,ht,z-6,1.2,26,1.2,white,'wall',1);add(cx2+7,ht+26,z-6,16,1,1.2,redM,'roof',1)} // crane
}}
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const A=bl[i][j];
  if(i<N-1){const B=bl[i+1][j],gx=(B.x-B.w/2)-(A.x+A.w/2);
    if(gx>1&&gx<14&&rnd()<.3){const top=Math.min(A.ht,B.ht);add((A.x+A.w/2+B.x-B.w/2)/2,top-.5,A.z,gx+1,.5,3.5,white,'roof')}} // skybridge
  if(i<N-2&&rnd()<.22)zipTry(A,bl[i+2][j],bl[i+1][j]);
  if(j<N-2&&rnd()<.22)zipTry(A,bl[i][j+2],bl[i][j+1]);
}
for(let k=0;k<170;k++){ // street traffic
  const a1=rnd()<.5,line=(Math.floor(rnd()*(N+1))-N/2)*BP+(rnd()-.5)*2,pos=(rnd()-.5)*N*BP;
  add(a1?line:pos,0,a1?pos:line,a1?2:4.2,1.3,a1?4.2:2,rnd()<.3?redM:rnd()<.5?white:grey,'crate',1);
}
const startB=bl[N/2][N/2];
const tn=['Downtown Dash','Skyline Sprint','Red Line','Canyon Run','Rooftop Relay','Last Light','Glass Mile','Crane Circuit','Tower Chase','Midnight Loop'],trials=[];
for(let k=0;k<10;k++){
  let ci=2+Math.floor(rnd()*(N-4)),cj=2+Math.floor(rnd()*(N-4));const sx=rnd()<.5?1:-1,sz=rnd()<.5?1:-1,pts=[];
  for(let s2=0;s2<5;s2++){
    while(bl[ci][cj].tw)ci=Math.min(N-1,ci+1);
    const b=bl[ci][cj];pts.push(new THREE.Vector3(b.x,b.ht+.02,b.z));
    if(s2%2===0)ci=Math.max(0,Math.min(N-1,ci+sx*(1+Math.floor(rnd()*2))));else cj=Math.max(0,Math.min(N-1,cj+sz*(1+Math.floor(rnd()*2))));
  }
  let dist=0;for(let s2=1;s2<5;s2++)dist+=Math.hypot(pts[s2].x-pts[s2-1].x,pts[s2].z-pts[s2-1].z);
  const gold=dist/7+6;trials.push({name:tn[k],pts,gold,limit:gold*3});
  const m=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,40,16,1,true),new THREE.MeshBasicMaterial({color:0x1fd16b,transparent:true,opacity:.5,side:THREE.DoubleSide})); // green = trial start
  m.position.set(pts[0].x,pts[0].y+20,pts[0].z);S.add(m);
}
const target=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,60,16,1,true),new THREE.MeshBasicMaterial({color:0x2aa8ff,transparent:true,opacity:.6,side:THREE.DoubleSide}));target.visible=false;S.add(target); // blue = checkpoint
flushBatches();
// ---------- player ----------
