<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0b16"><title>Quote Machine ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>.quote-wrap{max-width:760px;margin:auto}.quote-card{text-align:center;padding:clamp(24px,6vw,56px);background:linear-gradient(145deg,#19192b,#10101e);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px #0006}.quote-mark{font-size:72px;line-height:.7;color:var(--pink);opacity:.8}.quote-text{font-size:clamp(25px,5vw,42px);line-height:1.25;letter-spacing:-.035em;margin:24px 0;color:#fff}.quote-author{color:var(--cyan);font:14px "DM Mono"}.quote-source{color:var(--muted);font:10px "DM Mono";margin-top:10px}.quote-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}.quote-actions button{border:0;border-radius:13px;padding:12px 17px;background:#f7f4ff;color:#11111f;font-weight:700;cursor:pointer}.quote-actions button.secondary{background:#ffffff09;color:#fff;border:1px solid var(--line)}.quote-status{text-align:center;color:var(--muted);font:11px "DM Mono";min-height:18px;margin-top:16px}@media(max-width:580px){.quote-card{padding:24px 18px}.quote-text{margin:20px 0}}</style></head><body><div class="w"><nav class="hp-page-nav"><a class="logo" href="index.html">✦ Hyper-Pop</a><div id="account-slot"></div></nav><header class="hero"><div class="e">💬</div><h1>Quote Machine</h1><p>Pull a fresh quote from the internet whenever you need a tiny dose of wisdom.</p></header><main class="box quote-wrap"><div class="quote-card"><div class="quote-mark">“</div><div id="quote" class="quote-text">Loading a quote...</div><div id="author" class="quote-author"></div><div class="quote-source">Source: DummyJSON Quotes API</div><div class="quote-actions"><button id="new">✨ New Quote</button><button id="copy" class="secondary">📋 Copy Quote</button></div><div id="status" class="quote-status"></div></div></main></div><script src="app.js"></script><script>
const quoteEl=document.getElementById('quote'),authorEl=document.getElementById('author'),statusEl=document.getElementById('status');
async function getQuote(){quoteEl.textContent='Fetching something wise...';authorEl.textContent='';statusEl.textContent='';try{const r=await fetch('https://dummyjson.com/quotes/random',{cache:'no-store'});if(!r.ok)throw new Error('Request failed');const q=await r.json();quoteEl.textContent='“'+q.quote+'”';authorEl.textContent='— '+q.author}catch(e){quoteEl.textContent='The internet wandered off. Try again!';authorEl.textContent='';statusEl.textContent='Could not reach the quote service.'}}
document.getElementById('new').onclick=getQuote;
document.getElementById('copy').onclick=async()=>{const text=quoteEl.textContent+(authorEl.textContent?' '+authorEl.textContent:'');try{await navigator.clipboard.writeText(text);statusEl.textContent='Copied to your clipboard! 📋'}catch(e){statusEl.textContent='Copy was blocked by the browser.'}};
getQuote();
</script></body></html>
