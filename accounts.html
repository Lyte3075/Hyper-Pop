<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Account ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"><style>
html{scroll-behavior:smooth}.w{width:100%;max-width:720px!important;padding:0 clamp(12px,3vw,20px)}.hp-page-nav{gap:10px;min-width:0}.hp-page-nav .logo{min-width:0;overflow-wrap:anywhere}.hp-page-nav #account-slot{min-width:0;max-width:55%}.hp-page-nav .accountbar{justify-content:flex-end;max-width:100%}.account-page{width:100%;min-width:0;overflow:hidden;margin:clamp(12px,3vw,24px) auto 50px;padding:clamp(16px,4vw,28px)}.account-page input,.account-page textarea{max-width:100%;min-width:0}.account-page h1{font-size:clamp(28px,7vw,42px);line-height:1.08;overflow-wrap:anywhere}.account-page #profileSettings{min-width:0}.account-page #profileSettings button,.account-page #avatarControls .btn{max-width:100%;overflow-wrap:anywhere}@media(max-width:480px){.hp-page-nav{height:auto!important;min-height:64px;padding:10px 0}.hp-page-nav .logo{font-size:14px}.hp-page-nav #account-slot{max-width:50%}.accountbar{gap:5px}.accountbar a{font-size:10px!important;padding:7px 8px!important;white-space:normal!important;text-align:center}.account-page{border-radius:18px}}
</style></head><body><div class="w"><nav class="hp-page-nav"><a class="logo" href="index.html">← Hyper-Pop</a><div id="account-slot"></div></nav><main class="auth-card account-page"><div class="account-avatar" id="avatar">👤</div><h1 id="title" style="text-align:center">Your Hyper-Pop Account</h1><p id="sub" class="account-sub">Create an account or log in to save leaderboard scores.</p><div class="credentials"><input id="u" maxlength="20" autocomplete="username" placeholder="Username"><input id="p" type="password" maxlength="100" autocomplete="current-password" placeholder="Password (6+ characters)"></div><button id="go">CREATE ACCOUNT</button><button id="switch" class="secondary">I ALREADY HAVE AN ACCOUNT</button><button id="logout" class="secondary" style="display:none">LOG OUT</button><section id="profileSettings" style="display:none;margin-top:24px;text-align:left"><h2 style="font-size:20px;margin:0 0 12px">Profile settings</h2><label for="displayName" class="account-sub" style="display:block;text-align:left">Display name</label><input id="displayName" maxlength="40" placeholder="How people see you"><label for="profileBio" class="account-sub" style="display:block;text-align:left;margin-top:10px">Bio</label><textarea id="profileBio" maxlength="160" placeholder="A little about you…" rows="3" style="display:block;width:100%;resize:vertical;margin:7px 0;padding:13px;border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:#fff;font:inherit"></textarea><button id="saveProfile">SAVE PROFILE</button><p id="profileMsg" class="account-sub" style="font-size:12px"></p></section><div id="avatarControls" style="margin-top:18px;text-align:center"><label class="btn alt" for="avatarFile" style="display:inline-block;cursor:pointer">📷 Upload Profile Picture</label><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none"><p id="avatarMsg" class="account-sub" style="font-size:12px">PNG, JPG, WEBP or GIF · max 2 MB</p></div><div class="msg" id="m"></div></main></div><script src="app.js?v=radio-12"></script><script src="account.js?v=profile-2"></script><script>
let login=false;
const u=document.getElementById('u'),p=document.getElementById('p'),go=document.getElementById('go'),sw=document.getElementById('switch'),lo=document.getElementById('logout'),m=document.getElementById('m'),title=document.getElementById('title'),sub=document.getElementById('sub'),avatar=document.getElementById('avatar'),profileSettings=document.getElementById('profileSettings'),displayName=document.getElementById('displayName'),profileBio=document.getElementById('profileBio'),profileMsg=document.getElementById('profileMsg'),avatarMsg=document.getElementById('avatarMsg');
async function load(){const me=await hpMe();if(me){title.textContent='@'+me.username;sub.textContent='You are signed in. Manage your profile, avatar, and account session here.';profileSettings.style.display='block';displayName.value=me.display_name||'';profileBio.value=me.bio||'';if(me.avatar_url){avatar.innerHTML='<img src="'+me.avatar_url+'" alt="Profile picture" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'}else avatar.textContent=(me.username||'?').slice(0,1).toUpperCase();u.style.display=p.style.display=go.style.display=sw.style.display='none';lo.style.display='block'}else{profileSettings.style.display='none';u.style.display=p.style.display=go.style.display=sw.style.display='block';lo.style.display='none'}}
sw.onclick=()=>{login=!login;go.textContent=login?'LOG IN':'CREATE ACCOUNT';sw.textContent=login?'I NEED AN ACCOUNT':'I ALREADY HAVE AN ACCOUNT';m.textContent=''};
go.onclick=async()=>{m.textContent='Working…';const x=await hpRpc(login?'hyperpop_login':'hyperpop_signup',{p_username:u.value.trim(),p_password:p.value});if(x.ok){localStorage.setItem('hyperpop_token',x.token);location.reload()}else m.textContent=x.error||'Something went wrong.'};
lo.onclick=hpLogout;
document.getElementById('saveProfile').onclick=async()=>{profileMsg.textContent='Saving…';const x=await hpRpc('hyperpop_update_profile',{p_token:hpToken(),p_display_name:displayName.value,p_bio:profileBio.value});if(x.ok){profileMsg.textContent='Profile saved! ✨';await load();document.querySelectorAll('.accountbar').forEach(n=>n.remove());document.querySelectorAll('[data-hp-account-loading]').forEach(n=>delete n.dataset.hpAccountLoading);if(typeof hpAccountBar==='function')hpAccountBar()}else profileMsg.textContent=x.error||'Could not save profile.'};
document.getElementById('avatarFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2097152){avatarMsg.textContent='That image is over 2 MB.';return}avatarMsg.textContent='Uploading…';const reader=new FileReader();reader.onload=async()=>{const z=await hpSetAvatar(reader.result);if(z.ok){avatar.innerHTML='<img src="'+reader.result+'" alt="Profile picture" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';avatarMsg.textContent='Saved to the cloud! ☁️'}else avatarMsg.textContent=z.error||'Upload failed.'};reader.readAsDataURL(f)};
load();
</script></body></html>
