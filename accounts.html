<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Account ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"></head><body><div class="w"><nav class="hp-page-nav"><a class="logo" href="index.html">← Hyper-Pop</a><div id="account-slot"></div></nav><main class="auth-card account-page"><div class="account-avatar" id="avatar">👤</div><h1 id="title" style="text-align:center">Your Hyper-Pop Account</h1><p id="sub" class="account-sub">Create an account or log in to save leaderboard scores.</p><div class="credentials"><input id="u" maxlength="20" autocomplete="username" placeholder="Username"><input id="p" type="password" maxlength="100" autocomplete="current-password" placeholder="Password (6+ characters)"></div><button id="go">CREATE ACCOUNT</button><button id="switch" class="secondary">I ALREADY HAVE AN ACCOUNT</button><button id="logout" class="secondary" style="display:none">LOG OUT</button><section id="profileSettings" style="display:none;margin-top:24px;text-align:left"><h2 style="font-size:20px;margin:0 0 12px">Profile settings</h2><label for="displayName" class="account-sub" style="display:block;text-align:left">Display name</label><input id="displayName" maxlength="40" placeholder="How people see you"><label for="profileBio" class="account-sub" style="display:block;text-align:left;margin-top:10px">Bio</label><textarea id="profileBio" maxlength="160" placeholder="A little about you…" rows="3" style="display:block;width:100%;resize:vertical;margin:7px 0;padding:13px;border:1px solid var(--line);border-radius:12px;background:#ffffff08;color:#fff;font:inherit"></textarea><button id="saveProfile">SAVE PROFILE</button><p id="profileMsg" class="account-sub" style="font-size:12px"></p></section><div id="avatarControls" style="margin-top:18px;text-align:center"><label class="btn alt" for="avatarFile" style="display:inline-block;cursor:pointer">📷 Upload Profile Picture</label><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none"><p id="avatarMsg" class="account-sub" style="font-size:12px">PNG, JPG, WEBP or GIF · max 2 MB</p></div><div class="msg" id="m"></div></main></div><script src="app.js?v=radio-12"></script><script src="account.js?v=profile-2"></script><script>let login=false;const u=document.getElementById('u'),p=document.getElementById('p'),go=document.getElementById('go'),sw=document.getElementById('switch'),lo=document.getElementById('logout'),m=document.getElementById('m'),title=document.getElementById('title'),sub=document.getElementById('sub'),avatar=document.getElementById('avatar');async function load(){const me=await hpMe();if(me){title.textContent='@'+me.username;sub.textContent='You are signed in. Your scores can be saved to Hyper-Pop leaderboards.';if(me.avatar_url){avatar.innerHTML='<img src="'+me.avatar_url+'" alt="Profile picture" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'}else avatar.textContent=me.username.slice(0,1).toUpperCase();u.style.display=p.style.display=go.style.display=sw.style.display='none';lo.style.display='block'}else{profileSettings.style.display='none';u.style.display=p.style.display=go.style.display=sw.style.display='block';lo.style.display='none'}}load();document.getElementById('saveProfile').onclick=async()=>{profileMsg.textContent='Saving…';const x=await hpRpc('hyperpop_update_profile',{p_token:hpToken(),p_display_name:displayName.value,p_bio:profileBio.value});if(x.ok){profileMsg.textContent='Profile saved! ✨';await load();if(typeof hpAccountBar==='function'){document.querySelectorAll('.accountbar').forEach(n=>n.remove());document.querySelectorAll('[data-hp-account-loading]').forEach(n=>delete n.dataset.hpAccountLoading);hpAccountBar()}}else profileMsg.textContent=x.error||'Could not save profile.'};sw.onclick=()=>{login=!login;go.textContent=login?'LOG IN':'CREATE ACCOUNT';sw.textContent=login?'I NEED AN ACCOUNT':'I ALREADY HAVE AN ACCOUNT';m.textContent=''};go.onclick=async()=>{m.textContent='Working…';const x=await hpRpc(login?'hyperpop_login':'hyperpop_signup',{p_username:u.value.trim(),p_password:p.value});if(x.ok){localStorage.setItem('hyperpop_token',x.token);location.reload()}else m.textContent=x.error||'Something went wrong.'};lo.onclick=hpLogout;document.getElementById('avatarFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>2097152){avatarMsg.textContent='That image is over 2 MB.';return}avatarMsg.textContent='Uploading…';const reader=new FileReader();reader.onload=async()=>{const z=await hpSetAvatar(reader.result);if(z.ok){avatar.innerHTML='<img src="'+reader.result+'" alt="Profile picture" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';avatarMsg.textContent='Saved to the cloud! ☁️'}else avatarMsg.textContent=z.error||'Upload failed.'};reader.readAsDataURL(f)};</script></body></html>
