<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Account ✦ Hyper-Pop</title><link rel="stylesheet" href="style.css"></head><body><div class="w"><nav><a class="back" href="index.html">← Hyper-Pop</a><span class="logo">✦ Hyper-Pop</span><div id="account-slot"></div></nav><main class="auth-card account-page"><div class="account-avatar" id="avatar">👤</div><h1 id="title" style="text-align:center">Your Hyper-Pop Account</h1><p id="sub" class="account-sub">Create an account or log in to save leaderboard scores.</p><div class="credentials"><input id="u" maxlength="20" autocomplete="username" placeholder="Username"><input id="p" type="password" maxlength="100" autocomplete="current-password" placeholder="Password (6+ characters)"></div><button id="go">CREATE ACCOUNT</button><button id="switch" class="secondary">I ALREADY HAVE AN ACCOUNT</button><button id="logout" class="secondary" style="display:none">LOG OUT</button><div class="msg" id="m"></div></main></div><script src="app.js"></script><script>let login=false;const u=document.getElementById('u'),p=document.getElementById('p'),go=document.getElementById('go'),sw=document.getElementById('switch'),lo=document.getElementById('logout'),m=document.getElementById('m'),title=document.getElementById('title'),sub=document.getElementById('sub'),avatar=document.getElementById('avatar');async function load(){const me=await hpMe();if(me){title.textContent='@'+me.username;sub.textContent='You are signed in. Your scores can be saved to Hyper-Pop leaderboards.';avatar.textContent=me.username.slice(0,1).toUpperCase();u.style.display=p.style.display=go.style.display=sw.style.display='none';lo.style.display='block'}else{u.style.display=p.style.display=go.style.display=sw.style.display='block';lo.style.display='none'}}load();sw.onclick=()=>{login=!login;go.textContent=login?'LOG IN':'CREATE ACCOUNT';sw.textContent=login?'I NEED AN ACCOUNT':'I ALREADY HAVE AN ACCOUNT';m.textContent=''};go.onclick=async()=>{m.textContent='Working…';const x=await hpRpc(login?'hyperpop_login':'hyperpop_signup',{p_username:u.value.trim(),p_password:p.value});if(x.ok){localStorage.setItem('hyperpop_token',x.token);location.reload()}else m.textContent=x.error||'Something went wrong.'};lo.onclick=hpLogout;</script></body></html>
